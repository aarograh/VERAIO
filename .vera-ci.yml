verain_standalone:
  tags:
    - heavy
    - vm
  before_script:
    - REPO_DIR=$CI_BUILDS_DIR/../repos
    - git clone --depth 1 --reference $REPO_DIR/tribits --dissociate file://$REPO_DIR/tribits TriBITS
    - TPL_DIR="/data/test_gcc/vera_tpls/TPL_build/install"
    - HDF5_DIR="${TPL_DIR}/hdf5-1.10.11"
    - HDF5_LIBRARY_NAMES="hdf5;hdf5_cpp;hdf5_fortran;hdf5_hl;hdf5_hl_cpp;hdf5_hl_fortran;z"
    - HDF5_INCLUDE_DIRS=${HDF5_DIR}/include
    - HDF5_LIBRARY_DIRS=${HDF5_DIR}/lib
    - export PATH="/opt/gcc/bin:/opt/mpi/openmpi/gcc-8.3.0/bin:${HDF5_DIR}/bin:$PATH"
    - export LD_LIBRARY_PATH="/opt/gcc/lib64:/opt/mpi/openmpi/gcc-8.3.0/lib:$BLAS_LIBRARY_DIRS:$LAPACK_LIBRARY_DIRS:$PETSC_LIBRARY_DIRS:$HDF_LIBRARY_DIRS:$LD_LIBRARY_PATH"

  script:
    - cmake -S . -B build
      -D VERAIO_TRIBITS_DIR="${CI_PROJECT_DIR}/TriBITS/tribits"
      -D VERAIO_ENABLE_VERAIn:BOOL=ON
      -D PYTHON_EXECUTABLE=/usr/bin/python2
      -D TPL_ENABLE_HDF5=ON
        -DHDF5_LIBRARY_DIRS:FILEPATH=${HDF5_LIBRARY_DIRS}
        -DHDF5_INCLUDE_DIRS:FILEPATH="${HDF5_INCLUDE_DIRS};${HDF5_INCLUDE_DIRS}/shared;${HDF5_INCLUDE_DIRS}/static"
        -DTPL_HDF5_INCLUDE_DIRS:FILEPATH="${HDF5_INCLUDE_DIRS};${HDF5_INCLUDE_DIRS}/shared;${HDF5_INCLUDE_DIRS}/static"
        -DHDF5_LIBRARY_NAMES:STRING=${HDF5_LIBRARY_NAMES}
      -D VERAIO_ENABLE_TESTS=ON
    - cmake --build build
    - ctest --test-dir build --output-on-failure

build_doc:
  image: savannah.ornl.gov/vera/veraio-docs:latest
  tags:
     - podman
  before_script:
    - REPO_DIR=$CI_BUILDS_DIR/../repos
    - git clone --depth 1 --reference $REPO_DIR/verain_usersmanual --dissociate file://$REPO_DIR/verain_usersmanual
  script:
    - podman pull savannah.ornl.gov/vera/veraio-docs
    - podman run --rm -v "$PWD":/workspace veraio-docs generate
    - podman run --rm -v "$PWD":/workspace veraio-docs build
    - cp verain_usersmanual/main.pdf verain_usersmanual.pdf
  artifacts:
    name: doc
    expire_in: 1 week
    paths:
      - verain_usersmanual.pdf

stages:
   - test
   - deploy

.testing_base:
  tags:
    - linux
  artifacts:
    paths:
      - build/Testing/Temporary/LastTestsFailed.log
      - build/Testing/Temporary/LastTest.log
      - build/Testing/Temporary/CTestCostData.txt
      - build/make.out
    expire_in: 1 week
    when: always

before_script:
  - source /data/test_gcc/gcc-8.3.0/load_dev_env.sh
  - export MPACT_DATA_DIR=/data/gitlab-runner/ref_repos/VERAData/MPACT
  - export SCALE_DATA_DIR=/data/gitlab-runner/ref_repos/VERAData/SCALE
  - VERA_DIR="/data/gitlab-runner/ref_repos/VERA"

vmcontinuous:
  extends: .testing_base
  variables:
    CTEST_BUILD_FLAGS: -j32
    CTEST_PARALLEL_LEVEL: "32"
    DART_TESTING_TIMEOUT: "3600"
    BLD_NAME: "gnu_release_debug"
  script:
    - cmake
      -D VERA_CONFIGURE_OPTIONS_FILE:FILEPATH="/data/gitlab-runner/ref_repos/VERA/cmake/std/gcc-8.3.0/mpi-release-debug-shared-options.cmake"
      -D VERA_ENABLE_TESTS:BOOL=ON
      -D DART_TESTING_TIMEOUT:STRING=600.00
      -D VERA_ENABLE_VERAIn:BOOL=ON
      -D VERAData_DIR=/data/gitlab-runner/ref_repos/VERAData
      -D VERA_ENABLE_VERAout:BOOL=ON
      -D VERA_IGNORE_MISSING_EXTRA_REPOSITORIES:BOOL=ON 
      -D VERA_ENABLE_KNOWN_EXTERNAL_REPOS_TYPE:STRING=Continuous
      -D VERA_ENABLE_TESTS:BOOL=ON
      -D VERA_TEST_CATEGORIES:STRING=CONTINUOUS
      -D VERA_TRIBITS_DIR=/data/gitlab-runner/ref_repos/TriBITS/tribits
      -D Trilinos_SOURCE_DIR="/data/gitlab-runner/ref_repos/Trilinos"
      -S /data/gitlab-runner/ref_repos/VERA -B ${CI_PROJECT_DIR}/build
    - cmake --build ${CI_PROJECT_DIR}/build -j16
    - ctest --test-dir ${CI_PROJECT_DIR}/build -j16
    
gnu-debug:
    extends: .testing_base
    variables:
        CTEST_BUILD_FLAGS: -j32
        CTEST_PARALLEL_LEVEL: "32"
        DART_TESTING_TIMEOUT: "3600"
        BLD_NAME: "gnu_release_debug"
    stage: test
    script:
    - cmake
      -D VERA_CONFIGURE_OPTIONS_FILE:FILEPATH="/data/gitlab-runner/ref_repos/VERA/cmake/std/gcc-8.3.0/mpi-release-debug-shared-options.cmake"
      -D VERA_ENABLE_TESTS:BOOL=ON
      -D DART_TESTING_TIMEOUT:STRING=600.00
      -D VERA_ENABLE_VERAIn:BOOL=ON
      -D VERAData_DIR=/data/gitlab-runner/ref_repos/VERAData
      -D VERA_ENABLE_VERAout:BOOL=ON
      -D VERA_IGNORE_MISSING_EXTRA_REPOSITORIES:BOOL=ON 
      -D VERA_ENABLE_KNOWN_EXTERNAL_REPOS_TYPE:STRING=Continuous
      -D VERA_ENABLE_TESTS:BOOL=ON
      -D VERA_TEST_CATEGORIES:STRING=CONTINUOUS
      -D VERA_TRIBITS_DIR=/data/gitlab-runner/ref_repos/TriBITS/tribits
      -D Trilinos_SOURCE_DIR="/data/gitlab-runner/ref_repos/Trilinos"
      -S /data/gitlab-runner/ref_repos/VERA -B ${CI_PROJECT_DIR}/build
    - cmake --build ${CI_PROJECT_DIR}/build -j16
    - ctest --test-dir ${CI_PROJECT_DIR}/build -j16
    rules:
        - if: $CI_MERGE_REQUEST_ID  

trigger_build:
    stage: deploy
    variables:
        CI_RUN_ONLY: "CONTINUOUS"
        CI_VERAIO_REF: $CI_COMMIT_REF_NAME
        PACKAGE_TEST: VERAIO
        VERA_ENABLES: "-DVERA_ENABLE_VERAIn:BOOL=ON -DVERA_ENABLE_VERAout:BOOL=ON"
        VERA_BRANCH:  $BRANCH
    trigger: 
        project: VERA/VERA
        branch: master
        strategy: depend
    rules:
        - if: $CI_MERGE_REQUEST_ID

    
trigger_build_HEAVY:
    stage: deploy
    variables:
        CI_RUN_ONLY: "HEAVY"
        CI_VERAIO_REF: $CI_COMMIT_REF_NAME
        PACKAGE_TEST: VERAIO
        VERA_ENABLES: "-DVERA_ENABLE_VERAIn:BOOL=ON -DVERA_ENABLE_VERAout:BOOL=ON"
        VERA_BRANCH:  $BRANCH
    trigger: 
        project: VERA/VERA
        branch: master
        strategy: depend
    rules:
        - if: $CI_MERGE_REQUEST_ID
          when: manual

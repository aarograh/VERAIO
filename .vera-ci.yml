stages:
   - test
   - deploy

.ecode: &ecode |
    function ecc () {
        "$@"
        if [[ $? -ne 0 ]]; then exit 1; fi
    }
 
before_script:
    - *ecode
    - echo "start"
#set base development enviornment based on machine directory structure
    - if [[ -f "/data/test_gcc/gcc-5.4.0/load_dev_env.sh" ]]; then BASE_DIR="/data/gitlab-runner"; . /data/test_gcc/gcc-5.4.0/load_dev_env.sh; ENV_BASE=/data/test_gcc/gcc-5.4.0; else BASE_DIR="/localhome/gitlab-runner"; . /projects/vera/gcc-5.4.0/load_dev_env.sh; ENV_BASE=/projects/vera/gcc-5.4.0; fi 
    - ${ENV_BASE}/common_tools/gitdist pull
    - SRC_DIR=${PWD}
    - SRC_BASE_DIR=${SRC_DIR}/..
    - cd ${BASE_DIR}
#set package
    - PACKAGE_TEST=VERAInExt
#clean out build directory
    - (if [[ ! -d "builds" ]]; then mkdir builds; fi)
    - cd builds
    - (if [[ ! -d "VERA" ]]; then git clone git@code-int.ornl.gov:CASL/VERA; fi)
    - cd VERA
    - git pull
    - BASE_VERA_DIR=${PWD}
    - (if [[ ! -d "TriBITS" ]]; then git clone git@code-int.ornl.gov:CASL/TriBITS; fi)
    - env VERA_INCL_CEData=ON cmake/tribits/ci_support/clone_extra_repos.py
    - ${ENV_BASE}/common_tools/gitdist pull
    - cd VERAData/CEData
    - ${ENV_BASE}/common_tools/git-lfs pull
    - cd ${BASE_VERA_DIR}
    - echo ${BASE_VERA_DIR}
    - ls -lrt 
#set up links to add package source to full source directory
    - (if [[ -d "${PACKAGE_TEST}" ]]; then rm -rf VERAInExt; fi)
    - (if [[ ! -L "${PACKAGE_TEST}" ]]; then ln -s ${SRC_DIR} VERAInExt; fi)

vmcontinuous:
    variables:
        CTEST_BUILD_FLAGS: -j32
        CTEST_PARALLEL_LEVEL: "32"
        DART_TESTING_TIMEOUT: "3600"
        BLD_NAME: "gnu_release_debug"
    script:
    - SRC_DIR=`pwd`
    - BLD_DIR=${BASE_DIR}/builds/VERAInExt
    - (if [[  -d "${BLD_DIR}" ]]; then rm -rf ${BLD_DIR}; fi)
    - mkdir -p ${BLD_DIR}
    - cd $BLD_DIR
    - rm -rf do-configure
    - ln -s ${BASE_VERA_DIR}/cmake/std/gcc-5.4.0/do-configure.MPI_RELEASE_DEBUG_SHARED do-configure
    - rm -rf CMake*
    - ecc ./do-configure -DVERA_ENABLE_VERAIn:BOOL=ON -DVERA_ENABLE_VERAout:BOOL=ON -DVERA_IGNORE_MISSING_EXTRA_REPOSITORIES:BOOL=ON -DVERA_ENABLE_KNOWN_EXTERNAL_REPOS_TYPE:STRING=Continuous -DVERA_ENABLE_TESTS:BOOL=ON -DVERA_TEST_CATEGORIES:STRING=CONTINUOUS
    - ecc make -j16
    - ecc ctest -j16
    - cd ${BASE_VERA_DIR}
    - (if [[ -L "${PACKAGE_TEST}" ]]; then rm -rf VERAInExt; fi)
    - echo $CI_COMMIT_REF_NAME
    tags:
        - linux
    
 
gnu-debug:
    variables:
        CTEST_BUILD_FLAGS: -j32
        CTEST_PARALLEL_LEVEL: "32"
        DART_TESTING_TIMEOUT: "3600"
        BLD_NAME: "gnu_release_debug"
    stage: test
    script:
    - SRC_DIR=`pwd`
    - BLD_DIR=${BASE_DIR}/builds/VERAInExt
    - (if [[  -d "${BLD_DIR}" ]]; then rm -rf ${BLD_DIR}; fi)
    - mkdir -p ${BLD_DIR}
    - cd $BLD_DIR
    - rm -rf do-configure
    - ln -s ${BASE_VERA_DIR}/cmake/std/gcc-5.4.0/do-configure.MPI_RELEASE_DEBUG_SHARED do-configure
    - rm -rf CMake*
    - ecc ./do-configure -DVERA_ENABLE_VERAIn:BOOL=ON -DVERA_ENABLE_VERAout:BOOL=ON
    - ecc make -j16
    - ecc ctest -j28
    - cd ${BASE_VERA_DIR}
    - (if [[ -L "${PACKAGE_TEST}" ]]; then rm -rf VERAInExt; fi)
    - CI_RUN_ONLY=CHECKIN
    - echo $CI_COMMIT_REF_NAME        
    - echo "triggering downstream build"
    - if git ls-remote --heads git@code-int.ornl.gov:CASL/VERA $CI_COMMIT_REF_NAME | wc -l >/dev/null; then BRANCH=${CI_COMMIT_REF_NAME}; else BRANCH=master; fi
    - echo "${BRANCH}"
    rules:
        - if: $CI_MERGE_REQUEST_ID  
    tags:
        - linux

trigger_build:
    stage: deploy
    variables:
        CI_RUN_ONLY: "CHECKIN"
        CI_VERAInExt_REF: $CI_COMMIT_REF_NAME
        PACKAGE_TEST: VERAInExt
        VERA_ENABLES: "-DVERA_ENABLE_VERAIn:BOOL=ON -DVERA_ENABLE_VERAout:BOOL=ON"
        VERA_BRANCH:  $BRANCH
    trigger: 
        project: CASL/VERA
        branch: $BRANCH
        strategy: depend
    rules:
        - if: $CI_MERGE_REQUEST_ID

    

[loggers]
keys=root,config,job

[handlers]
keys=fileHandler

[formatters]
keys=simpleFormatter

[logger_root]
level=DEBUG
handlers=fileHandler

[logger_config]
level=DEBUG
handlers=fileHandler
propagate=0
qualname=config

[logger_job]
level=DEBUG
handlers=fileHandler
propagate=0
qualname=job

[handler_fileHandler]
class=FileHandler
level=NOTSET
formatter=simpleFormatter
#args=( os.path.join( os.environ[ 'HOME' ], 'verarun.log' ), 'w' )
#args=( os.path.join( os.path.abspath( os.curdir ), 'verarun.log' ), 'a' )
args=( os.path.join( os.environ[ 'HOME' ], '.verarun', 'verarun.log' ), 'w' )

[formatter_simpleFormatter]
class=logging.Formatter
#format=%(asctime)s %(levelname)s %(name)s: %(message)s
format=%(asctime)s %(levelname)s %(name)s %(module)s:%(lineno)d [%(funcName)s]:
  %(message)s
dateFmt=%Y-%m-%dT%H:%M:%S

!Options for Linear MOC Solver in MPACT.
! - Recomended options for linear MOC solver.
! - Smaller number of meshes are used for fuel, gtube, and rect.
! - Fuel pellet is divided into two regions in radially. Instead of
!   using equi-volume divisions, a fractional radius input is used
!   by rad_fuel_mesh. This mesh divisions are made to accurately
!   capture rim effect.
! - TODO: Determine mesh for gad pin.
!
!Include this file in the MPACT block to use
!
![MPACT]
  split_TL          false
  radial_src_order  1
  mesh fuel         2 1 1 / 1 1 1 1 4
  mesh gtube        1 1   / 1 1 1
  pin_cell_mod_mesh 0 both
  mesh rect         2 2
  rad_fuel_mesh     0.875

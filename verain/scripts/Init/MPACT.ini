![MPACT]
   vis_edits         none
   coupling_method   ctf
   rod_treatment     true
!  grid_treatment    equal_mass

!moc
   ray_spacing       0.05
   azimuthals_octant 16
   polars_octant     2
   quad_type         CHEBYSHEV-YAMAMOTO

!iteration_control
   k_tolerance       1e-6
   flux_tolerance    1e-6
   num_inners        2
   num_outers        500
   up_scatter        1
   scattering        P2

!cmfd
   cmfd              cmfd
   cmfd_solver       mgnode  !1gsweep
   k_shift           1.5
   cmfd_num_outers   20

!2D1D
   split_TL          true
   TL_treatment      lflat
   nodal_method      sp3
 ! under_relax       1.0

!parallel
   num_space         1 
   num_angle         1
   num_energy        1
   num_threads       1
 ! par_method        EXPLICITFILE
 ! par_file          partition.txt

!xs_library
   xs_filename       mpact47g_70s_v3.1_11032014.fmt
   xs_type           ORNL
   subgroup_set      4
!  dep_filename      mpact.dpl
   dep_edit          false

 !mesh
   mesh fuel         3 1 1 / 8 8 8 8 8 8
   mesh gtube        3 1   / 8 8 8 8 8
   automesh_bounds   2 20                   ! min, max
   meshing_method    nonfuel

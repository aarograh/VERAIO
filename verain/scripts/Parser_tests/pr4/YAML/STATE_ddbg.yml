---
STATE:
  _content:
    bank_labels:
      _content:
        - 1
      _do:
        - 'copyarray STATE/@rodbank,select=>even'
      _pltype: array
      _type: string
    bank_pos:
      _content:
        - 167
      _do:
        - 'copyarray STATE/@rodbank,select=>odd'
      _pltype: array
      _type: int
    boron:
      _content: 1300
      _do:
        - copy STATE/$boron
      _pltype: parameter
      _type: double
    bypass:
      _content: ~
      _do:
        - copy STATE/$bypass
      _pltype: parameter
      _type: double
    dexp:
      _content: ~
      _do:
        - copy STATE/$dexp
      _pltype: parameter
      _type: double
    feedback:
      _content: off
      _do:
        - copy STATE/$feedback
      _pltype: parameter
      _type: string
    flow:
      _content: ~
      _do:
        - copy STATE/$flow
      _pltype: parameter
      _type: double
    kcrit:
      _content: ~
      _do:
        - copy STATE/$kcrit
      _pltype: parameter
      _type: double
    modden:
      _content: 0.743
      _do:
        - copy STATE/$modden
      _pltype: parameter
      _type: double
    power:
      _content: 0.0
      _do:
        - copy STATE/$power
      _pltype: parameter
      _type: double
    pressure:
      _content: ~
      _do:
        - copy STATE/$pressure
      _pltype: parameter
      _type: double
    samopt:
      _content: ~
      _do:
        - copy STATE/$samar
      _pltype: parameter
      _type: string
    search:
      _content: ~
      _do:
        - copy STATE/$search
      _pltype: parameter
      _type: string
    sym:
      _content: qtr
      _do:
        - copy STATE/$sym
      _pltype: parameter
      _type: string
    tfuel:
      _content: 620.33
      _do:
        - copy STATE/$tfuel
      _pltype: parameter
      _type: double
    tinlet:
      _content: 362.405555555556
      _do:
        - 'copy STATE/$tinlet,apply=>($_[0]+32)*5/9'
      _pltype: parameter
      _type: double
    title:
      _content: ~
      _do:
        - copy STATE/$title
      _pltype: parameter
      _type: string
    xenopt:
      _content: ~
      _do:
        - copy STATE/$xenon
      _pltype: parameter
      _type: string
  _do:
    - setdb MAIN_DB
  _pltype: list

      - in_dictionary() on off
#>
#>   {\bf thexp} thermal\_expansion\_option
#>   \VERAInputTable{
#>     name={thermal\_expansion\_option},
#>     type={Character String},
#>     need={Optional},
#>     unitsdefault={},
#>     unitsother={},
#>     valuedefault={on},
#>     valuesapplicable={off},
#>     limitations={},
#>     description={Perform thermal expansion.},
#>     notes={Additional thermal expansion options are given on other input cards.}
#>   }
  thexp:
    <<: *dtword
    _content:
    _check:
      - is_word()
      - in_dictionary() on off
#>
#>   {\bf thexp\_tfuel} fuel\_thermal\_expansion\_temperature units
#>   \VERAInputTable{
#>     name={fuel\_thermal\_expansion\_temperature},
#>     type={Float},
#>     need={Optional},
#>     unitsdefault={K},
#>     unitsother={F, C},
#>     valuedefault={293 K},
#>     valuesapplicable={},
#>     limitations={},
#>     description={Temperature to use for thermal expansion of fuel. If not present,
#>        \texttt{tfuel} is used instead. If both \texttt{thexp\_tfuel} and
#>        \texttt{tfuel} are not specified, \texttt{tinlet} will be used.},
#>     notes={Example: \texttt{900 K}}
#>   }
  thexp_tfuel:
    <<: *dtlist
    _content:
    _check:
      - arraysize()==2
      - is_float(nth(0,()))
      - is_word(nth(1,()))
      - in_dictionary(nth(1,()),'F','C','K')
#>
#>   {\bf thexp\_tclad} clad\_thermal\_expansion\_temperature units
#>   \VERAInputTable{
#>     name={clad\_thermal\_expansion\_temperature},
#>     type={Float},
#>     need={Optional},
#>     unitsdefault={K},
#>     unitsother={F, C},
#>     valuedefault={293 K},
#>     valuesapplicable={},
#>     limitations={},
#>     description={Temperature to use for thermal expansion of clad. If not present,
#>        \texttt{thexp\_tmod} is used instead. If both \texttt{thexp\_tfuel} and
#>        \texttt{thexp\_tmod} are not specified, \texttt{tinlet} will be used.},

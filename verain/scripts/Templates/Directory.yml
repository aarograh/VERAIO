#>         \item \texttt{pos\_N} --- The number of steps withdrawn at a given time step.  %
#>       \end{itemize}                                                                   %
#>       },
#>     notes={This feature is still under development and is not yet operational.}
#>   }
  bank_wd:
    <<: *dtlist
    _style: multi-line
    _content:
    _check:
      - is_word(nth(0,()))
      - fall(sub{is_float(shift)},stride(1,2,()))
      - fall(sub{is_geq(shift,0)},stride(1,2,()))
      - fall(sub{is_int(shift)},stride(2,2,()))
      - fall(sub{is_gt(shift,0)},stride(2,2,()))
      - arraysize()%2==1
#>
#>   {\bf scram\_lock} bank\_label
#>   \VERAInputTable{
#>     name={bank\_label},
#>     type={List of Free Form Character Strings},
#>     need={Optional},
#>     unitsdefault={},
#>     unitsother={},
#>     valuedefault={},
#>     valuesapplicable={\texttt{true}},
#>     limitations={Requires scram\_type card.},

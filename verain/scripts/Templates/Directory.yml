#>
#>   {\bf nonlinear\_coupling\_method} unknown\_quantity method
#>   \VERAInputTable{
#>     name={unknown\_quantity},
#>     type={String},
#>     need={Optional},
#>     unitsdefault={},
#>     unitsother={},
#>     valuedefault={},
#>     valuesapplicable={pin\_powers, mod\_dens},
#>     limitations={},
#>     description={Specifies which unknown quantities the user would like to choose the solution
#>                  procedure for.},
#>     notes={Only effective for coupled (multiphysics) simulations. If the
#>            \texttt{nonlinear\_coupling\_method} card is not used all unknowns default to being
#>            solved with Picard iterations.}
#>   }
#>   \VERAInputTable{
#>     name={method},
#>     type={String},
#>     need={Optional},
#>     unitsdefault={},
#>     unitsother={},
#>     valuedefault={picard},
#>     valuesapplicable={anderson, partconv},
#>     limitations={},
#>     description={Solution method to be used for the specified coupling unknown.},
#>     notes={Only effective for coupled (multiphysics) simulations. When \texttt{partconv} is
#>            is used, anderson should not be used for the other paramters and relaxation factor
#>            should be 1.}
#>   }
  nonlinear_coupling_method:
    <<: *dtlist
    _style: multi-line
    _content:
    _check:
      - arraysize()%2==0
      - fall(sub{is_word(shift)},())
      - fall(sub{in_dictionary(shift,'pin_powers','mod_dens')},stride(0,2,()))
      - fall(sub{in_dictionary(shift,'picard','anderson','partconv')},stride(1,2,()))
#>
#>   {\bf anderson\_options} unknown\_quantity depth mixing\_parameter starting\_iteration
#>   \VERAInputTable{
#>     name={unknown\_quantity},
#>     type={String},
#>     need={Optional},
#>     unitsdefault={},
#>     unitsother={},
#>     valuedefault={},
#>     valuesapplicable={pin\_powers, mod\_dens},
#>     limitations={},
#>     description={Specifies which unknown quantities the user would like to set the anderson
#>                  solver control parameters for.},
#>     notes={Only effective for coupled (multiphysics) simulations and if anderson was
#>            chosen for the \texttt{nonlinear\_coupling\_method} corresponding to the specified
#>            \texttt{unknown\_quantity}}
#>   }
#>   \VERAInputTable{
#>     name={depth},
#>     type={Integer},
#>     need={Optional},
#>     unitsdefault={},
#>     unitsother={},
#>     valuedefault={1},
#>     valuesapplicable={$ \ge1$, $<1000$},
#>     limitations={},
#>     description={In Anderson Acceleration the \texttt{depth} is the number of previous iterates
#>                  the solver should use in generating better future iterates. Larger choices
#>                  for \texttt{depth} result in more aggressive acceleration, however, this can lead
#>                  to instability and slower speed overall for highly nonlinear problems.
#>                  A \texttt{depth} of 0 is equivalent to classic Picard iteration.},
#>     notes={Only effective for coupled (multiphysics) simulations}
#>   }
#>   \VERAInputTable{
#>     name={mixing\_parameter},
#>     type={Float},
#>     need={Optional},
#>     unitsdefault={},
#>     unitsother={},
#>     valuedefault={0.5},
#>     valuesapplicable={$ >0.0$, $\le1.0$},
#>     limitations={},
#>     description={The \texttt{mixing\_parameter} can be viewed as a damping or under-relaxation
#>                  factor in the Anderson solution scheme. Obviously this means larger choices for
#>                  it can result in more aggressive acceleration, though that does not always
#>                  translate into better performance. The optimum choice for it will be problem
#>                  dependant, with the default of 0.5 being quite conservative.},
#>     notes={Only effective for coupled (multiphysics) simulations}
#>   }
#>   \VERAInputTable{
#>     name={starting\_iteration},
#>     type={Integer},
#>     need={Optional},
#>     unitsdefault={},
#>     unitsother={},
#>     valuedefault={1},
#>     valuesapplicable={$ >0$, $<1000$},
#>     limitations={},
#>     description={The \texttt{starting\_iteration} is the iteration the user would like Anderson
#>                  to actually start accelerating the chosen unknown. While the iteration
#>                  count is below this number the Anderson solver will proceed like classic
#>                  Picard using the \texttt{mixing\_parameter} as an under-relaxation factor. Normally
#>                  the default choice of 1 is best.},
#>     notes={Only effective for coupled (multiphysics) simulations}
#>   }
  anderson_options:
    <<: *dtlist
    _style: multi-line
    _content:
    _check:
      - arraysize()%4==0
      - fall(sub{in_dictionary(shift,'pin_powers','mod_dens')},stride(0,4,()))
      - fall(sub{is_int(shift)},stride(1,4,()))
      - fall(sub{is_float(shift)},stride(2,4,()))
      - fall(sub{is_int(shift)},stride(3,4,()))
      - fall(sub{0<=(shift)},stride(1,4,()))
      - fall(sub{0.0<(shift)},stride(2,4,()))
      - fall(sub{0<(shift)},stride(3,4,()))
      - fall(sub{1000>(shift)},stride(1,4,()))
      - fall(sub{1.0=>(shift)},stride(2,4,()))
      - fall(sub{1000>(shift)},stride(3,4,()))
#>
#>   {\bf partconv\_opt} gammamode est\_fdintense dperturb fdmul par\_nchk par\_multchk
#>   \VERAInputTable{
#>    name={gammamode},
#>    type={String},
#>    need={Optional},
#>    unitsdefault={},
#>    unitsother={},
#>    valuedefault={hyb},
#>    valuesapplicable={debug, maxave. These described as:                             %
#>       \begin{itemize}
#>          \item \texttt{debug} --- print out the feedback intensity for each         %
#>            iteration                                                                %
#>          \item \texttt{maxave} ---use either the maximum or flux-weighted feedback  %
#>            intensity                                                                %
#>          \item \texttt{hyb} ---use maximum feedback intensity when shielding        %
#>            calulation has been performed; use flux-weighted feedback intensity      %
#>            when not                                                                 %
#>       \end{itemize}},
#>    limitations={},
#>    description={This card is used to define the solver method for the               %
#>                 nearly-optimal partial converged CMFD nonlinear solver.},
#>    notes={The card is only used when \texttt{partconv} is specified in              %
#>           \texttt{nonlinear\_coupling\_method}.}
#>   }
#>   \VERAInputTable{
#>    name={est\_fdintense},
#>    type={Float},
#>    need={Optional},
#>    unitsdefault={},
#>    unitsother={},
#>    valuedefault={1.5e-3},
#>    valuesapplicable={$ >0$, $<1$},
#>    limitations={},
#>    description={This card is used to specify the estimated feedback intensity     %
#>                 before calculating the feedback intensity.},
#>    notes={The card is only used when \texttt{partconv} is specified in            %
#>           \texttt{nonlinear\_coupling\_method}.}
#>   }
#>   \VERAInputTable{
#>    name={dperturb},
#>    type={Float},
#>    need={Optional},
#>    unitsdefault={},
#>    unitsother={},
#>    valuedefault={5e-3},
#>    valuesapplicable={$ >0$},
#>    limitations={},
#>    description={This card is used to specify the perturbation factor to calculate %
#>                 the feedback intensity.},
#>    notes={The card is only used when \texttt{partconv} is specified in            %
#>           \texttt{nonlinear\_coupling\_method}.}
#>   }
#>   \VERAInputTable{
#>    name={fdmul},
#>    type={Float},
#>    need={Optional},
#>    unitsdefault={},
#>    unitsother={},
#>    valuedefault={1.0},
#>    valuesapplicable={},
#>    limitations={},
#>    description={This card is used to specify the mulitplication factor applied to   %
#>                 the feedback intensity calculated during the perturbation.          %
#>                 When \texttt{gammamode} is \texttt{maxave} or \texttt{debug},       %
#>                 a positive input makes the feedback intensity the maximum of all    %
#>                 the feedback intensities;                                           %
#>                 while a negative input makes value the flux-weighted of all the     %
#>                 feedback intensities.},
#>    notes={The card is only used when \texttt{partconv} is specified in              %
#>           \texttt{nonlinear\_coupling\_method}. The mulfiplication factor is        %
#>           applied to the feedback intensities that is calculated from perturbation.}
#>   }
#>   \VERAInputTable{
#>    name={par\_nchk},
#>    type={Integer},
#>    need={Optional},
#>    unitsdefault={},
#>    unitsother={},
#>    valuedefault={4},
#>    valuesapplicable={$ >0$},
#>    limitations={},
#>    description={The initial guess of the flux is flat and far from its converged    %
#>                 value for the single-state simulation and the first state of the    %
#>                 multi-state simulation. The \texttt{par\_nchk} is the index of the  %
#>                 iteration at which the user believes the flux is close to its       %
#>                 converged value for the first state and the estimation of the       %
#>                 feedback intensity can be performed.},
#>    notes={The card is only used when \texttt{partconv} is specified in              %
#>           \texttt{nonlinear\_coupling\_method} and the calculation is a multi-state %
#>           simulation.}
#>   }
#>   \VERAInputTable{
#>    name={par\_multchk},
#>    type={Integer},
#>    need={Optional},
#>    unitsdefault={},
#>    unitsother={},
#>    valuedefault={2},
#>    valuesapplicable={$ >0$},
#>    limitations={},
#>    description={The \texttt{par\_multchk} is the index of the iteration at which    %
#>                 the user believes the flux is close to its converged value          %
#>                 for the states other than the first state and the estimation of the %
#>                 feedback intensity can be performed.},
#>    notes={The card is only used when \texttt{partconv} is specified in              %
#>           \texttt{nonlinear\_coupling\_method}.}
#>   }
  partconv_opt:
    <<: *dtlist
    _content:
    _check:
      - arraysize()==6
      - is_word(nth(0,()))
      - in_dictionary(nth(0,()),'hyb','maxave','debug')
      - is_float(nth(1,()))
      - is_float(nth(2,()))
      - is_float(nth(3,()))
      - is_int(nth(4,()))
      - is_int(nth(5,()))
      - nth(1,())>0
      - nth(1,())<1
      - nth(2,())>0
      - nth(4,())>0
      - nth(5,())>0

#>
#>   {\bf trip\_time} trip\_time
#>   \VERAInputTable{
#>     name={trip\_time},
#>     type={double},
#>     need={Optional},
#>     unitsdefault={},
#>     unitsother={},
#>     valuedefault={},
#>     valuesapplicable={\texttt{true}},
#>     limitations={Requires scram\_type card.},

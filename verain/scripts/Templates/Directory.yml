#>
#>   {\bf edit} state\_edits
#>   \VERAInputTable{
#>     name={state\_edits},
#>     type={Character String},
#>     need={Optional},
#>     unitsdefault={},
#>     unitsother={},
#>     valuedefault={pin\_powers, pin\_exposures, core\_flux, pin\_fuel\_temp,
#>        pin\_isotopes\_Xe-135, pin\_mod\_dens (if PWR), pin\_mod\_temp (if PWR),
#>        pin\_cool\_dens (if BWR), pin\_cool\_temp (if BWR), pin\_cool\_void (if BWR)},
#>     valuesapplicable={none, pin\_isotopes\_<ZZ-AAA> (isotope ``all''),
#>        intrapin\_<mat\_type>\_isotopes\_<ZZ-AAA> (isotope ``all''),
#>        fsr\_isotopes\_<ZZ-AAA> (isotope ``all''), point\_isotopes\_<ZZ-AAA> (isotope ``all''),
#>        pin\_flux\_<GGG> (``fast'' ``thermal'' ``2g'' 3-digit group omit for all groups),
#>        fsr\_flux\_<GGG> (``fast'' ``thermal'' ``2g'' 3-digit group omit for all groups),
#>        point\_flux\_<GGG> (``fast'' ``thermal'' ``2g'' 3-digit group omit for all groups), core\_flux,
#>        intrapin\_<mat\_type>\_<edit\_type> (mat\_type: fuel gap clad mod cool edit\_type: dens temp volume isotopes\_<ZZ-AAA>)
#>        intrapin\_fluence, intrapin\_exposure, fsr\_delayed-chi, fsr\_dnpy},
#>     limitations={},
#>     description={This is a list of state variables to be edited. By default, MPACT edits
#>        \texttt{pin\_powers}, \texttt{pin\_exposures}, \texttt{core\_flux},
#>        \texttt{pin\_fuel\_temp}, and \texttt{pin\_isotopes\_Xe-135}. For PWR cases,
#>        \texttt{pin\_mod\_dens} and \texttt{pin\_mod\_temp} are added to the default
#>        edits; for BWR cases, \texttt{pin\_cool\_dens}, \texttt{pin\_cool\_temp}, and
#>        \texttt{pin\_cool\_void} are added to the default edits. Once an edit is enabled,
#>        it remains enabled until all edits are disabled using the \texttt{none} option. If
#>        the \texttt{none} option appears in the same state as other edit names, then all
#>        previously enabled edits are disabled first, and then the edits named at the same state
#>        as \texttt{none} are enabled. The default edits are never disabled, even if
#>        \texttt{none} is specified. \newline
#>        \newline
#>        Individual isotopes can be edited using \texttt{pin\_isotopes\_} followed by the
#>        isotope in ZZ-AAA format. For example, \texttt{pin\_isotopes\_U-235}. The same is
#>        true for \texttt{intrapin\_<mat\_type>\_isotopes\_}, \texttt{fsr\_isotopes\_}, and
#>        \texttt{point\_isotopes\_}. Similarly, group fluxes can be edited using
#>        \texttt{pin\_flux\_} followed by a 3-digit group identifier. For example,
#>        \texttt{pin\_flux\_001} gives the fast group, and \texttt{pin\_flux\_051} gives the
#>        most thermal group when using a 51-group cross section library. The same is
#>        true for \texttt{point\_flux\_} and \texttt{fsr\_flux\_}. It should be noted
#>        that the \texttt{core\_flux} edit automatically implies the core-averaged flux
#>        for each group, so \texttt{core\_flux\_001} is not a valid option. \newline
#>        \newline
#>        Intrapin edits may be requested using the following entry format
#>        \texttt{intrapin\_<mat\_type>\_<edit\_type>}. Currently supported \texttt{mat\_type}
#>        values include \texttt{fuel}, \texttt{gap}, \texttt{clad}, \texttt{mod}, and \texttt{cool}.
#>        \texttt{intrapin\_<edit\_type>} may also be used for editing all material intrapin
#>        values. Currently supported \texttt{edit\_type} values include \texttt{dens},
#>        \texttt{temp}, \texttt{volume}, and \texttt{isotopes\_}. Two additional intrapin
#>        edits---\texttt{intrapin\_fluence} for the fluence of all intrapin regions, and
#>        \texttt{intrapin\_exposure} for the intrapin fuel burnup distribution---are also supported.
#>        When intrapin edits are requested, they are compressed into a 1D array in the output
#>        HDF5 file. This 1D array can be translated into a more traditional core map
#>        representation using the accompanying \texttt{intrapin\_<mat\_type>\_PinFirstRegionIndex}
#>        and \texttt{intrapin\_<mat\_type>\_PinNumRegions} datasets generated for each
#>        \texttt{mat\_type} requested. \texttt{intrapin\_<mat\_type>\_PinFirstRegionIndex}
#>        indicates the starting index of a given pin location in the 1D array, and
#>        \texttt{intrapin\_<mat\_type>\_PinNumRegions} indicates the number of values
#>        associated with said pin that occur sequentially in the 1D array starting at the
#>        corresponding \texttt{intrapin\_<mat\_type>\_PinFirstRegionIndex} starting index. \newline
#>        \newline
#>        MPACT provides a number of collections of edits for ease of use:
#>        \begin{itemize}
#>          \item \texttt{pin\_flux\_2g} implies both \texttt{pin\_flux\_fast} and
#>            \texttt{pin\_flux\_thermal}. The same is true for \texttt{point\_flux\_2g}
#>            and \texttt{fsr\_flux\_2g}
#>          \item \texttt{pin\_flux} implies \texttt{pin\_flux\_001}, \texttt{pin\_flux\_002},
#>            etc., up to the number of energy groups in the problem. The same is true for
#>            \texttt{point\_flux} and \texttt{fsr\_flux}
#>          \item \texttt{pin\_isotopes\_all} implies every isotope that exists in the transport
#>            and depletion libraries. The same is true for \texttt{fsr\_isotopes\_all},
#>            \texttt{point\_isotopes\_all}, and \texttt{intrapin\_isotopes\_all}
#>          \item \texttt{fsr\_delayed-chi} implies the delayed chi edits for each delayed
#>            neutron group
#>          \item \texttt{fsr\_dnpy} implies the delayed neutron precursor yields edits for
#>            each delayed neutron group
#>          \item \texttt{fsr\_dnpy} implies the delayed neutron precursor decay constants
#>            edits for each delayed neutron group
#>        \end{itemize}
#>        Users can define ``edit groups'' using the \texttt{edit\_group} option. These can
#>        be specified in this card as well to enable whole groups of edits. This is a convenient
#>        shorthand for when a particular set of edits will be enabled and disabled multiple times
#>        during a simulation},
#>     notes={One limitation in this card occurs when a user enables an edit using its name, a
#>        user-defined group, and an internal group of edits in MPACT all in the same calculation.
#>        For example, enabling \texttt{pin\_flux\_001} by referring to \texttt{pin\_flux\_001},
#>        \texttt{pin\_flux}, and a user-defined \texttt{edit\_group} option that includes
#>        \texttt{pin\_flux\_001} will result in unpredictable behavior and potentially crash the code.
#>        It is recommended that if any of the above built-in shorthand options are used, then the user
#>        should not name any of their components inside an \texttt{edit\_group} option. However,
#>        in this example, if the \texttt{edit\_group} option included \texttt{pin\_flux} instead of
#>        \texttt{pin\_flux\_001}, then the references would be correctly resolved}
#>   }
  edit:
    <<: *dtlist
    _style: multi-line
    _content:
    _check:
#>

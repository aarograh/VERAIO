---
_DATATYPES:
  _dtword: &dtword
    _parse: 'scalar'
    _type:  'word'
  _dtstring: &dtstring
    _parse: 'scalar'
    _type:  'string'
  _dtdate: &dtdate
    _parse: 'scalar'
    _type:  'date'
  _dtfloat: &dtfloat
    _parse: 'scalar'
    _type:  'float'
  _dtdouble: &dtdouble
    _parse: 'scalar'
    _type:  'double'
  _dtdblnamed: &dtdblnamed
    _parse: 'scalar'
    _type:  'double'
    _named: 1
  _dtint: &dtint
    _parse: 'scalar'
    _type:  'int'
  _dtbool: &dtbool
    _parse: 'scalar'
    _type:  'word'
  _dtlist: &dtlist
    _parse: 'list'
    _named: 0
  _dtlistnamed: &dtlistnamed
    _parse: 'list'
    _named: 1
  _dtblock: &dtblock
    _parse: 'block'
    _named: 0
  _dtblocknamed: &dtblocknamed
    _parse: 'block'
    _named: 1

_DIRECTORY:
  CASEID:
  STATE:
  CORE:
  ASSEMBLY:
  CONTROL:
  INSERT:
  DETECTOR:
  EDITS:
  SHIFT:
  COBRATF:
  COUPLING:
  MPACT:
  BISON:
  MAMBA:
  TIAMAT:
  RUN:

#>
#> \section{Block CASEID}
#> \label{sec:caseidcards}
CASEID:
#>
#>   {\bf title} case\_name
#>   \VERAInputTable{
#>     name={title},
#>     type={Character String},
#>     need={Optional},
#>     unitsdefault={},
#>     unitsother={},
#>     valuedefault={},
#>     valuesapplicable={},
#>     limitations={},
#>     description={Problem name},
#>     notes={}
#>   }
  title:
    <<: *dtstring
    _content: default
    _check:
      - is_string()
#>
#> \section{Block STATE}
#> \label{sec:statecards}
STATE:
  <<: *dtblocknamed
  id:
    <<: *dtstring
    _content:
    _check:
      - is_string()
#>
#>   {\bf title} state\_name
#>   \VERAInputTable{
#>     name={title},
#>     type={Character String},
#>     need={Optional},
#>     unitsdefault={},
#>     unitsother={},
#>     valuedefault={},
#>     valuesapplicable={},
#>     limitations={},
#>     description={State name},
#>     notes={}
#>   }
  title:
    <<: *dtstring
    _content:
    _check:
      - is_string()
#>
#>   {\bf op\_date} op\_date
#>   \VERAInputTable{
#>     name={op\_date},
#>     type={Character String (``MM/DD/YYYY'' or ``YYYY/MM/DD'')},
#>     need={Optional},
#>     unitsdefault={},
#>     unitsother={},
#>     valuedefault={},
#>     valuesapplicable={},
#>     limitations={},
#>     description={Operating date of this statepoint.  Used when writing restart files.},
#>     notes={}
#>   }
  op_date:
    <<: *dtdate
    _content:
    _check:
      - is_string()
#>
#>   {\bf power} power
#>   \VERAInputTable{
#>     name={power},
#>     type={Float},
#>     need={Optional},
#>     unitsdefault={Percent of rated power},
#>     unitsother={},
#>     valuedefault={1e-8},
#>     valuesapplicable={$>=0$},
#>     limitations={},
#>     description={Operating power},
#>     notes={}
#>   }
  power:
    <<: *dtdouble
    _content:
    _check:
      - is_float()
      - is_geq() 0
#>
#>   {\bf flow} flow
#>   \VERAInputTable{
#>     name={flow},
#>     type={Float},
#>     need={Optional},
#>     unitsdefault={Percent of rated flow},
#>     unitsother={},
#>     valuedefault={1e-8},
#>     valuesapplicable={$>=0$},
#>     limitations={},
#>     description={Operating flow},
#>     notes={}
#>   }
  flow:
    <<: *dtdouble
    _content:
    _check:
      - is_float()
      - is_geq() 0
#>
#>   {\bf flow\_dist} flow\_dist
#>   \VERAInputTable{
#>     name={flow\_dist},
#>     type={2D Float Map},
#>     need={Optional},
#>     unitsdefault={},
#>     unitsother={},
#>     valuedefault={1},
#>     valuesapplicable={$>0$},
#>     limitations={},
#>     description={2-D array that must match the shape of assm\_map in [CORE].  Gives a multiplier that will be applied to nominal flow in each assembly.}},
#>     notes={}
#>   }
  flow_dist:
    <<: *dtlist
    _style: multi-line
    _content:
    _check:
      - fall(sub{is_word(shift)},())
      - fall(sub{is_float(shift)},())
      - fall(sub{not_in_dictionary(shift,'_EMPTY_')},())
#>
#>   {\bf bypass} bypass
#>   \VERAInputTable{
#>     name={bypass},
#>     type={Float},
#>     need={Optional},
#>     unitsdefault={Percent of flow},
#>     unitsother={},
#>     valuedefault={0},
#>     valuesapplicable={$>=0$},
#>     limitations={},
#>     description={Bypass flow fraction \hl{current manual says rated flow}},
#>     notes={}
#>   }
  bypass:
    <<: *dtdouble
    _content:
    _check:
      - is_float()
      - is_geq() 0
#>
#>   {\bf bypass} bypass
#>   \VERAInputTable{
#>     name={bypass},
#>     type={Float},
#>     need={Optional},
#>     unitsdefault={Percent of flow},
#>     unitsother={},
#>     valuedefault={0},
#>     valuesapplicable={$>=0$},
#>     limitations={},
#>     description={Bypass flow fraction \hl{current manual says rated flow}},
#>     notes={}
#>   }
  tinlet:
    <<: *dtlist
    _content:
    _check:
      - arraysize()==2
      - is_float(nth(0,()))
      - is_word(nth(1,()))
      - in_dictionary(nth(1,()),'F','C','K')
  tinlet_dist:
    <<: *dtlist
    _style: multi-line
    _content:
    _check:
      - fall(sub{is_word(shift)},())
      - fall(sub{is_float(shift)},())
      - fall(sub{not_in_dictionary(shift,'_EMPTY_')},())
  void:
    <<: *dtlist
    _style: multi-line
    _content:
    _check:
      - fall(sub{is_word(shift)},())
      - fall(sub{is_float(shift)},())
      - fall(sub{not_in_dictionary(shift,'_EMPTY_')},())
  tfuel:
    <<: *dtlist
    _content:
    _check:
      - arraysize()==2
      - is_float(nth(0,()))
      - is_word(nth(1,()))
      - in_dictionary(nth(1,()),'F','C','K')
  modden:
    <<: *dtdouble
    _content:
    _check:
      - is_float()
      - is_gt() 0
  xenon:
    <<: *dtword
    _content:
    _check:
      - is_word()
      - in_dictionary() zero dep equil
  samar:
    <<: *dtword
    _content:
    _check:
      - is_word()
      - in_dictionary() zero dep equil peak
  rlx_xesm:
    <<: *dtdouble
    _content:
    _check:
      - is_float()
      - is_gt() 0
      - is_leq() 1.0
  pred_order:
    <<: *dtint
    _content:
    _check:
      - is_int()
      - is_geq() 0
  corr_order:
    <<: *dtint
    _content:
    _check:
      - is_int()
      - is_geq() 0
  boron:
    <<: *dtdouble
    _content:
    _check:
      - is_float()
      - is_geq() 0
  b10:
    <<: *dtlist
    _content:
    _check:
      - arraysize()==2
      - is_float(nth(0,()))
      - is_word(nth(1,()))
      - nth(0,())>=0
  kcrit:
    <<: *dtdouble
    _content:
    _check:
      - is_float()
      - is_geq() 0
  search:
    <<: *dtword
    _content:
    _check:
      - is_word()
      - in_dictionary() keff boron rod
  search_bank:
    <<: *dtword
    _content:
    _check:
      - is_word()
  pressure:
    <<: *dtdouble
    _content:
    _check:
      - is_float()
      - is_gt() 0
  deplete:
    <<: *dtlist
    _style: multi-line
    _content:
    _check:
      - fall(sub{is_float(shift)},stride(1,1,()))
      - nth(0,())eq"GWDMT"||nth(0,())eq"MWDMT"||nth(0,())eq"EFPD"||nth(0,())eq"hours"
      - is_strictlyincreasing(stride(1,1,()))
  edit:
    <<: *dtlist
    _style: multi-line
    _content:
    _check:
  reset_sol:
    <<: *dtbool
    _content:
    _check:
      - is_word()
      - in_dictionary() true false

  rodbank:
    <<: *dtlist
    _style: multi-line
    _content:
    _check:
      - fall(sub{is_word(shift)},())
      - fall(sub{is_float(shift)},odd([]))
      - fall(sub{is_geq(shift,0)},odd([]))
  feedback:
    <<: *dtword
    _content:
    _check:
      - is_word()
      - in_dictionary() on off
  thexp:
    <<: *dtword
    _content:
    _check:
      - is_word()
      - in_dictionary() on off
  thexp_tfuel:
    <<: *dtlist
    _content:
    _check:
      - arraysize()==2
      - is_float(nth(0,()))
      - is_word(nth(1,()))
      - in_dictionary(nth(1,()),'F','C','K')
  thexp_tclad:
    <<: *dtlist
    _content:
    _check:
      - arraysize()==2
      - is_float(nth(0,()))
      - is_word(nth(1,()))
      - in_dictionary(nth(1,()),'F','C','K')
  thexp_tmod:
    <<: *dtlist
    _content:
    _check:
      - arraysize()==2
      - is_float(nth(0,()))
      - is_word(nth(1,()))
      - in_dictionary(nth(1,()),'F','C','K')
  expand3D:
    <<: *dtbool
    _content:
    _check:
      - is_word()
      - in_dictionary() true false
  thexp_outfile:
    <<: *dtstring
    _content:
    _check:
      - is_string()
  thexp_info:
    <<: *dtbool
    _content:
    _check:
      - is_word()
      - in_dictionary() true false
  apitch_tec:
    <<: *dtdouble
    _content:
    _check:
      - is_float()
  ppitch_tec:
    <<: *dtdouble
    _content:
    _check:
      - is_float()
  sym:
    <<: *dtword
    _content:
    _check:
      - is_word()
      - in_dictionary() full qtr
  kmul_beta:
    <<: *dtdouble
    _content:
    _check:
      - is_gt() 0
      - is_leq()  1

  kmul_doppler:
    <<: *dtdouble
    _content:
    _check:
      - is_gt() 0
      - is_leq() 1
  kmul_modtemp:
    <<: *dtdouble
    _content:
    _check:
      - is_gt() 0
      - is_leq() 1

  kmul_crw:
    <<: *dtdouble
    _content:
    _check:
      - is_gt() 0
      - is_leq() 100

  scram_type:
    <<: *dtlist
    _style: multi-line
    _content:
    _check:
      - is_word(nth(0,()))
      - fall(sub{is_float(shift)},stride(1,2,()))
      - fall(sub{is_geq(shift,0)},stride(1,2,()))
      - fall(sub{is_float(shift)},stride(2,2,()))
      - fall(sub{is_gt(shift,0)},stride(2,2,()))
      - arraysize()%2!=0
  bank_wd:
    <<: *dtlist
    _style: multi-line
    _content:
    _check:
      - is_word(nth(0,()))
      - fall(sub{is_float(shift)},stride(1,2,()))
      - fall(sub{is_geq(shift,0)},stride(1,2,()))
      - fall(sub{is_int(shift)},stride(2,2,()))
      - fall(sub{is_gt(shift,0)},stride(2,2,()))
      - arraysize()%2==1
  scram_lock:
    <<: *dtlist
    _style: multi-line
    _content:
    _check:
      - fall(sub{is_word(shift)},())
  trip_time:
    <<: *dtdouble
    _content:
    _check:
      - is_float()
      - is_gt() 0
  trip_power:
    <<: *dtlist
    _content:
    _check:
      - arraysize()==4
      - is_float(nth(0,()))&&nth(0,())>0
      - is_float(nth(1,()))&&nth(1,())>=0
      - is_float(nth(2,()))&&nth(2,())>=0
      - (is_int(nth(3,()))||nth(3,())==0)&&nth(3,())>=0
  trip_rate:
    <<: *dtlist
    _content:
    _check:
      - arraysize()==4
      - is_float(nth(0,()))
      - is_float(nth(1,()))
      - is_float(nth(2,()))&&nth(2,())>=0
      - (is_int(nth(3,()))||nth(3,())==0)&&nth(3,())>=0

  restart_shuffle:
    <<: *dtlist
    _style: multi-line
    _content:
    _check:
      - fall(sub{is_word(shift)},())
  restart_read:
    <<: *dtlist
    _content:
    _check:
      - fall(sub{is_word(shift)},())
      - arraysize()==2
  restart_write:
    <<: *dtlist
    _content:
    _check:
      - fall(sub{is_word(shift)},())
      - arraysize()==2
  shuffle_label:
    <<: *dtlist
    _style: multi-line
    _content:
    _check:
      - fall(sub{is_word(shift)},())
      - fall(sub{not_in_dictionary(shift,'0')},())
  insert_shuffle_label:
    <<: *dtlist
    _style: multi-line
    _content:
    _check:
      - fall(sub{is_word(shift)},())
      - fall(sub{not_in_dictionary(shift,'0')},())
  crud_cleaning:
    <<: *dtlist
    _style: multi-line
    _content:
    _check:
      - fall(sub{is_word(shift)},())
      - fall(sub{not_in_dictionary(shift,'0')},())
  crud_removal:
    <<: *dtdouble
    _content:
    _check:
      - is_float()
      - is_geq() 0
  cool_chem:
    <<: *dtlist
    _content:
    _check:
      - fall(sub{is_float(shift)},())
      - arraysize()==5
      - nth(0,())>=0
      - nth(1,())>=0
      - nth(2,())>=0
      - nth(3,())>=0
      - nth(4,())>=0
  vh2:
    <<: *dtfloat
    _content:
    _check:
      - is_float()
      - is_geq() 0
  ni_s:
    <<: *dtfloat
    _content:
    _check:
      - is_float()
      - is_geq() 0
  cleanup_flow:
    <<: *dtfloat
    _content:
    _check:
      - is_float()
      - is_geq() 0
      - is_leq() 100
  temp_pert:
    <<: *dtlist
    _content:
    _check:
      - arraysize()==2
      - is_float(nth(0,()))
      - is_float(nth(1,()))

CORE:
  name:
    <<: *dtstring
    _content:
    _check:
      - is_string()
  cycle:
    <<: *dtstring
    _content:
    _check:
      - is_string()
  unit:
    <<: *dtstring
    _content:
    _check:
      - is_string()
  op_date:
    <<: *dtdate
    _content:
    _check:
      - is_string()
  size:
    <<: *dtint
    _content:
    _check:
      - is_int()
      - is_gt() 0
  rated:
    <<: *dtlist
    _content:
    _check:
      - fall(sub{is_float(shift)},())
      - arraysize()==2
      - nth(0,())>=0
      - nth(1,())>=0
  rcs_volume:
    <<: *dtdouble
    _content:
    _check:
      - is_float()
      - is_gt() 0
  apitch:
    <<: *dtdouble
    _content:
    _check:
      - is_float()
      - is_gt() 0
  baffle:
    <<: *dtlist
    _content:
    _check:
      - arraysize()==3
      - is_word(nth(0,()))
      - is_float(nth(1,()))
      - is_float(nth(2,()))
      - nth(1,())>=0
      - nth(2,())>=0
  pad:
    <<: *dtlist
    _content:
    _check:
      - is_word(nth(0,()))
      - is_float(nth(1,()))
      - is_float(nth(2,()))
      - nth(1,())>=0
      - nth(2,())>=0
  pad_nonuniform_arc:
    <<: *dtlist
    _content:
    _check:
  vessel:
    <<: *dtlist
    _style: multi-line
    _content:
    _check:
      - arraysize()%2==0
      - fall(sub{is_string(shift)},stride(0,2,()))
      - fall(sub{is_float(shift)},stride(1,2,()))
      - fall(sub{is_geq(shift,0)},stride(1,2,()))
  hole:
    <<: *dtlist
    _style: multi-line
    _content:
    _check:
      - arraysize()%3==0
      - fall(sub{is_float(shift)},stride(0,3,()))
      - fall(sub{is_float(shift)},stride(1,3,()))
      - fall(sub{is_float(shift)},stride(2,3,()))
  core_shape:
    <<: *dtlist
    _style: multi-line
    _content:
    _check:
      - fall(sub{is_int(shift)},())
      - fall(sub{is_geq(shift,0)},())
      - fall(sub{is_leq(shift,1)},())
  assm_map:
    <<: *dtlist
    _style: multi-line
    _content:
    _check:
      - fall(sub{is_word(shift)},())
      - fall(sub{not_in_dictionary(shift,'0')},())
      - fall(sub{not_in_dictionary(shift,'_EMPTY_')},())
  rotate_map:
    <<: *dtlist
    _style: multi-line
    _content:
    _check:
      - fall(sub{is_int(shift)},())
      - fall(sub{is_geq(shift,0)},())
      - fall(sub{is_leq(shift,3)},())
      - fall(sub{not_in_dictionary(shift,'_EMPTY_')},())
  insert_rotate_map:
    <<: *dtlist
    _style: multi-line
    _content:
    _check:
      - fall(sub{is_int(shift)},())
      - fall(sub{is_geq(shift,0)},())
      - fall(sub{is_leq(shift,3)},())
      - fall(sub{not_in_dictionary(shift,'_EMPTY_')},())
  insert_map:
    <<: *dtlist
    _style: multi-line
    _content:
    _check:
      - fall(sub{is_word(shift)},())
      - fall(sub{not_in_dictionary(shift,'0')},())
      - fall(sub{not_in_dictionary(shift,'_EMPTY_')},())
  det_map:
    <<: *dtlist
    _style: multi-line
    _content:
    _check:
      - fall(sub{is_word(shift)},())
      - fall(sub{not_in_dictionary(shift,'0')},())
      - fall(sub{not_in_dictionary(shift,'_EMPTY_')},())
  crd_map:
    <<: *dtlist
    _style: multi-line
    _content:
    _check:
      - fall(sub{is_word(shift)},())
      - fall(sub{not_in_dictionary(shift,'0')},())
      - fall(sub{not_in_dictionary(shift,'_EMPTY_')},())
  crd_bank:
    <<: *dtlist
    _style: multi-line
    _content:
    _check:
      - fall(sub{is_word(shift)},())
      - fall(sub{not_in_dictionary(shift,'0')},())
      - fall(sub{not_in_dictionary(shift,'_EMPTY_')},())
  lower_plate:
    <<: *dtlist
    _content:
    _check:
      - arraysize()==3
      - is_word(nth(0,()))
      - is_float(nth(1,()))
      - is_float(nth(2,()))
      - nth(1,())>=0
      - nth(2,())>=0
      - nth(2,())<=1
  upper_plate:
    <<: *dtlist
    _content:
    _check:
      - arraysize()==3
      - is_word(nth(0,()))
      - is_float(nth(1,()))
      - is_float(nth(2,()))
      - nth(1,())>=0
      - nth(2,())>=0
      - nth(2,())<=1
  bc_sym:
    <<: *dtword
    _content:
    _check:
      - is_word()
      - in_dictionary() rot mir
  bc_bot:
    <<: *dtword
    _content:
    _check:
      - is_word()
      - in_dictionary() reflecting vacuum
  bc_top:
    <<: *dtword
    _content:
    _check:
      - is_word()
      - in_dictionary() reflecting vacuum
  bc_rad:
    <<: *dtword
    _content:
    _check:
      - is_word()
      - in_dictionary() reflecting vacuum
  xlabel:
    <<: *dtlist
    _content:
    _check:
      - fall(sub{is_word(shift)},())
  ylabel:
    <<: *dtlist
    _content:
    _check:
      - fall(sub{is_word(shift)},())
  label_format:
    <<: *dtword
    _content:
    _check:
      - is_word()
      - in_dictionary() x-y y-x .x-y .y-x
  height:
    <<: *dtdouble
    _content:
    _check:
      - is_float()
      - is_geq() 0
  mat:
    <<: *dtlistnamed
    _style: multi-line
    _slash:
    _check:
      - arraysize()>1
      - nth(1,())>=0
      - lc(nth(0,()))ne'mod'
    _options:
      thexp: double
      thcnd: double
    _defaults:
      _path: CORE/%(_keyword)/$(_id)

  lower_ref:
    <<: *dtlist
    _style: multi-line
    _content:
    _check:
      - arraysize()%3==0
      - fall(sub{is_string(shift)},stride(0,3,()))
      - fall(sub{is_float(shift)},stride(1,3,()))
      - fall(sub{is_geq(shift,0)},stride(1,3,()))
      - fall(sub{is_float(shift)},stride(2,3,()))
      - fall(sub{is_geq(shift,0)},stride(2,3,()))
      - fall(sub{is_leq(shift,1)},stride(2,3,()))
  upper_ref:
    <<: *dtlist
    _style: multi-line
    _content:
    _check:
      - arraysize()%3==0
      - fall(sub{is_string(shift)},stride(0,3,()))
      - fall(sub{is_float(shift)},stride(1,3,()))
      - fall(sub{is_geq(shift,0)},stride(1,3,()))
      - fall(sub{is_float(shift)},stride(2,3,()))
      - fall(sub{is_geq(shift,0)},stride(2,3,()))
      - fall(sub{is_leq(shift,1)},stride(2,3,()))

  reactor_type:
    <<: *dtstring
    _content:
    _check:
      - is_word()
      - in_dictionary() BWR PWR

  source:
    <<: *dtlistnamed
    _style: multi-line
    _slash:
    _check:
      - arraysize()>1
    _defaults:
      _path: CORE/%(_keyword)/$(_id)

  steam_generator:
    <<: *dtlist
    _content:
    _check:
      - arraysize()==4
      - is_word(nth(0,()))

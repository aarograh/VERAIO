CORE:
  name:
    <<: *dtstring
    _content:
    _check:
      - is_string()
  cycle:
    <<: *dtlist
    _content:
    _check:
      - fall(sub{is_int(shift)},())
      - arraysize()==3
      - nth(0,())>=0
      - nth(1,())>=0
      - nth(2,())>=0
  size:
    <<: *dtint
    _content:
    _check:
      - is_int()
      - is_gt() 0
  rated:
    <<: *dtlist
    _content:
    _check:
      - fall(sub{is_float(shift)},())
      - arraysize()==2
      - nth(0,())>=0
      - nth(1,())>=0
  apitch:
    <<: *dtdouble
    _content:
    _check:
      - is_float()
      - is_gt() 0
  baffle:
    <<: *dtlist
    _content:
    _check:
      - arraysize()==3
      - is_word(nth(0,()))
      - is_float(nth(1,()))
      - is_float(nth(2,()))
      - nth(1,())>=0
      - nth(2,())>=0

  vessel:
    <<: *dtlist
    _style: multi-line
    _content:
    _check:
      - arraysize()%2==0
      - fall(sub{is_string(shift)},stride(0,2,()))
      - fall(sub{is_float(shift)},stride(1,2,()))
      - fall(sub{is_geq(shift,0)},stride(1,2,()))

  core_shape:
    <<: *dtlist

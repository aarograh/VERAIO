#>
#>   {\bf source} mat\_id iso\_id iso\_scal / spectrum(:) / stt\_str str\_mult
#>   \VERAInputTable{
#>     name={mat\_id},
#>     type={Integer},
#>     need={Optional},
#>     unitsdefault={},
#>     unitsother={},
#>     valuedefault={},
#>     valuesapplicable={},
#>     limitations={},
#>     description={An integer id corresponding to the material of external source.},
#>     notes={}
#>   }
#>   \VERAInputTable{
#>     name={iso\_id},
#>     type={Integer},
#>     need={Optional},
#>     unitsdefault={},
#>     unitsother={},
#>     valuedefault={},
#>     valuesapplicable={},
#>     limitations={},
#>     description={An integer value representing an isotope on whose absolute atom
#>        quantity the source strength will be scaled.  Input should follow the
#>        formate ZZAAA. Omitting this value indicates that no isotope will be used
#>        and the user will provide an absolute strength flux spectrum},
#>     notes={}
#>   }
#>   \VERAInputTable{
#>     name={iso\_scale},
#>     type={Float},
#>     need={Optional},
#>     unitsdefault={},
#>     unitsother={},
#>     valuedefault={},
#>     valuesapplicable={},
#>     limitations={},
#>     description={A positive real corresponding to the scaling factor to use when
#>        scaling the fractional flux spectrum to its absolute strength. This scaling
#>        is in terms of the number of atoms of the scaling isotope which appears
#>        in a given FSR. Units are in neutrons per second per unit volume (cc)
#>        per number of isotope atoms.  This value is only required if the user
#>        provides \texttt{iso\_id(i)}.},
#>     notes={}
#>   }
#>   \VERAInputTable{
#>     name={spectrum},
#>     type={Float},
#>     need={Optional},
#>     unitsdefault={},
#>     unitsother={},
#>     valuedefault={},
#>     valuesapplicable={},
#>     limitations={},
#>     description={Positive real values corresponding to the either the fractional
#>        or absolute source spectrum. If scaling isotope information is provided
#>        this represents a fractional spectrum, otherwise it represents an absolute
#>        spectrum in units of neutrons per second per unit of volume (cc). The number
#>        of values much match the number of energy groups of the problem. Values cannot
#>        be negative and must sum to nearly 1.0 if the input corresponds to a fractional
#>        spectrum.},
#>     notes={}
#>   }
#>   \VERAInputTable{
#>     name={stt\_str},
#>     type={Float},
#>     need={Optional},
#>     unitsdefault={},
#>     unitsother={},
#>     valuedefault={},
#>     valuesapplicable={},
#>     limitations={},
#>     description={A real greater than 0.0 less than or equal to 1.0 corresponding
#>        to the fractional starting strength of the source. This is how much of
#>        the source will be applied during the first external source iteration.
#>        If this value is not provided it will default to full strength.},
#>     notes={}
#>   }
#>   \VERAInputTable{
#>     name={str\_mult},
#>     type={Float},
#>     need={Optional},
#>     unitsdefault={},
#>     unitsother={},
#>     valuedefault={},
#>     valuesapplicable={},
#>     limitations={},
#>     description={A real greater than 1.0 corresponding to the multiplicative
#>        increase of the source strength. If stt\_str is provided, then this value
#>        must be provided.},
#>     notes={}
#>   }

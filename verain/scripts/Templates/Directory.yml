    _check:
      - is_float()
      - is_geq() 0
  mat:
    <<: *dtlistnamed
    _style: multi-line
    _check:
      - lc(nth(0,()))ne'mod'

  lower_ref:
    <<: *dtlist
    _style: multi-line
    _content:
    _check:
      - arraysize()%3==0
      - fall(sub{is_string(shift)},stride(0,3,()))

      - nth(2,())>=0
      - nth(2,())<=1
  upper_plate:
    <<: *dtlist
    _content:
    _check:
      - arraysize()==3
      - is_word(nth(0,()))
      - is_float(nth(1,()))
      - is_float(nth(2,()))

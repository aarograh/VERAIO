#>     type={Fixed Character String},
#>     need={Optional},
#>     unitsdefault={},
#>     unitsother={},
#>     valuedefault={lflat},
#>     valuesapplicable={flat.  These are described as:                                  %
#>       \begin{itemize}                                                                 %
#>         \item \texttt{lflat} --- checks the total / transport cross section.          %
#>           If the value is below the threshold, leakage will not be put into           %
#>           that region.  This process is usually to avoid leakage in the fuel-         %
#>           clad gap.  It will then redistribute the leakage to the other               %
#>           regions in that pin.                                                        %
#>         \item \texttt{flat} --- does not perform leakage threshold checks.            %
#>       \end{itemize}},
#>     limitations={},
#>     description={This card is used to specify the type of spatial shape of the        %
#>       axial transverse leakage applied to the 2-D problem. Flat means it is constant  %
#>       over a pin cell. This is primarily used to ensure stability of the iteration.},
#>     notes={}
#>   }
  TL_treatment:
    <<: *dtword
    _content:
    _check:
      - is_word()
      - in_dictionary() flat lflat
#>
#>   {\bf moc\_source\_splitting} moc\_source\_splitting
#>   \VERAInputTable{
#>     name={moc\_source\_splitting},
#>     type={Fixed Character String},
#>     need={Optional},
#>     unitsdefault={},
#>     unitsother={},
#>     valuedefault={none},
#>     valuesapplicable={full, linear.  These are described as:                          %
#>       \begin{itemize}                                                                 %
#>         \item \texttt{none} --- no source splitting is performed in MOC.              %
#>         \item \texttt{full} --- if the source is negative before the MOC sweep, all   %
#>           the source is moved from the right to left side of the equation by          %
#>           modifying the transport cross section.                                      %
#>         \item \texttt{linear} --- if the linear source is negative before the MOC
#>           sweep, the gradient of the linear source and the quantity of source
#>           splitting are adjusted to ensure the non-negativitiy of the linear source.
#>       \end{itemize}},
#>     limitations={},
#>     description={This card is used to describe the type of source splitting that is   %
#>       done before the MOC calculation to improve the stability of the calculation},
#>     notes={Minor changes in the converged solution will occur when source splitting is%
#>       enabled.  Source splitting is never done for gamma transport because of the     %
#>       detrimental effects on accuracy for highly anisotropic calculations.  This card %
#>       has no impact on the splitting of the axial transverse leakage source; the      %
#>       splitting controlled by this card is done after the axial leakage splitting and %
#>       after adding in the self-scatter source for the radial transport sweep.}
#>   }
  moc_source_splitting:
    <<: *dtword
    _content:
    _check:
      - is_word()
      - in_dictionary() none full linear

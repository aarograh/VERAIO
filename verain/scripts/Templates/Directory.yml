      - is_geq() 0
  rodbank:
    <<: *dtlist
    _style: multi-line
    _default:
    _check:
      - fall(sub{is_string(shift)},())
      - fall(sub{is_int(shift)},odd[])
      - fall(sub{is_geq(shift,0)},odd[])

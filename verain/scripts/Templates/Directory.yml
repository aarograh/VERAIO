_DATATYPES:
  _dtword: &dtword
    _parse: 'scalar'
    _type:  'word'
  _dtstring: &dtstring
    _parse: 'scalar'
    _type:  'string'
  _dtdate: &dtdate
    _parse: 'scalar'
    _type:  'date'
  _dtfloat: &dtfloat
    _parse: 'scalar'
    _type:  'float'
  _dtdouble: &dtdouble
    _parse: 'scalar'
    _type:  'double'
  _dtdblnamed: &dtdblnamed
    _parse: 'scalar'
    _type:  'double'
    _named: 1
  _dtint: &dtint
    _parse: 'scalar'
    _type:  'int'
  _dtbool: &dtbool
    _parse: 'scalar'
    _type:  'word'
  _dtlist: &dtlist
    _parse: 'list'
    _named: 0
  _dtlistnamed: &dtlistnamed
    _parse: 'list'
    _named: 1
  _dtblock: &dtblock
    _parse: 'block'
    _named: 0
  _dtblocknamed: &dtblocknamed
    _parse: 'block'
    _named: 1

_DIRECTORY:
  CASEID:
  BRANCH:
  STATE:
  CORE:
  ASSEMBLY:
  CONTROL:
  INSERT:
  DETECTOR:
  EDITS:
  SHIFT:
  COBRATF:
  COUPLING:
  MPACT:
  TRANSIENT:
  BISON:
  FAST:
  MAMBA:
  TIAMAT:
  RUN:

#>
#> \subsection{Block CASEID}
#> \label{sec:caseidcards}
CASEID:
#>
#>   {\bf title} case\_name
#>   \VERAInputTable{
#>     name={case\_name},
#>     type={Character String},
#>     need={Optional},
#>     unitsdefault={},
#>     unitsother={},
#>     valuedefault={},
#>     valuesapplicable={},
#>     limitations={},
#>     description={Problem name},
#>     notes={}
#>   }
  title:
    <<: *dtstring
    _content: default
    _check:
      - is_string()
#>
#> \subsection{Block BRANCH}
#> \label{sec:branchcards}
BRANCH:
  <<: *dtblocknamed
  id:
    <<: *dtstring
    _content:
    _check:
      - is_string()
#>
#>   {\bf title} branch\_name
#>   \VERAInputTable{
#>     name={branch\_name},
#>     type={Character Strings},
#>     need={Optional},
#>     unitsdefault={},
#>     unitsother={},
#>     valuedefault={},
#>     valuesapplicable={},
#>     limitations={},
#>     description={Name of the set of branch cases defined by this \texttt{BRANCH} block},
#>     notes={}
#>   }
  title:
    <<: *dtstring
    _style: multi-line
    _content:
    _check:
      - is_string()
#>
#>   {\bf branch\_set} branch\_set
#>   \VERAInputTable{
#>     name={branch\_set},
#>     type={Array of mixed types},
#>     need={Optional},
#>     unitsdefault={},
#>     unitsother={},
#>     valuedefault={},
#>     valuesapplicable={},
#>     limitations={},
#>     description={Defines one set of branch calculations.  Every permutation of values
#>        listed in the \texttt{branch\_set} input will generate a new state.  For detailed
#>        documentation and examples, please see Section \ref{chap:branches}.},
#>     notes={This input does nothing unless the \texttt{[BRANCH]} block title
#>        is named in the texttt{[STATE]} block's \texttt{branch} input.}
#>   }
  branch_set:
    <<: *dtlistnamed
    _style: multi-line
    _content:
    _check:
#>
#>   {\bf state\_control} state\_control
#>   \VERAInputTable{
#>     name={state\_control},
#>     type={Array of Strings},
#>     need={Optional},
#>     unitsdefault={},
#>     unitsother={},
#>     valuedefault={},
#>     valuesapplicable={},
#>     limitations={},
#>     description={Applies temporary modifications to state variables; these modifications
#>        will only be applied during the branch calculations, not during the depletion and
#>        nominal calculations.  For detailed documentation and examples, please see
#>        Section \ref{chap:branches}.},
#>     notes={This input does nothing unless the \texttt{[BRANCH]} block title
#>        is named in the texttt{[STATE]} block's \texttt{branch} input.}
#>   }
  state_control:
    <<: *dtlist
    _style: multi-line
    _content:
    _check:
      - fall(sub{is_word(shift)},())
      - fall(sub{in_dictionary(shift,'xenon','samar','search','reset_sol','feedback','crud')},even([]))
#>
#> \subsection{Block STATE}
#> \label{sec:statecards}
STATE:
  <<: *dtblocknamed
  id:
    <<: *dtstring
    _content:
    _check:
      - is_string()
#>
#>   {\bf branch} branch
#>   \VERAInputTable{
#>     name={branch},
#>     type={Array of Strings},
#>     need={Optional},
#>     unitsdefault={},
#>     unitsother={},
#>     valuedefault={},
#>     valuesapplicable={},
#>     limitations={},
#>     description={Names the [BRANCH] blocks that should be applied after each state
#>        point defined by this [STATE] block},
#>     notes={This input does not persist to following [STATE] blocks}
#>   }
  branch:
    <<: *dtlist
    _content:
    _check:
      - fall(sub{is_word(shift)})
#>
#>   {\bf title} state\_name
#>   \VERAInputTable{
#>     name={state\_name},
#>     type={Character String},
#>     need={Optional},
#>     unitsdefault={},
#>     unitsother={},
#>     valuedefault={},
#>     valuesapplicable={},
#>     limitations={},
#>     description={State name},
#>     notes={}
#>   }
  title:
    <<: *dtstring
    _content:
    _check:
      - is_string()
#>
#>   {\bf op\_date} operating\_date
#>   \VERAInputTable{
#>     name={operating\_date},
#>     type={Character String},
#>     need={Optional},
#>     unitsdefault={},
#>     unitsother={},
#>     valuedefault={},
#>     valuesapplicable={},
#>     limitations={Limited to ``MM/DD/YYYY'' or ``YYYY/MM/DD''},
#>     description={This card contains the operating date of this statepoint. It is used when writing restart files.
#>        The operating date must be entered for any restart file that is used in a core
#>        shuffle so that the isotopic decay can be calculated during an outage},
#>     notes={}
#>   }
  op_date:
    <<: *dtdate
    _content:
    _check:
      - is_string()
#>
#>   {\bf power} percent\_power
#>   \VERAInputTable{
#>     name={percent\_power},
#>     type={Float},
#>     need={Optional},
#>     unitsdefault={Percent},
#>     unitsother={},
#>     valuedefault={$1.0\times 10^{-8}$},
#>     valuesapplicable={$\ge 0$},
#>     limitations={},
#>     description={Percent of rated operating power},
#>     notes={Cannot be zero when depleting}
#>   }
  power:
    <<: *dtdouble
    _content:
    _check:
      - is_float()
      - is_geq() 0
#>
#>   {\bf flow} percent\_flow
#>   \VERAInputTable{
#>     name={percent\_flow},
#>     type={Float},
#>     need={Optional},
#>     unitsdefault={Percent},
#>     unitsother={},
#>     valuedefault={$1.0\times 10^{-8}$},
#>     valuesapplicable={$\ge 0$},
#>     limitations={},
#>     description={Percent of rated operating flow},
#>     notes={}
#>   }
  flow:
    <<: *dtdouble
    _content:
    _check:
      - is_float()
      - is_geq() 0
#>
#>   {\bf flow\_dist} nominal\_flow\_multiplier
#>   \VERAInputTable{
#>     name={nominal\_flow\_multiplier},
#>     type={2D Float Map},
#>     need={Optional},
#>     unitsdefault={},
#>     unitsother={},
#>     valuedefault={1},
#>     valuesapplicable={$>0$},
#>     limitations={},
#>     description={This is a 2D array that must match the shape of assm\_map in [CORE].
#>        It gives a multiplier that will be applied to nominal inlet mass flow rate in each assembly},
#>     notes={This map is not normally used}
#>   }
  flow_dist:
    <<: *dtlist
    _style: multi-line
    _content:
    _check:
      - fall(sub{is_word(shift)},())
      - fall(sub{is_float(shift)},())
      - fall(sub{not_in_dictionary(shift,'_EMPTY_')},())
#>
#>   {\bf blade\_pos} blade\_pos
#>   \VERAInputTable{
#>     name={blade\_pos},
#>     type={2D Float Map},
#>     need={Optional},
#>     unitsdefault={},
#>     unitsother={},
#>     valuedefault={},
#>     valuesapplicable={$\ge 0$},
#>     limitations={},
#>     description={Steps withdrawn for each blade location},
#>     notes={The map must be in full symmetry, regardless
#>        of how other maps in the \texttt{CORE} block are entered}
#>   }
  blade_pos:
    <<: *dtlist
    _style: multi-line
    _content:
    _check:
      - fall(sub{is_float(shift)},())
      - fall(sub{is_geq(shift,0.0)},())
#>
#>   {\bf pout\_dist} outlet\_pressure\_adder
#>   \VERAInputTable{
#>     name={outlet\_pressure\_adder},
#>     type={2D Float Map},
#>     need={Optional},
#>     unitsdefault={psi},
#>     unitsother={},
#>     valuedefault={0.0},
#>     valuesapplicable={Any float},
#>     limitations={},
#>     description={This is a 2D array that must match the shape of assm\_map in [CORE].
#>        It gives an adder that will be added to nominal outlet pressure in each assembly},
#>     notes={This map is not normally used}
#>   }
  pout_dist:
    <<: *dtlist
    _style: multi-line
    _content:
    _check:
      - fall(sub{is_word(shift)},())
      - fall(sub{is_float(shift)},())
      - fall(sub{not_in_dictionary(shift,'_EMPTY_')},())
#>
#>   {\bf bypass} bypass\_option
#>   \VERAInputTable{
#>     name={bypass\_option},
#>     type={Float or String},
#>     need={Optional},
#>     unitsdefault={},
#>     unitsother={Percent},
#>     valuedefault={0},
#>     valuesapplicable={$\ge 0$, table},
#>     limitations={},
#>     description={This is the bypass flow fraction applied to the actual flow, or the word ``table,''
#>        indicating that a bypass flow rate table specified in [CORE] should be used},
#>     notes={}
#>   }
  bypass:
    <<: *dtstring
    _content:
    _check:
      - is_string()
#>
#>   {\bf tinlet} inlet\_temperature units
#>   \VERAInputTable{
#>     name={inlet\_temperature},
#>     type={Float or String},
#>     need={Optional},
#>     unitsdefault={C},
#>     unitsother={F, K},
#>     valuedefault={326.85 C},
#>     valuesapplicable={$>0$, table},
#>     limitations={},
#>     description={This is the core inlet temperature in given units. Examples of this card are
#>        \texttt{tinlet 560 F} or \texttt{tinlet 600 K}. Alternatively,
#>        \texttt{tinlet table} can be used to invoke the tinlet\_table},
#>     notes={This is required when coupling to CTF}
#>   }
  tinlet:
    <<: *dtstring
    _content:
    _check:
      - is_string()
#>
#>   {\bf tinlet\_dist} inlet\_temperature\_adder
#>   \VERAInputTable{
#>     name={inlet\_temperature\_adder},
#>     type={2D Float Map},
#>     need={Optional},
#>     unitsdefault={C},
#>     unitsother={},
#>     valuedefault={0},
#>     valuesapplicable={},
#>     limitations={},
#>     description={This is a 2D array that must match the shape of assm\_map in [CORE].
#>        It gives an adder that will be applied to the nominal inlet temperature in each assembly},
#>     notes={This map is not normally used}
#>   }
  tinlet_dist:
    <<: *dtlist
    _style: multi-line
    _content:
    _check:
      - fall(sub{is_word(shift)},())
      - fall(sub{is_float(shift)},())
      - fall(sub{not_in_dictionary(shift,'_EMPTY_')},())
#>
#>   {\bf subcool} inlet\_subcooled\_enthalpy
#>   \VERAInputTable{
#>     name={inlet\_subcooled\_enthalpy},
#>     type={Float},
#>     need={Optional},
#>     unitsdefault={BTU/lbm},
#>     unitsother={},
#>     valuedefault={},
#>     valuesapplicable={$\ge 0$},
#>     limitations={Cannot be used along with \texttt{tinlet} card. Requires \texttt{pressure} card},
#>     description={The enthalpy below the saturated liquid enthalpy at the inlet},
#>     notes={\texttt{tinlet} or \texttt{subcool} cards are required and are exclusive}
#>   }
  subcool:
    <<: *dtdouble
    _content:
    _check:
      - is_float()
      - is_geq() 0
#>
#>   {\bf void} void\_distribution
#>   \VERAInputTable{
#>     name={void\_distribution},
#>     type={Float},
#>     need={Optional},
#>     unitsdefault={Percent},
#>     unitsother={},
#>     valuedefault={},
#>     valuesapplicable={$>0$, $<100$},
#>     limitations={},
#>     description={Assembly-wise radial void distribution in percent},
#>     notes={BWR only}
#>   }
  void:
    <<: *dtlist
    _style: multi-line
    _content:
    _check:
      - fall(sub{is_word(shift)},())
      - fall(sub{is_float(shift)},())
      - fall(sub{not_in_dictionary(shift,'_EMPTY_')},())
#>
#>   {\bf axial\_void} axial\_void\_map axial\_void\_bounds
#>   \VERAInputTable{
#>     name={axial\_void\_map},
#>     type={Float},
#>     need={Optional},
#>     unitsdefault={Percent},
#>     unitsother={},
#>     valuedefault={},
#>     valuesapplicable={$\ge 0$, $\le 100$},
#>     limitations={},
#>     description={List of axial void fractions},
#>     notes={BWR only}
#>   }
#>   \VERAInputTable{
#>     name={axial\_void\_bounds},
#>     type={Float},
#>     need={Optional},
#>     unitsdefault={cm},
#>     unitsother={},
#>     valuedefault={},
#>     valuesapplicable={},
#>     limitations={},
#>     description={List of axial elevations for axial void fractions},
#>     notes={BWR only}
#>   }
  axial_void:
    <<: *dtlist
    _style: multi-line
    _check:
      - fall(sub{is_float(shift)},())
      - arraysize()%2==1
      - fall(sub{is_geq(shift,0)},odd([]))
      - fall(sub{is_leq(shift,100)},odd([]))
      - is_strictlyincreasing(even([]))
#>
#>   {\bf tfuel} fuel\_temperature units
#>   \VERAInputTable{
#>     name={fuel\_temperature},
#>     type={Float},
#>     need={Optional},
#>     unitsdefault={K},
#>     unitsother={F, C},
#>     valuedefault={600 K},
#>     valuesapplicable={$>0K$, $<1600K$},
#>     limitations={},
#>     description={Fixed fuel temperatures},
#>     notes={This is only used if feedback is turned OFF. Examples of this card are \texttt{900 K}
#>        or \texttt{1200 F}}
#>   }
  tfuel:
    <<: *dtlist
    _content:
    _check:
      - arraysize()==2
      - is_float(nth(0,()))
      - is_word(nth(1,()))
      - in_dictionary(nth(1,()),'F','C','K')
#>
#>   {\bf modden} mod\_density
#>   \VERAInputTable{
#>     name={mod\_density},
#>     type={Float},
#>     need={Optional},
#>     unitsdefault={g/cc},
#>     unitsother={},
#>     valuedefault={0.743},
#>     valuesapplicable={$>0.01$, $<1.2$},
#>     limitations={},
#>     description={Fixed moderator density},
#>     notes={Only used if feedback is turned OFF}
#>   }
  modden:
    <<: *dtdouble
    _content:
    _check:
      - is_float()
      - is_gt() 0
#>
#>   {\bf xenon} xenon\_treatment
#>   \VERAInputTable{
#>     name={xenon\_treatment},
#>     type={Character String},
#>     need={Optional},
#>     unitsdefault={},
#>     unitsother={},
#>     valuedefault={dep},
#>     valuesapplicable={zero, equil},
#>     limitations={},
#>     description={Xenon treatment option:
#>     \begin{itemize}
#>        \item \texttt{zero}: sets $^{135}$I and $^{135}$Xe number densities to zero
#>        \item \texttt{equil}: sets $^{135}$I and $^{135}$Xe number densities to calculated equilibrium values
#>        \item \texttt{dep}: treats $^{135}$I and $^{135}$Xe explicitly as other isotopes in transport calculation
#>     \end{itemize}},
#>     notes={}
#>   }
  xenon:
    <<: *dtword
    _content:
    _check:
      - is_word()
      - in_dictionary() zero dep equil
#>
#>   {\bf samar} samarium\_treatment
#>   \VERAInputTable{
#>     name={samarium\_treatment},
#>     type={Character String},
#>     need={Optional},
#>     unitsdefault={},
#>     unitsother={},
#>     valuedefault={dep},
#>     valuesapplicable={zero, equil, peak},
#>     limitations={},
#>     description={Samarium treatment option:
#>     \begin{itemize}
#>        \item \texttt{zero}: sets $^{149}$Pm and $^{149}$Sm number densities to zero
#>        \item \texttt{equil}: sets $^{149}$Pm and $^{149}$Sm number densities to calculated equilibrium values
#>        \item \texttt{dep}: treats $^{149}$Pm and $^{149}$Sm explicitly as other isotopes in transport calculation
#>        \item \texttt{peak}: adds $^{149}$Pm number density to $^{149}$Sm number density and then sets $^{149}$Pm
#>                                number density to zero
#>     \end{itemize}},
#>     notes={}
#>   }
  samar:
    <<: *dtword
    _content:
    _check:
      - is_word()
      - in_dictionary() zero dep equil peak
#>
#>   {\bf rlx\_xesm} Xe-Sm\_relaxation
#>   \VERAInputTable{
#>     name={Xe-Sm\_relaxation},
#>     type={Float},
#>     need={Optional},
#>     unitsdefault={},
#>     unitsother={},
#>     valuedefault={1.0},
#>     valuesapplicable={$>0$},
#>     limitations={},
#>     description={Xenon-samarium equilibrium relaxation factor},
#>     notes={Recommend value: 1.0}
#>   }
  rlx_xesm:
    <<: *dtdouble
    _content:
    _check:
      - is_float()
      - is_gt() 0
      - is_leq() 1.0
#>
#>   {\bf pred\_order} predictor\_order
#>   \VERAInputTable{
#>     name={predictor\_order},
#>     type={Integer},
#>     need={Optional},
#>     unitsdefault={},
#>     unitsother={},
#>     valuedefault={0},
#>     valuesapplicable={$\ge 0$},
#>     limitations={},
#>     description={This card is used to specify the order of polynomial approximation
#>        to use for extrapolation of microscopic cross sections and fluxes over
#>        predictor depletion substeps},
#>     notes={The methodology employed for high-order depletion is described in the article by
#>        G. G. Davidson et al., ``Nuclide Depletion Capabilities in the Shift Monte Carlo
#>        Code,'' \textit{Annals of Nuclear Energy}, 114, pp. 259--276 (2018). For any given timestep,
#>        the code will attempt the highest polynomial order approximation without
#>        exceeding the user specification, as is allowed by the generated data thus far.
#>        For example, if the user designates order 2, then on the first timestep, order 0
#>        will be used since no previous time data are available. On the second timestep, order
#>        1 will be used since only one previous set of time data is available, and on the
#>        third and subsequent timesteps order 2 will be used since sufficient data from
#>        previous timesteps are available to perform an order 2 fit}
#>   }
  pred_order:
    <<: *dtint
    _content:
    _check:
      - is_int()
      - is_geq() 0
#>
#>   {\bf corr\_order} corrector\_order
#>   \VERAInputTable{
#>     name={corrector\_order},
#>     type={Integer},
#>     need={Optional},
#>     unitsdefault={},
#>     unitsother={},
#>     valuedefault={0},
#>     valuesapplicable={$\ge 0$},
#>     limitations={},
#>     description={This card is used to specify the order of polynomial approximation
#>        to use for interpolation of microscopic cross sections and fluxes over
#>        corrector depletion substeps},
#>     notes={This follows the same methodology as described for \texttt{pred\_order}}
#>   }
  corr_order:
    <<: *dtint
    _content:
    _check:
      - is_int()
      - is_geq() 0
#>
#>   {\bf boron} boron\_concentration
#>   \VERAInputTable{
#>     name={boron\_concentration},
#>     type={Float},
#>     need={Optional},
#>     unitsdefault={ppm},
#>     unitsother={},
#>     valuedefault={0.0},
#>     valuesapplicable={$\ge 0$},
#>     limitations={},
#>     description={Soluble boron concentration in the moderator},
#>     notes={}
#>   }
  boron:
    <<: *dtdouble
    _content:
    _check:
      - is_float()
      - is_geq() 0
#>
#>   {\bf b10} b10\_fraction b10\_depletion
#>   \VERAInputTable{
#>     name={b10\_fraction},
#>     type={Float},
#>     need={Optional},
#>     unitsdefault={},
#>     unitsother={Atom fraction of B-10 in boron},
#>     valuedefault={0.199},
#>     valuesapplicable={$\ge 0$},
#>     limitations={},
#>     description={Boron-10 fraction in coolant},
#>     notes={}
#>   }
#>   \VERAInputTable{
#>     name={b10\_depletion},
#>     type={Boolean},
#>     need={Optional},
#>     unitsdefault={},
#>     unitsother={},
#>     valuedefault={False},
#>     valuesapplicable={True},
#>     limitations={},
#>     description={Flag to enable B-10 depletion in coolant},
#>     notes={Required when using input parameter \texttt{b10} }
#>   }
  b10:
    <<: *dtlist
    _content:
    _check:
      - arraysize()==2
      - is_float(nth(0,()))
      - is_word(nth(1,()))
      - nth(0,())>=0
#>
#>   {\bf kcrit} target\_eigenvalue
#>   \VERAInputTable{
#>     name={target\_eigenvalue},
#>     type={Float},
#>     need={Optional},
#>     unitsdefault={},
#>     unitsother={},
#>     valuedefault={1.0},
#>     valuesapplicable={$\ge 0$},
#>     limitations={},
#>     description={Target eigenvalue used in boron, rod, power, flow, and tinlet search},
#>     notes={}
#>   }
  kcrit:
    <<: *dtdouble
    _content:
    _check:
      - is_float()
      - is_geq() 0
#>
#>   {\bf search} search\_option
#>   \VERAInputTable{
#>     name={search\_option},
#>     type={Character String},
#>     need={Optional},
#>     unitsdefault={},
#>     unitsother={},
#>     valuedefault={keff},
#>     valuesapplicable={boron, rod, power, flow, tinlet},
#>     limitations={},
#>     description={Search option},
#>     notes={}
#>   }
  search:
    <<: *dtword
    _content:
    _check:
      - is_word()
      - in_dictionary() keff boron rod power flow tinlet
#>
#>   {\bf search\_bank} rod\_search\_bank
#>   \VERAInputTable{
#>     name={rod\_search\_bank},
#>     type={Character String},
#>     need={Optional},
#>     unitsdefault={},
#>     unitsother={},
#>     valuedefault={},
#>     valuesapplicable={},
#>     limitations={},
#>     description={Control rod bank to be moved in rod search problems},
#>     notes={Required when input parameter \texttt{search} is set to \texttt{rod}}
#>   }
  search_bank:
    <<: *dtword
    _content:
    _check:
      - is_word()
#>
#>   {\bf pressure} outlet\_pressure
#>   \VERAInputTable{
#>     name={outlet\_pressure},
#>     type={Float},
#>     need={Optional},
#>     unitsdefault={psia},
#>     unitsother={},
#>     valuedefault={},
#>     valuesapplicable={$>0$},
#>     limitations={},
#>     description={Core exit pressure},

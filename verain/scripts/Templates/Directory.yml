  apitch_tec:
    <<: *dtdouble
    _content:
    _check:
      - is_float()
#>
#>   {\bf ppitch\_tec} pin\_pitch\_expansion\_coefficient
#>   \VERAInputTable{
#>     name={pin\_pitch\_expansion\_coefficient},
#>     type={Float},
#>     need={Optional},
#>     unitsdefault={K$^{-1}$},
#>     unitsother={},
#>     valuedefault={},
#>     valuesapplicable={$\ge 0$, $<50.0\times 10^{-6}$},
#>     limitations={},
#>     description={Thermal expansion coefficient to be used when expanding the pins in the
#>        problem. If not specified, the expansion coefficient will be calculated internally
#>        assuming Zircaloy-4 for grid materials.},
#>     notes={}
#>   }
  ppitch_tec:
    <<: *dtdouble
    _content:
    _check:
      - is_float()
#>
#>   {\bf axial\_tec} axial\_tec
#>   \VERAInputTable{
#>     name={axial\_tec},
#>     type={Float},
#>     need={Optional},
#>     unitsdefault={K$^{-1}$},
#>     unitsother={},
#>     valuedefault={},
#>     valuesapplicable={$\ge 0$, $<50.0\times 10^{-6}$},
#>     limitations={},
#>     description={Thermal expansion coefficient to be used when expanding the axial
#>        dimension of the problem. If not specified, the expansion coefficient will
#>        be calculated internally assuming UO2 thermal expansion coefficient and the
#>        fuel temperature. This is only done if 3-D expansion is enabled.},
#>     notes={}
#>   }
  axial_tec:
    <<: *dtdouble
    _content:
    _check:
      - is_float()
#>
#>   {\bf sym} symmetry\_option
#>   \VERAInputTable{
#>     name={symmetry\_option},
#>     type={Character String},
#>     need={Optional},
#>     unitsdefault={},
#>     unitsother={},
#>     valuedefault={full},
#>     valuesapplicable={qtr},
#>     limitations={},
#>     description={Option for specifying the symmetry of the problem. The \texttt{full}
#>        option specifies that the problem will be modeled in full and that ray tracing
#>        will be performed accross the whole geometry. The \texttt{qtr} option will
#>        only model the south-east quarter of the geometry.  In quarter-symmetry, the
#>        boundary conditions along the symmetry boundary are determined by the
#>        \texttt{bc\_sym} card.},
#>     notes={For multistate simulations, if \texttt{sym} is not specified in the first state,
#>        any \texttt{sym} options specified in future states will be ignored. }
#>   }
  sym:
    <<: *dtword
    _content:
    _check:
      - is_word()
      - in_dictionary() full qtr
#>
#>   {\bf kmul\_beta} kmul\_beta
#>   \VERAInputTable{
#>     name={kmul\_beta},
#>     type={Float},
#>     need={Optional},
#>     unitsdefault={},
#>     unitsother={},
#>     valuedefault={1.0},
#>     valuesapplicable={Real numbers on the interval (0.0,1.0]},
#>     limitations={Cannot specify exactly 0.},
#>     description={This option is used to specify the direct multiplier on     %
#>       beta, the delayed neutron fraction. This option is used to apply conservatism to transient %
#>       calculations specifically for RIA.},
#>     notes={}
#>   }
  kmul_beta:
    <<: *dtdouble
    _content:
    _check:
      - is_gt() 0
      - is_leq()  1
#>
#>   {\bf kmul\_doppler} kmul\_doppler
#>   \VERAInputTable{
#>     name={kmul\_doppler},
#>     type={double},
#>     need={Optional},
#>     unitsdefault={},
#>     unitsother={},
#>     valuedefault={1.0},
#>     valuesapplicable={Real numbers on the interval (0.0,1.0]},
#>     limitations={Cannot specify exactly 0.},
#>     description={This option is used to specify the direct multiplier on     %
#>       the temperature difference that the fuel experiences when evaluating   %
#>       cross sections. Used to apply conservatism to transient calculations.  %
#>       Can be used in steady-state calculations to iterate to desired value.},
#>     notes={}
#>   }
  kmul_doppler:
    <<: *dtdouble
    _content:
    _check:
      - is_gt() 0
      - is_leq() 1
#>
#>   {\bf kmul\_modtemp} kmul\_modtemp
#>   \VERAInputTable{
#>     name={kmul\_modtemp},
#>     type={double},
#>     need={Optional},
#>     unitsdefault={},
#>     unitsother={},
#>     valuedefault={1.0},
#>     valuesapplicable={Real numbers on the interval (0.0,1.0]},
#>     limitations={Cannot specify exactly 0.},
#>     description={This option is used to specify the direct multiplier on     %
#>       the temperature difference that the moderator experiences when         %
#>       evaluating cross sections. Used to apply conservatism to transient     %
#>       calculations. Can be used in steady-state calculations to iterate to   %
#>       desired value.},
#>     notes={}
#>   }
  kmul_modtemp:
    <<: *dtdouble
    _content:
    _check:
      - is_gt() 0
      - is_leq() 1
#>
#>   {\bf kmul\_crw} kmul\_crw
#>   \VERAInputTable{
#>     name={kmul\_crw},
#>     type={double},
#>     need={Optional},
#>     unitsdefault={},
#>     unitsother={},
#>     valuedefault={1.0},
#>     valuesapplicable={Real numbers on the interval (0.0,1.0]},
#>     limitations={Cannot specify exactly 0.},
#>     description={This option is used to specify the direct multiplier on     %
#>       the critical rod worth. This option is used to apply conservatism to transient             %
#>       calculations specifically for RIA.},
#>     notes={}
#>   }
  kmul_crw:
    <<: *dtdouble
    _content:
    _check:
      - is_gt() 0
      - is_leq() 100
#>
#>   {\bf scram\_type} scram\_type scram\_rate scram\_time
#>   \VERAInputTable{
#>     name={scram\_type},
#>     type={Free Form Character String, Pairs of doubles},
#>     need={Optional},
#>     unitsdefault={false},
#>     unitsother={true},
#>     valuedefault={},
#>     valuesapplicable={},
#>     limitations={Can only be used for transient cases, and at least one  %
#>       ``trip\_'' card must be present to specify trip conditions.},
#>     description={This option is used to specify the scram type (of which %
#>       the only current option is ``trip'') and the scram bank movement   %
#>       speed intervals. These are specified using rate/time pairs, where  %
#>       each rate is accociated with the following time interval. The      %
#>       units are RUs/second and seconds, respectively. At least one       %
#>       time/rate pair must be present.},
#>     notes={This card is only used in transient calculations.}
#>   }
  scram_type:
    <<: *dtlist
    _style: multi-line
    _content:
    _check:
      - is_word(nth(0,()))
      - fall(sub{is_float(shift)},stride(1,2,()))
      - fall(sub{is_geq(shift,0)},stride(1,2,()))
      - fall(sub{is_float(shift)},stride(2,2,()))
      - fall(sub{is_gt(shift,0)},stride(2,2,()))
      - arraysize()%2!=0
#>
#>   {\bf bank\_wd} bank\_wd
#>   \VERAInputTable{
#>     name={bank\_wd},
#>     type={List of Free Form Character Strings paired with an Integer and Float},
#>     need={Optional},
#>     unitsdefault={},
#>     unitsother={},
#>     valuedefault={},
#>     valuesapplicable={Any control rod bank label and real values $>0$},
#>     limitations={Currently only works for one control rod bank and for transient cases.},
#>     description={This card is used to specify the position of a control rod bank      %
#>       at a specified time.  There is no limit to the number of time and position      %
#>       pairs, and at least one pair must exist.                                        %
#>       \begin{itemize}                                                                 %

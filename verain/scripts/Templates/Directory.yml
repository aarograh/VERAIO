#>     name={cmfd\_relax\_negative},
#>     type={Boolean},
#>     need={Optional},
#>     unitsdefault={},
#>     unitsother={},
#>     valuedefault={\texttt{false}},
#>     valuesapplicable={\texttt{true}},
#>     limitations={},
#>     description={This option is to under-relax the CMFD flux when negative CMFD
#>        flux is calculated. If a negative CMFD flux is calculated at the end of
#>        CMFD iteration, then the CMFD flux is under-relaxed by the group-dependent
#>        relaxation factor. The under-relaxation factor, $f_g$, is determined
#>        to satisfy the following inequality:
#>        $f_g \phi_g^\text{new} + (1-f_g)\phi_g^\text{old} > 0$},
#>     notes={This card can be used with \texttt{cmfd\_relaxation}.
#>        This card changes the CMFD flux itself only if a negative CMFD flux is
#>        calculated. However, the \texttt{cmfd\_relaxation} card changes
#>        the projection factor}
#>   }
  cmfd_relax_negative:
    <<: *dtbool
    _content:
    _check:
      - is_word()
      - in_dictionary() true false
#>

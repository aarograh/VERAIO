  crud:
    <<: *dtword
    _content:
    _check:
      - is_word()
      - in_dictionary() on off
#>
#>   {\bf excore\_transport} excore\_transport\_option
#>   \VERAInputTable{
#>     name={excore\_transport\_option},
#>     type={Character String},
#>     need={Optional},
#>     unitsdefault={},
#>     unitsother={},
#>     valuedefault={off},
#>     valuesapplicable={on},
#>     limitations={},
#>     description={Flag to turn on and off Shift excore transport coupling.},

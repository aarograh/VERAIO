#>     name={parallel},
#>     type={Integer},
#>     need={Optional},
#>     unitsdefault={},
#>     unitsother={},
#>     valuedefault={1},
#>     valuesapplicable={0, 1},
#>     limitations={},
#>     description={Instructs CTF to run in serial (0) or in parallel (1)},

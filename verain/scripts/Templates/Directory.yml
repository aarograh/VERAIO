#>
#>   {\bf temptable} temptable
#>   \VERAInputTable{
#>     name={temptable},
#>     type={Character String},
#>     need={Optional},
#>     unitsdefault={},
#>     unitsother={},
#>     valuedefault={},
#>     valuesapplicable={},
#>     limitations={Requires a temperature table file to be included below},
#>     description={This flag defines a temperature table in the assembly block

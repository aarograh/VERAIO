_DATATYPES:
  _dtword: &dtword
    _parse: 'scalar'
    _type:  'word'
  _dtstring: &dtstring
    _parse: 'scalar'
    _type:  'string'
  _dtdate: &dtdate
    _parse: 'scalar'
    _type:  'date'
  _dtfloat: &dtfloat
    _parse: 'scalar'
    _type:  'float'
  _dtdouble: &dtdouble
    _parse: 'scalar'
    _type:  'double'
  _dtdblnamed: &dtdblnamed
    _parse: 'scalar'
    _type:  'double'
    _named: 1
  _dtint: &dtint
    _parse: 'scalar'
    _type:  'int'
  _dtbool: &dtbool
    _parse: 'scalar'
    _type:  'word'
  _dtlist: &dtlist
    _parse: 'list'
    _named: 0
  _dtlistnamed: &dtlistnamed
    _parse: 'list'
    _named: 1
  _dtblock: &dtblock
    _parse: 'block'
    _named: 0
  _dtblocknamed: &dtblocknamed
    _parse: 'block'
    _named: 1

_DIRECTORY:
  CASEID:
  STATE:
  CORE:
  ASSEMBLY:
  CONTROL:
  INSERT:
  DETECTOR:
  EDITS:
  SHIFT:
  COBRATF:
  COUPLING:
  MPACT:
  BISON:
  FAST:
  MAMBA:
  TIAMAT:
  RUN:

#>
#> \subsection{Block CASEID}
#> \label{sec:caseidcards}
CASEID:
#>
#>   {\bf title} case\_name
#>   \VERAInputTable{
#>     name={case\_name},
#>     type={Character String},
#>     need={Optional},
#>     unitsdefault={},
#>     unitsother={},
#>     valuedefault={},
#>     valuesapplicable={},
#>     limitations={},
#>     description={Problem name},
#>     notes={}
#>   }
  title:
    <<: *dtstring
    _content: default
    _check:
      - is_string()
#>
#> \subsection{Block STATE}
#> \label{sec:statecards}
STATE:
  <<: *dtblocknamed
  id:
    <<: *dtstring
    _content:
    _check:
      - is_string()
#>
#>   {\bf title} state\_name
#>   \VERAInputTable{
#>     name={state\_name},
#>     type={Character String},
#>     need={Optional},
#>     unitsdefault={},
#>     unitsother={},
#>     valuedefault={},
#>     valuesapplicable={},
#>     limitations={},
#>     description={State name},
#>     notes={}
#>   }
  title:
    <<: *dtstring
    _content:
    _check:
      - is_string()
#>
#>   {\bf op\_date} operating\_date
#>   \VERAInputTable{
#>     name={operating\_date},
#>     type={Character String},
#>     need={Optional},
#>     unitsdefault={},
#>     unitsother={},
#>     valuedefault={},
#>     valuesapplicable={},
#>     limitations={Limited to ``MM/DD/YYYY'' or ``YYYY/MM/DD''},
#>     description={Operating date of this statepoint.  Used when writing restart files.
#>        The operating date must be entered for any restart file that is used in a core
#>        shuffle so that the isotopic decay can be calculated during an outage.},
#>     notes={}
#>   }
  op_date:
    <<: *dtdate
    _content:
    _check:
      - is_string()
#>
#>   {\bf power} percent\_power
#>   \VERAInputTable{
#>     name={percent\_power},
#>     type={Float},
#>     need={Optional},
#>     unitsdefault={Percent},
#>     unitsother={},
#>     valuedefault={$1.0\times 10^{-8}$},
#>     valuesapplicable={$\ge 0$},
#>     limitations={},
#>     description={Percent of rated operating power},
#>     notes={Cannot be zero when depleting}
#>   }
  power:
    <<: *dtdouble
    _content:
    _check:
      - is_float()
      - is_geq() 0
#>
#>   {\bf flow} percent\_flow
#>   \VERAInputTable{
#>     name={percent\_flow},
#>     type={Float},
#>     need={Optional},
#>     unitsdefault={Percent},
#>     unitsother={},
#>     valuedefault={$1.0\times 10^{-8}$},
#>     valuesapplicable={$\ge 0$},
#>     limitations={},
#>     description={Percent of rated operating flow},
#>     notes={}
#>   }
  flow:
    <<: *dtdouble
    _content:
    _check:
      - is_float()
      - is_geq() 0
#>
#>   {\bf flow\_dist} nominal\_flow\_multiplier
#>   \VERAInputTable{
#>     name={nominal\_flow\_multiplier},
#>     type={2D Float Map},
#>     need={Optional},
#>     unitsdefault={},
#>     unitsother={},
#>     valuedefault={1},
#>     valuesapplicable={$>0$},
#>     limitations={},
#>     description={2-D array that must match the shape of assm\_map in [CORE].
#>        Gives a multiplier that will be applied to nominal inlet mass flow rate in each assembly.},
#>     notes={This map is not normally used.}
#>   }
  flow_dist:
    <<: *dtlist
    _style: multi-line
    _content:
    _check:
      - fall(sub{is_word(shift)},())
      - fall(sub{is_float(shift)},())
      - fall(sub{not_in_dictionary(shift,'_EMPTY_')},())
#>
#>   {\bf blade\_pos} blade\_pos
#>   \VERAInputTable{
#>     name={blade\_pos},
#>     type={2D Float Map},
#>     need={Optional},
#>     unitsdefault={},
#>     unitsother={},
#>     valuedefault={},
#>     valuesapplicable={$\ge 0$},
#>     limitations={},
#>     description={Steps withdrawn for each blade location},
#>     notes={}
#>   }
  blade_pos:
    <<: *dtlist
    _style: multi-line
    _content:
    _check:
      - fall(sub{is_float(shift)},())
      - fall(sub{is_geq(shift,0.0)},())
#>
#>   {\bf pout\_dist} outlet\_pressure\_adder
#>   \VERAInputTable{
#>     name={outlet\_pressure\_adder},
#>     type={2D Float Map},
#>     need={Optional},
#>     unitsdefault={psi},
#>     unitsother={},
#>     valuedefault={0.0},
#>     valuesapplicable={Any float},
#>     limitations={},
#>     description={2-D array that must match the shape of assm\_map in [CORE].
#>        Gives an adder that will be added to nominal outlet pressure in each assembly.},
#>     notes={This map is not normally used.}
#>   }
  pout_dist:
    <<: *dtlist
    _style: multi-line
    _content:
    _check:
      - fall(sub{is_word(shift)},())
      - fall(sub{is_float(shift)},())
      - fall(sub{not_in_dictionary(shift,'_EMPTY_')},())
#>
#>   {\bf bypass} bypass\_option
#>   \VERAInputTable{
#>     name={bypass\_option},
#>     type={Float or String},
#>     need={Optional},
#>     unitsdefault={},
#>     unitsother={Percent},
#>     valuedefault={0},
#>     valuesapplicable={$\ge 0$, table},
#>     limitations={},
#>     description={Bypass flow fraction applied to the actual flow, or the word ``table''
#>                  indicating that a bypass flow rate table specified in [CORE] should be used.},
#>     notes={}
#>   }
  bypass:
    <<: *dtstring
    _content:
    _check:
      - is_string()
#>
#>   {\bf tinlet} inlet\_temperature units
#>   \VERAInputTable{
#>     name={inlet\_temperature},
#>     type={Float or String},
#>     need={Optional},
#>     unitsdefault={C},
#>     unitsother={F, K},
#>     valuedefault={326.85 C},
#>     valuesapplicable={$>0$, table},
#>     limitations={},
#>     description={Core inlet temperature in given units. Examples of this card are
#>                  \texttt{tinlet 560 F} or \texttt{tinlet 600 K}. Alternatively,
#>                  \texttt{tinlet table} can be used to invoke the tinlet\_table.},
#>     notes={Required when coupling to CTF.}
#>   }
  tinlet:
    <<: *dtstring
    _content:
    _check:
      - is_string()
#>
#>   {\bf tinlet\_dist} inlet\_temperature\_adder
#>   \VERAInputTable{
#>     name={inlet\_temperature\_adder},
#>     type={2D Float Map},
#>     need={Optional},
#>     unitsdefault={C},
#>     unitsother={},
#>     valuedefault={0},
#>     valuesapplicable={},
#>     limitations={},
#>     description={2-D array that must match the shape of assm\_map in [CORE].
#>        Gives an adder that will be applied to nominal inlet temperature in each assembly.},
#>     notes={This map is not normally used.}
#>   }
  tinlet_dist:
    <<: *dtlist
    _style: multi-line
    _content:
    _check:
      - fall(sub{is_word(shift)},())
      - fall(sub{is_float(shift)},())
      - fall(sub{not_in_dictionary(shift,'_EMPTY_')},())
#>
#>   {\bf subcool} inlet\_subcooled\_enthalpy
#>   \VERAInputTable{
#>     name={inlet\_subcooled\_enthalpy},
#>     type={Float},
#>     need={Optional},
#>     unitsdefault={BTU/lbm},
#>     unitsother={},
#>     valuedefault={},
#>     valuesapplicable={$\ge 0$},
#>     limitations={Cannot be used along with \texttt{tinlet} card.  Requires \texttt{pressure} card.},
#>     description={The enthalpy below the saturated liquid enthalpy at the inlet.},
#>     notes={\texttt{tinlet} or \texttt{subcool} cards are required and are exclusive}
#>   }
  subcool:
    <<: *dtdouble
    _content:
    _check:
      - is_float()
      - is_geq() 0
#>
#>   {\bf void} void\_distribution
#>   \VERAInputTable{
#>     name={void\_distribution},
#>     type={Float},
#>     need={Optional},
#>     unitsdefault={Percent},
#>     unitsother={},
#>     valuedefault={},
#>     valuesapplicable={$>0$, $<100$},
#>     limitations={},
#>     description={Assembly-wise radial void distribution in percent.},
#>     notes={BWR only.}
#>   }
  void:
    <<: *dtlist
    _style: multi-line
    _content:
    _check:
      - fall(sub{is_word(shift)},())
      - fall(sub{is_float(shift)},())
      - fall(sub{not_in_dictionary(shift,'_EMPTY_')},())
#>
#>   {\bf axial\_void} axial\_void\_map axial\_void\_bounds
#>   \VERAInputTable{
#>     name={axial\_void\_map},
#>     type={Float},
#>     need={Optional},
#>     unitsdefault={Percent},
#>     unitsother={},
#>     valuedefault={},
#>     valuesapplicable={$\ge 0$, $\le 100$},
#>     limitations={},
#>     description={List of axial void fractions.},
#>     notes={BWR only.}
#>   }
#>   \VERAInputTable{
#>     name={axial\_void\_bounds},
#>     type={Float},
#>     need={Optional},
#>     unitsdefault={cm},
#>     unitsother={},
#>     valuedefault={},
#>     valuesapplicable={},
#>     limitations={},
#>     description={List of axial elevations for axial void fractions.},
#>     notes={BWR only.}
#>   }
  axial_void:
    <<: *dtlist
    _style: multi-line
    _check:
      - fall(sub{is_float(shift)},())
      - arraysize()%2==1
      - fall(sub{is_geq(shift,0)},odd([]))
      - fall(sub{is_leq(shift,100)},odd([]))
      - is_strictlyincreasing(even([]))
#>
#>   {\bf tfuel} fuel\_temperature units
#>   \VERAInputTable{
#>     name={fuel\_temperature},
#>     type={Float},
#>     need={Optional},
#>     unitsdefault={K},
#>     unitsother={F, C},
#>     valuedefault={600 K},
#>     valuesapplicable={$>0K$, $<1600K$},
#>     limitations={},
#>     description={Fixed fuel temperatures.},
#>     notes={Only used if feedback is turned OFF. Examples of this card are \texttt{900 K}
#>        or \texttt{1200 F}.}
#>   }
  tfuel:
    <<: *dtlist
    _content:
    _check:
      - arraysize()==2
      - is_float(nth(0,()))
      - is_word(nth(1,()))
      - in_dictionary(nth(1,()),'F','C','K')
#>
#>   {\bf modden} mod\_density
#>   \VERAInputTable{
#>     name={mod\_density},
#>     type={Float},
#>     need={Optional},
#>     unitsdefault={g/cc},
#>     unitsother={},
#>     valuedefault={0.743},
#>     valuesapplicable={$>0.01$, $<1.2$},
#>     limitations={},
#>     description={Fixed moderator density.},
#>     notes={Only used if feedback is turned OFF.}
#>   }
  modden:
    <<: *dtdouble
    _content:
    _check:
      - is_float()
      - is_gt() 0
#>
#>   {\bf xenon} xenon\_treatment
#>   \VERAInputTable{
#>     name={xenon\_treatment},
#>     type={Character String},
#>     need={Optional},
#>     unitsdefault={},
#>     unitsother={},
#>     valuedefault={dep},
#>     valuesapplicable={zero, equil},
#>     limitations={},
#>     description={Xenon treatment option:
#>     \begin{itemize}
#>        \item \texttt{zero} --- Sets I-135 and Xe-135 number densities to zero.
#>        \item \texttt{equil} --- Sets I-135 and Xe-135 number densities to calculated equilibrium values.
#>        \item \texttt{dep} --- Treats I-135 and Xe-135 explicitly as other isotopes in transport calculation.
#>     \end{itemize}
#>     },
#>     notes={}
#>   }
  xenon:
    <<: *dtword
    _content:
    _check:
      - is_word()
      - in_dictionary() zero dep equil
#>
#>   {\bf samar} samarium\_treatment
#>   \VERAInputTable{
#>     name={samarium\_treatment},
#>     type={Character String},
#>     need={Optional},
#>     unitsdefault={},
#>     unitsother={},
#>     valuedefault={dep},
#>     valuesapplicable={zero, equil, peak},
#>     limitations={},
#>     description={Samarium treatment option:
#>     \begin{itemize}
#>        \item \texttt{zero} --- Sets Pm-149 and Sm-149 number densities to zero.
#>        \item \texttt{equil} --- Sets Pm-149 and Sm-149 number densities to calculated equilibrium values.
#>        \item \texttt{dep} --- Treats Pm-149 and Sm-149 explicitly as other isotopes in transport calculation.
#>        \item \texttt{peak} --- Adds Pm-149 number density to Sm-149 number density and then sets Pm-149
#>                                number density to zero.
#>     \end{itemize}
#>     },
#>     notes={}
#>   }
  samar:
    <<: *dtword
    _content:
    _check:
      - is_word()
      - in_dictionary() zero dep equil peak
#>
#>   {\bf rlx\_xesm} Xe-Sm\_relaxation
#>   \VERAInputTable{
#>     name={Xe-Sm\_relaxation},
#>     type={Float},
#>     need={Optional},
#>     unitsdefault={},
#>     unitsother={},
#>     valuedefault={1.0},
#>     valuesapplicable={$>0$},
#>     limitations={},
#>     description={Xenon-samarium equilibrium relaxation factor.},
#>     notes={Recommend value: 1.0.}
#>   }
  rlx_xesm:
    <<: *dtdouble
    _content:
    _check:
      - is_float()
      - is_gt() 0
      - is_leq() 1.0
#>
#>   {\bf pred\_order} predictor\_order
#>   \VERAInputTable{
#>     name={predictor\_order},
#>     type={Integer},
#>     need={Optional},
#>     unitsdefault={},
#>     unitsother={},
#>     valuedefault={0},
#>     valuesapplicable={$\ge 0$},
#>     limitations={},
#>     description={This card is used to specify the order of polynomial approximation    %
#>       to use for extrapolation of microscopic cross sections and fluxes over           %
#>       predictor depletion substeps.},
#>     notes={The methodology employed for high order depletion is described in           %
#>       G. G. Davidson, et al., "Nuclide depletion capabilities in the Shift Monte Carlo %
#>       code", Annals of Nuclear Energy, 114, pg 259-276 (2018).  For any given timestep %
#>       the code will attempt the highest polynomial order approximation, without        %
#>       exceeding the user specification, as is allowed by the thus far generated data.  %
#>       For example, if the user designates order 2, then on the first time step order 0 %
#>       will be used since no previous time data is available.  On the second step order %
#>       1 will be used since only one previous set of time data is available, and on the %
#>       third and subsequent steps order 2 will be used since sufficient data from       %
#>       previous timesteps is available to perform an order 2 fit.}
#>   }
  pred_order:
    <<: *dtint
    _content:
    _check:
      - is_int()
      - is_geq() 0
#>
#>   {\bf corr\_order} corrector\_order
#>   \VERAInputTable{
#>     name={corrector\_order},
#>     type={Integer},
#>     need={Optional},
#>     unitsdefault={},
#>     unitsother={},
#>     valuedefault={0},
#>     valuesapplicable={$\ge 0$},
#>     limitations={},
#>    description={This card is used to specify the order of polynomial approximation    %
#>      to use for interpolation of microscopic cross sections and fluxes over %
#>      corrector depletion substeps.},
#>    notes={This follows the same methodology as described for \texttt{pred\_order}}
#>   }
  corr_order:
    <<: *dtint
    _content:
    _check:
      - is_int()
      - is_geq() 0
#>
#>   {\bf boron} boron\_concentration
#>   \VERAInputTable{
#>     name={boron\_concentration},
#>     type={Float},
#>     need={Optional},
#>     unitsdefault={ppm},
#>     unitsother={},
#>     valuedefault={0.0},
#>     valuesapplicable={$\ge 0$},
#>     limitations={},
#>     description={Soluble boron concentration in the moderator},
#>     notes={}
#>   }
  boron:
    <<: *dtdouble
    _content:
    _check:
      - is_float()
      - is_geq() 0
#>
#>   {\bf b10} b10\_fraction b10\_depletion
#>   \VERAInputTable{
#>     name={b10\_fraction},
#>     type={Float},
#>     need={Optional},
#>     unitsdefault={},
#>     unitsother={Atom fraction of B-10 in boron},
#>     valuedefault={0.199},
#>     valuesapplicable={$\ge 0$},
#>     limitations={},
#>     description={Boron-10 fraction in coolant},
#>     notes={}
#>   }
#>   \VERAInputTable{
#>     name={b10\_depletion},
#>     type={Boolean},
#>     need={Optional},
#>     unitsdefault={},
#>     unitsother={},
#>     valuedefault={False},
#>     valuesapplicable={True},
#>     limitations={},
#>     description={Flag to enable B-10 depletion in coolant},
#>     notes={Required when using input parameter \texttt{b10} }
#>   }
  b10:
    <<: *dtlist
    _content:
    _check:
      - arraysize()==2
      - is_float(nth(0,()))
      - is_word(nth(1,()))
      - nth(0,())>=0
#>
#>   {\bf kcrit} target\_eigenvalue
#>   \VERAInputTable{
#>     name={target\_eigenvalue},
#>     type={Float},
#>     need={Optional},
#>     unitsdefault={},
#>     unitsother={},
#>     valuedefault={1.0},
#>     valuesapplicable={$\ge 0$},
#>     limitations={},
#>     description={Target eigenvalue used in boron search or rod search},
#>     notes={}
#>   }
  kcrit:
    <<: *dtdouble
    _content:
    _check:
      - is_float()
      - is_geq() 0
#>
#>   {\bf search} search\_option
#>   \VERAInputTable{
#>     name={search\_option},
#>     type={Character String},
#>     need={Optional},
#>     unitsdefault={},
#>     unitsother={},
#>     valuedefault={keff},
#>     valuesapplicable={boron, rod},
#>     limitations={},
#>     description={Search option},
#>     notes={}
#>   }
  search:
    <<: *dtword
    _content:
    _check:
      - is_word()
      - in_dictionary() keff boron rod
#>
#>   {\bf search\_bank} rod\_search\_bank
#>   \VERAInputTable{
#>     name={rod\_search\_bank},
#>     type={Character String},
#>     need={Optional},
#>     unitsdefault={},
#>     unitsother={},
#>     valuedefault={},
#>     valuesapplicable={},
#>     limitations={},
#>     description={Control rod bank to be moved in rod search problems},
#>     notes={Required when input parameter \texttt{search} is set to \texttt{rod}}
#>   }
  search_bank:
    <<: *dtword
    _content:
    _check:
      - is_word()
#>
#>   {\bf pressure} outlet\_pressure
#>   \VERAInputTable{
#>     name={outlet\_pressure},
#>     type={Float},
#>     need={Optional},
#>     unitsdefault={psia},
#>     unitsother={},
#>     valuedefault={},
#>     valuesapplicable={$>0$},
#>     limitations={},
#>     description={Core exit pressure},
#>     notes={Required for BWR calculations.  For PWR calculations, the default
#>       is 2250 psia.  When using simplified TH calculations for PWRs, this
#>       value must be 2250 psia if it is specified.}
#>   }
  pressure:
    <<: *dtdouble
    _content:
    _check:
      - is_float()
      - is_gt() 0
#>
#>   {\bf deplete} deplete\_units depletion\_steps
#>   \VERAInputTable{
#>     name={deplete},
#>     type={Float},
#>     need={Optional},
#>     unitsdefault={},
#>     unitsother={GWDMT, MWDMT, EFPD, hours},
#>     valuedefault={},
#>     valuesapplicable={\texttt{depletion\_steps} must be listed in ascending order},
#>     limitations={},
#>     description={Specification of depletion units and a single or multiple depletion steps.},
#>     notes={Recommended that depletion step sizes are less than 1 GWDMT, 1000 MWDMT, or 30 EFPD.}
#>   }
  deplete:
    <<: *dtlist
    _style: multi-line
    _content:
    _check:
      - fall(sub{is_float(shift)},stride(1,1,()))
      - nth(0,())eq"GWDMT"||nth(0,())eq"MWDMT"||nth(0,())eq"EFPD"||nth(0,())eq"hours"
      - is_strictlyincreasing(stride(1,1,()))
#>
#>   {\bf jump\_in\_file} file\_name
#>   \VERAInputTable{
#>     name={jump\_in\_file},
#>     type={Character String},
#>     need={Optional},
#>     unitsdefault={},
#>     unitsother={},
#>     valuedefault={},
#>     valuesapplicable={},
#>     limitations={},
#>     description={Name of h5 file containing data needed to perform detailed isotopic
#>        burn for cycle jump in. The inclusion of this card/file name will initiate an
#>        Origen point depletion based "burn in" according to the data in the h5 file.},
#>     notes={Origen must be present and enabled in order to use this feature.}
#>   }
  jump_in_file:
    <<: *dtstring
    _content:
    _check:
      - is_string()
#>
#>   {\bf edit} state\_edits
#>   \VERAInputTable{
#>     name={state\_edits},
#>     type={Character String},
#>     need={Optional},
#>     unitsdefault={},
#>     unitsother={},
#>     valuedefault={},
#>     valuesapplicable={},
#>     limitations={},
#>     description={A list of state variables to be edited. By default, MPACT edits
#>        \texttt{pin\_powers}, \texttt{pin\_exposures}, \texttt{core\_flux},
#>        \texttt{pin\_fuel\_temp}, and \texttt{pin\_isotopes\_Xe-135}.  For PWR cases,
#>        \texttt{pin\_mod\_dens} and \texttt{pin\_mod\_temp} are added to the default
#>        edits; for BWR cases, \texttt{pin\_cool\_dens}, \texttt{pin\_cool\_temp}, and
#>        \texttt{pin\_cool\_void} are added to the default edits.  Once an edit is enabled,
#>        it remains enabled until all edits are disabled using the \texttt{none} option.  If
#>        the \texttt{none} option appears in the same state as other edit names, then all
#>        previously enabled edits are disabled first, then the edits named at the same state
#>        as \texttt{none} are enabled.  The default edits are never disabled, even if
#>        \texttt{none} is specified. \newline
#>        \newline
#>        Individual isotopes can be edited using \texttt{pin\_isotopes\_} followed by the
#>        isotope in ZZ-AAA format.  For example, \texttt{pin\_isotopes\_U-235}.  The same is
#>        true for \texttt{intrapin\_<mat\_type>\_isotopes\_}, \texttt{fsr\_isotopes\_}, and
#>        \texttt{point\_isotopes\_}.  Similarly, group fluxes can be edited using
#>        \texttt{pin\_flux\_} followed by a 3 digit group identifier.  For example,
#>        \texttt{pin\_flux\_001} gives the fast group and \texttt{pin\_flux\_051} gives the
#>        most thermal group when using a 51-group cross section library.  The same is
#>        true for \texttt{point\_flux\_} and \texttt{fsr\_flux\_}.  It should be noted
#>        that the \texttt{core\_flux} edit automatically implies the core-averaged flux
#>        for each group, so \texttt{core\_flux\_001} is not a valid option. \newline
#>        \newline
#>        Intrapin edits may be requested using the following entry format
#>        \texttt{intrapin\_<mat\_type>\_<edit\_type>}.  Currently supported \texttt{mat\_type}
#>        values include \texttt{fuel}, \texttt{gap}, \texttt{clad}, \texttt{mod}, and \texttt{cool}.
#>        One may also use \texttt{intrapin\_<edit\_type>} for editing all material intrapin
#>        values.  Currently supported \texttt{edit\_type} values include \texttt{dens},
#>        \texttt{temp}, \texttt{volume}, and \texttt{isotopes\_}.  Two additional intrapin edits,
#>        \texttt{intrapin\_fluence} for the fluence of all intrapin regions, and
#>        \texttt{intrapin\_exposure} for the intrapin fuel burnup distribution are also supported.
#>        When intrapin edits are requested, they are compressed into a 1-D array in the output
#>        HDF5 file.  This 1-D array can be translated into a more traditional core map
#>        representation using the accompaning \texttt{intrapin\_<mat\_type>\_PinFirstRegionIndex}
#>        and \texttt{intrapin\_<mat\_type>\_PinNumRegions} datasets generated for each
#>        \texttt{mat\_type} requested.  \texttt{intrapin\_<mat\_type>\_PinFirstRegionIndex}
#>        indicates the starting index of a given pin location in the 1-D array, and
#>        \texttt{intrapin\_<mat\_type>\_PinNumRegions} indicates the number of values
#>        associated with said pin that occur sequentially in the 1-D array starting at the
#>        corresponding \texttt{intrapin\_<mat\_type>\_PinFirstRegionIndex} starting index. \newline
#>        \newline
#>        MPACT provides a number of collections of edits for ease of use:
#>        \begin{itemize}
#>          \item \texttt{pin\_flux\_2g} implies both \texttt{pin\_flux\_fast} and
#>            \texttt{pin\_flux\_thermal}.  The same is true for \texttt{point\_flux\_2g}
#>            and \texttt{fsr\_flux\_2g}
#>          \item \texttt{pin\_flux} implies \texttt{pin\_flux\_001}, \texttt{pin\_flux\_002},
#>            etc., up to the number of energy groups in the problem.  The same is true for
#>            \texttt{point\_flux} and \texttt{fsr\_flux}
#>          \item \texttt{pin\_isotopes\_all} implies every isotope that exists in the transport
#>            and depletion libraries.  The same is true for \texttt{fsr\_isotopes\_all},
#>            \texttt{point\_isotopes\_all}, and \texttt{intrapin\_isotopes\_all}.
#>          \item \texttt{fsr\_delayed-chi} implies the delayed chi edits for each delayed
#>            neutron group.
#>          \item \texttt{fsr\_dnpy} implies the delayed neutron precursor yields edits for
#>            each delayed neutron group.
#>          \item \texttt{fsr\_dnpy} implies the delayed neutron precursor decay constants
#>            edits for each delayed neutron group.
#>        \end{itemize}
#>        Users can define ``edit groups'' using the \texttt{edit\_group} option.  These can
#>        be specified in this card as well to enable whole groups of edits.  This is a convenient
#>        shorthand for when a particular set of edits will be enabled and disabled multiple times
#>        during a simulation.},
#>     notes={One limitation in this card occurs when a user enables an edit using its name, a
#>       user-defined group, and an internal group of edits in MPACT all in the same calculation.
#>       For example, enabling \texttt{pin\_flux\_001} by referring to \texttt{pin\_flux\_001},
#>       \texttt{pin\_flux}, and a user-defined \texttt{edit\_group} option that includes
#>       \texttt{pin\_flux\_001} will result in unpredictable behavior and potentially crash the code.
#>       It is recommended that if any of the above built-in shorthands are used, that the user
#>       should not name any of their components inside an \texttt{edit\_group} option.  However,
#>       in this example, if the \texttt{edit\_group} option included \texttt{pin\_flux} instead of
#>       \texttt{pin\_flux\_001}, the references will be correctly resolved.}
#>   }
  edit:
    <<: *dtlist
    _style: multi-line
    _content:
    _check:
#>
#>   {\bf reset\_sol} solution\_reset\_bool
#>   \VERAInputTable{
#>     name={solution\_reset\_bool},
#>     type={Boolean},
#>     need={Optional},
#>     unitsdefault={},
#>     unitsother={},
#>     valuedefault={False},
#>     valuesapplicable={True},
#>     limitations={},
#>     description={Resets the initial guess of the flux in MPACT.},
#>     notes={}
#>   }
  reset_sol:
    <<: *dtbool
    _content:
    _check:
      - is_word()
      - in_dictionary() true false
#>
#>   {\bf rodbank} bank\_labels bank\_pos
#>   \VERAInputTable{
#>     name={bank\_labels},
#>     type={Character String},
#>     need={Optional},
#>     unitsdefault={},
#>     unitsother={},
#>     valuedefault={},
#>     valuesapplicable={},
#>     limitations={},
#>     description={List of control rod banks to position. Labels correspond to
#>        \texttt{crd\_map} in \texttt{CORE} block.},
#>     notes={Every \texttt{bank\_label} must have a corresponding \texttt{bank\_pos}.}
#>   }
#>   \VERAInputTable{
#>     name={bank\_pos},
#>     type={Float},
#>     need={Optional},
#>     unitsdefault={},
#>     unitsother={},
#>     valuedefault={},
#>     valuesapplicable={$\ge 0$},
#>     limitations={},
#>     description={Steps withdrawn for each bank in list},
#>     notes={Every \texttt{bank\_pos} must have a corresponding \texttt{bank\_label}. Example:
#>        \texttt{rodbank SA 228 SB 50 SD 0 A 228}}
#>   }
  rodbank:
    <<: *dtlist
    _style: multi-line
    _content:
    _check:
      - fall(sub{is_word(shift)},())
      - fall(sub{is_float(shift)},odd([]))
      - fall(sub{is_geq(shift,0)},odd([]))
#>
#>   {\bf feedback} feedback\_option

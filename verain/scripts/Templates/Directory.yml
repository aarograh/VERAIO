    <<: *dtword
    _content:
    _check:
      - is_word()
      - in_dictionary() nem senm nem-mg sp1 sp3 sp5 hysp3 fhp3 p1 p3 p5 hyp3 sn-0 sn-1 sn-2 sn-3 p3-mom senmp1 senmp3 senmp5 none

#>
#>   {\bf pin\_cell\_mod\_mesh} pin\_cell\_mod\_mesh
#>   \VERAInputTable{
#>     name={pin\_cell\_mod\_mesh},
#>     type={Array of mixed types int and string, Length = 2},
#>     need={Optional},
#>     unitsdefault={cm},
#>     unitsother={},
#>     valuedefault={\texttt{num\_rings} = 1, and \texttt{pin\_cell\_type} = fuel},
#>     valuesapplicable={                                                                %
#>       \begin{itemize}                                                                 %
#>         \item \texttt{num\_rings} --- positive integers. Practially less than 10.     %
#>         \item \texttt{pin\_cell\_type} --- "fuel", "nonfuel", "both".                 %
#>       \end{itemize}},
#>     limitations={This option does not work with explicit grid spacers. To use with    %
#>       grid spacers set the \texttt{grid\_treatment} option to \texttt{homogenize}.},
#>     description={This card is used to specify the MOC flat source region mesh         %
#>       in moderator outside the defined cylindrical geometry in specified pin cells.   %
#>       The radius of the outermost moderator ring is fixed at 0.95*sqrt(2)/2*pitch %
#>       This gives more refined meshing in the pin cell corners which improves accuracy %
#>       of calculations at room temperature},
#>     notes={When this card is not specified, the following value is used for the 1     %
#>       default moderator radius:                                                       %
#>       \texttt{max\_radii} = \texttt{0.75*(pitch*0.5 - r\_last)+r\_last}\ ,            %
#>       When this card is specified, that value changes to the following:               %
#>       \texttt{max\_radii} = \texttt{0.95*(0.5*pitch*sqrt(2))}\ ,                     %
#>       which is equal to 95\% of the way from the pin cell center to the corner.}
#>   }
  pin_cell_mod_mesh:
    <<: *dtlist
    _content:
    _check:
      - arraysize()==2
      - (is_int(nth(0,()))||nth(0,())==0)&&nth(0,())>=0
      - is_word(nth(1,()))
      - in_dictionary(nth(1,()),'fuel','nonfuel','both')
#>
#>   {\bf rad\_fuel\_mesh} rad\_fuel\_mesh
#>   \VERAInputTable{
#>     name={rad\_fuel\_mesh},
#>     type={double},
#>     need={Optional},
#>     unitsdefault={},
#>     unitsother={},
#>     valuedefault={},
#>     valuesapplicable={$>0.0$ or $<1.0$},
#>     limitations={Size must match radial divisions specified for fuel on the           %
#>       \texttt{mesh fuel} card. Not applicable to annular fuel},
#>     description={Fractional radii of MOC source regions in fuel},
#>     notes={}
#>   }
  rad_fuel_mesh:
    <<: *dtlist
    _content:
    _check:
      - fall(sub{is_float(shift)},())
      - fall(sub{is_gt(shift,0.0)},())
      - fall(sub{is_lt(shift,1.0)},())

#>     name={tp\_fric\_model},
#>     type={String},
#>     need={Optional},
#>     unitsdefault={},
#>     unitsother={},
#>     valuedefault={wallis},
#>     valuesapplicable={chisholm, lockhart},
#>     limitations={},
#>     description={
#>        Sets the two-phase multiplier model to use in CTF. Options are as follows:
#>        \begin{itemize}
#>        \item \texttt{wallis}: two-phase multiplier calculated based on void

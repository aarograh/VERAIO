#>     description={The minimum number of iterations CTF should take during a solve},
#>     notes={}
#>   }
  min_steps:
    <<: *dtint
    _content:
    _check:
      - is_int()
      - is_geq() 0
#>
#>   {\bf imox} imox
#>   \VERAInputTable{
#>     name={imox},
#>     type={Integer},
#>     need={Optional},
#>     unitsdefault={},
#>     unitsother={},
#>     valuedefault={0},
#>     valuesapplicable={0, 1, 2, 3, 4, 5},
#>     limitations={},

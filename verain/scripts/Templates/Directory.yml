      - is_gt() 0
  deplete:
    <<: *dtlist
    _content:
    _check:
      - fall(sub{is_float(shift)},())
      - nth(0,())==0
  rodbank:
    <<: *dtlist
    _style: multi-line
    _content:
    _check:
      - fall(sub{is_word(shift)},())
      - fall(sub{is_int(shift)},odd([]))
      - fall(sub{is_geq(shift,0)},odd([]))

#>   }
  thexp_tclad:
    <<: *dtlist
    _content:
    _check:
      - arraysize()==2
      - is_float(nth(0,()))
      - is_word(nth(1,()))
      - in_dictionary(nth(1,()),'F','C','K')
#>
#>   {\bf thexp\_tmod} moderator\_thermal\_expansion\_temperature units
#>   \VERAInputTable{
#>     name={moderator\_thermal\_expansion\_temperature},
#>     type={Float},
#>     need={Optional},
#>     unitsdefault={},
#>     unitsother={F, C},
#>     valuedefault={293 K},
#>     valuesapplicable={},
#>     limitations={},
#>     description={Temperature to use for thermal expansion of moderator and structural
#>        materials. If not present, \texttt{tinlet} is used instead.},
#>     notes={Example: \texttt{560 F}}
#>   }
  thexp_tmod:
    <<: *dtlist
    _content:
    _check:
      - arraysize()==2
      - is_float(nth(0,()))
      - is_word(nth(1,()))
      - in_dictionary(nth(1,()),'F','C','K')
#>
#>   {\bf expand3D} 3D\_thermal\_expansion\_option
#>   \VERAInputTable{
#>     name={3D\_thermal\_expansion\_option},
#>     type={Boolean},
#>     need={Optional},
#>     unitsdefault={},
#>     unitsother={},
#>     valuedefault={false},
#>     valuesapplicable={true},
#>     limitations={},
#>     description={Option to perform 3D thermal expansion. If set to false, thermal expansion
#>        will only be performed in the radial direction. When set to true, both radial and
#>        axial thermal expansion will be performed.},
#>     notes={}
#>   }
  expand3D:
    <<: *dtbool
    _content:
    _check:
      - is_word()
      - in_dictionary() true false
#>
#>   {\bf thexp\_outfile} thermal\_expansion\_outfile
#>   \VERAInputTable{
#>     name={thermal\_expansion\_outfile},
#>     type={Character String},
#>     need={Optional},
#>     unitsdefault={},
#>     unitsother={},
#>     valuedefault={},
#>     valuesapplicable={},
#>     limitations={},
#>     description={The name of the thermally expanded XML output. If the name of the outfile
#>        is the same as the XML input used to execute MPACT, the input file will be renamed
#>        to input\_filename.bak and the thermally expanded XML output will be in the output
#>        file. If not specified, no thermally expanded XML output file will be generated.},
#>     notes={}
#>   }
  thexp_outfile:
    <<: *dtstring
    _content:
    _check:
      - is_string()
#>
#>   {\bf thexp\_info} thermal\_expansion\_info

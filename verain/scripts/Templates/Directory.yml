#>     type={Float},
#>     need={Optional},
#>     unitsdefault={},
#>     unitsother={},
#>     valuedefault={0.5},
#>     valuesapplicable={$0.0 \le $ guide\_tube\_coefficient $\le 1.0$},
#>     limitations={},
#>     description={Used to determine the temperature rise in guide tubes using the following:
#>           T\_guide\_tube(z) = (T\_fluid(z)-T\_inlet)*guide\_tube\_coefficient+T\_inlet

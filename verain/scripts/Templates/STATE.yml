STATE:
  _pltype: list
  _do:
    - setdb MAIN_DB
  _content:

    title:
      _pltype: parameter
      _type: string
      _do:
        - copy STATE/$title
      _content:

    power:
      _pltype: parameter
      _type: double
      _do:
        - copy STATE/$power
      _content:

    flow:
      _pltype: parameter
      _type: double
      _do:
        - copy STATE/$flow
      _content:

    bypass:
      _pltype: parameter
      _type: double
      _do:
        - copy STATE/$bypass
      _content:

    xenopt:
      _pltype: parameter
      _type: string
      _do:
        - copy STATE/$xenon
      _content:

    samopt:
      _pltype: parameter
      _type: string
      _do:
        - copy STATE/$samar
      _content:

    bank_labels:
      _pltype: array
      _type: string
      _do:
        - copyarray STATE/@rodbank,select=>even
      _content:

    bank_pos:
      _pltype: array
      _type: int
      _do:
        - copyarray STATE/@rodbank,select=>odd
      _content:

    boron:
      _pltype: parameter
      _type: double
      _do:
        - copy STATE/$boron
      _content:

    b10:
      _pltype: parameter
      _type: double
      _do:
        - copy STATE/$b10:0
      _content:

    b10_depl:
      _pltype: parameter
      _type: bool
      _do:
        - copy STATE/$b10:1
      _content:

    tinlet:
      _pltype: parameter
      _type: double
      _do:
        - copy STATE/$tinlet,apply=>($_[0]-32)*5/9
      _content:

    pressure:
      _pltype: parameter
      _type: double
      _do:
        - copy STATE/$pressure,apply=>($_[0])*0.00689475729
      _content:

    search:
      _pltype: parameter
      _type: string
      _do:
        - copy STATE/$search
      _content:

    kcrit:
      _pltype: parameter
      _type: double
      _do:
        - copy STATE/$kcrit
      _content:

    deplete:
      _pltype: array
      _type: double
      _do:
        - copyarray STATE/@deplete,start=>1
      _content:

    deplete_units:
      _pltype: parameter
      _type: string
      _do:
        - copy STATE/@deplete:0
      _content:

    tfuel:
      _pltype: parameter
      _type: double
      _do:
        - copy STATE/$tfuel
      _content:

    modden:
      _pltype: parameter
      _type: double
      _do:
        - copy STATE/$modden
      _content:

    feedback:
      _pltype: parameter
      _type: string
      _do:
        - copy STATE/$feedback
      _content:

    sym:
      _pltype: parameter
      _type: string
      _do:
        - copy STATE/$sym
      _content:


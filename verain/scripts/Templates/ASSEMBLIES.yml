ASSEMBLIES:
  _pltype: list
  _do:
    - setdb MAIN_DB
    - namesunique %ASSEMBLY/*/$/%axial
    - isinmaps %ASSEMBLY/*/$/%axial,CORE/@assm_map

  _tr:
    _name: _loop
    _content: %ASSEMBLY/*/$/%axial

  _content:

    Assembly_(_loop):
      _pltype: list
      _do:
        - setdb MAIN_DB
        - setvar _path,%ASSEMBLY/*/$/%axial/$(_loop),apply=>&findfirst
        - getvar _path,apply=>&pathlevel,arg=>3
        - cellsmaps %ASSEMBLY/$(_path)/%rodmap,%ASSEMBLY/$(_path)/%cell,%ASSEMBLY/$(_path)/$npin,%ASSEMBLY/$(_path)/%axial/$(_loop),matsearch=>%ASSEMBLY/$(_path)/%mat/*:%ASSEMBLY/$(_path)/%fuel/*:CORE/%mat/*
      _content:

        label:
          _pltype: parameter
          _type: string
          _do:
            - value (_loop)
          _content:

        axial_labels:
          _pltype: array
          _type: string
          _do:
            - copyarray %ASSEMBLY/$(_path)/%axial/$(_loop),select=>odd
          _content:

        axial_elevations:
          _pltype: array
          _type: double
          _do:
            - copyarray %ASSEMBLY/$(_path)/%axial/$(_loop),select=>even
          _content:

        rpdlm_exposure:
          _pltype: array
          _type: double
          _do:
            - copyarray %ASSEMBLY/$(_path)/%rpdlm/$(_loop),select=>even
          _content:

        rpdlm_power:
          _pltype: array
          _type: double
          _do:
            - copyarray %ASSEMBLY/$(_path)/%rpdlm/$(_loop),select=>odd
          _content:

        Materials:
          _pltype: list
          _do:
            - matmap Material_,%ASSEMBLY/$(_path)/%mat/*
          _content:

        Fuels:
          _pltype: list
          _do:
            - fuelmap Fuel_,%ASSEMBLY/$(_path)/%fuel/*
          _content:

        title:
          _pltype: parameter
          _type: string
          _do:
            - copy %ASSEMBLY/$(_path)/$title
          _content:

        num_pins:
          _pltype: parameter
          _type: int
          _do:
            - copy %ASSEMBLY/$(_path)/$npin
          _content:

        ppitch:
          _pltype: parameter
          _type: double
          _do:
            - copy %ASSEMBLY/$(_path)/$ppitch
          _content:

        lower_nozzle_comp:
          _pltype: parameter
          _type: string
          _do:
            - copy %ASSEMBLY/$(_path)/@lower_nozzle:0
          _content:

        lower_nozzle_height:
          _pltype: parameter
          _type: double
          _do:
            - copy %ASSEMBLY/$(_path)/@lower_nozzle:1
          _content:

        lower_nozzle_mass:
          _pltype: parameter
          _type: double
          _do:
            - copy %ASSEMBLY/$(_path)/@lower_nozzle:2
          _content:

        lower_nozzle_loss:
          _pltype: parameter
          _type: double
          _do:
            - copy %ASSEMBLY/$(_path)/$lower_nozzle^/$loss
          _content:

        lower_nozzle_area:
          _pltype: parameter
          _type: double
          _do:
            - copy %ASSEMBLY/$(_path)/$lower_nozzle^/$area
          _content:

        upper_nozzle_comp:
          _pltype: parameter
          _type: string
          _do:
            - copy %ASSEMBLY/$(_path)/@upper_nozzle:0
          _content:

        upper_nozzle_height:
          _pltype: parameter
          _type: double
          _do:
            - copy %ASSEMBLY/$(_path)/@upper_nozzle:1
          _content:

        upper_nozzle_mass:
          _pltype: parameter
          _type: double
          _do:
            - copy %ASSEMBLY/$(_path)/@upper_nozzle:2
          _content:

        upper_nozzle_loss:
          _pltype: parameter
          _type: double
          _do:
            - copy %ASSEMBLY/$(_path)/$upper_nozzle^/$loss
          _content:

        upper_nozzle_area:
          _pltype: parameter
          _type: double
          _do:
            - copy %ASSEMBLY/$(_path)/$upper_nozzle^/$area
          _content:

        grid_elev:
          _pltype: array
          _type: double
          _do:
            - copyarray %ASSEMBLY/$(_path)/@grid_axial,select=>odd
          _content:

        grid_map:
          _pltype: array
          _type: string
          _do:
            - copyarray %ASSEMBLY/$(_path)/@grid_axial,select=>even
          _content:

        Temperature_Tables:
          _pltype: list

          _tr:
            _name: _lttabs
            _content: %ASSEMBLY/$(_path)/%temptable

          _content:

            (_lttabs):
              _pltype: list
              _content:

                qprime:
                  _pltype: parameter
                  _type: double
                  _do:
                    - copy %ASSEMBLY/$(_path)/%temptable/@(_lttabs):3
                  _content:

                burnup:
                  _pltype: array
                  _type: double
                  _do:
                    - copyarray %ASSEMBLY/$(_path)/%temptable/@(_lttabs),start=>5,stride=>3
                  _content:

                a_linear:
                  _pltype: array
                  _type: double
                  _do:
                    - copyarray %ASSEMBLY/$(_path)/%temptable/@(_lttabs),start=>6,stride=>3
                  _content:

                b_quadratic:
                  _pltype: array
                  _type: double
                  _do:
                    - copyarray %ASSEMBLY/$(_path)/%temptable/@(_lttabs),start=>7,stride=>3
                  _content:

                boundary:
                  _pltype: parameter
                  _type: string
                  _do:
                    - copy %ASSEMBLY/$(_path)/%temptable/@(_lttabs):1
                  _content:

        SpacerGrids:
          _pltype: list

          _tr:
            _name: _lgrid
            _content: %ASSEMBLY/$(_path)/%grid

          _content:

            Grid_(_lgrid):
              _pltype: list
              _do:
                - exclude %ASSEMBLY/$(_path)/%grid/$(_lgrid)^/$loss,%ASSEMBLY/$(_path)/%grid/$(_lgrid)^/$lossmap
              _content:

                label:
                  _pltype: parameter
                  _type: string
                  _do:
                    - value (_lgrid)
                  _content:

                material:
                  _pltype: parameter
                  _type: string
                  _do:
                    - copy %ASSEMBLY/$(_path)/%grid/@(_lgrid):0
                  _content:

                mass:
                  _pltype: parameter
                  _type: double
                  _do:
                    - copy %ASSEMBLY/$(_path)/%grid/@(_lgrid):2
                  _content:

                height:
                  _pltype: parameter
                  _type: double
                  _do:
                    - copy %ASSEMBLY/$(_path)/%grid/@(_lgrid):1
                  _content:

                gridloss:
                  _pltype: parameter
                  _type: double
                  _do:
                    - copy %ASSEMBLY/$(_path)/%grid/$(_lgrid)^/$loss
                  _content:

                lossmap:
                  _pltype: parameter
                  _type: string
                  _do:
                    - copy %ASSEMBLY/$(_path)/%grid/$(_lgrid)^/$lossmap
                  _content:

                gridblock:
                  _pltype: parameter
                  _type: double
                  _do:
                    - copy %ASSEMBLY/$(_path)/%grid/$(_lgrid)^/$blockage
                  _content:

                yhl1:
                  _pltype: parameter
                  _type: double
                  _do:
                    - copy %ASSEMBLY/$(_path)/%grid/$(_lgrid)^/$yhl1
                  _content:

                yhl2:
                  _pltype: parameter
                  _type: double
                  _do:
                    - copy %ASSEMBLY/$(_path)/%grid/$(_lgrid)^/$yhl2
                  _content:

                gridmap:
                  _pltype: parameter
                  _type: string
                  _do:
                    - copy %ASSEMBLY/$(_path)/%grid/$(_lgrid)^/$gridmap
                  _content:

                area:
                  _pltype: parameter
                  _type: double
                  _do:
                    - copy %ASSEMBLY/$(_path)/%grid/$(_lgrid)^/$area
                  _content:

                thickness:
                  _pltype: parameter
                  _type: double
                  _do:
                    - copy %ASSEMBLY/$(_path)/%grid/$(_lgrid)^/$thickness
                  _content:

        LossMaps:
          _pltype: list

          _tr:
            _name: _llossm
            _content: %ASSEMBLY/$(_path)/%lossmap

          _content:

            LossMap_(_llossm):
              _pltype: list
              _content:

                label:
                  _pltype: parameter
                  _type: string
                  _do:
                    - value (_llossm)
                  _content:

                lossmap:
                  _pltype: array
                  _type: double
                  _do:
                    - makemap %ASSEMBLY/$(_path)/$npin,%ASSEMBLY/$(_path)/%lossmap/@(_llossm),CORE/$bc_sym
                  _content:

        xcentroidoffset:
          _pltype: array
          _type: double
          _do:
            - makemap %ASSEMBLY/$(_path)/$npin,%ASSEMBLY/$(_path)/@xcentoffset,CORE/$bc_sym
          _content:

        ycentroidoffset:
          _pltype: array
          _type: double
          _do:
            - makemap %ASSEMBLY/$(_path)/$npin,%ASSEMBLY/$(_path)/@ycentoffset,CORE/$bc_sym
          _content:

        gapw:
          _pltype: parameter
          _type: double
          _do:
            - copy %ASSEMBLY/$(_path)/@gap:0
          _content:

        gapn:
          _pltype: parameter
          _type: double
          _do:
            - copy %ASSEMBLY/$(_path)/@gap:1
          _content:
        chanmat:
          _pltype: parameter
          _type: string
          _do:
            - copy %ASSEMBLY/$(_path)/@channel_box:0,existspath=>%ASSEMBLY/$(_path)/%mat/*:CORE/%mat/*
          _content:
        cornerth:
          _pltype: parameter
          _type: double
          _do:
            - copy %ASSEMBLY/$(_path)/@channel_box:1
          _content:
        cornerrad:
          _pltype: parameter
          _type: double
          _do:
            - copy %ASSEMBLY/$(_path)/@channel_box:2
          _content:
        chanth:
          _pltype: array
          _type: double
          _do:
            - copyarray %ASSEMBLY/$(_path)/@channel_box_segments,start=>0,stride=>3
          _content:
        chanlen:
          _pltype: array
          _type: double
          _do:
            - copyarray %ASSEMBLY/$(_path)/@channel_box_segments,start=>1,stride=>3
          _content:
        chanramp:
          _pltype: array
          _type: double
          _do:
            - copyarray %ASSEMBLY/$(_path)/@channel_box_segments,start=>2,stride=>3
          _content:

    RodFilters:
      _pltype: list
      _do:
        - setdb MAIN_DB
        - setvar _path,%ASSEMBLY/*/$/%axial/$(_loop),apply=>&findfirst
        - getvar _path,apply=>&pathlevel,arg=>3

      _tr:
        _name: _floop
        _content: %ASSEMBLY/$(_path)/%rod_filter

      _content:

        (_floop):
          _pltype: array
          _type: string
          _do:
            - makemap %ASSEMBLY/$(_path)/$npin,%ASSEMBLY/$(_path)/%rod_filter/$(_floop),CORE/$bc_sym
          _content:

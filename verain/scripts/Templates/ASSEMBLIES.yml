ASSEMBLIES:
  _pltype: list
  _do:
    - setdb MAIN_DB
    - rodmap %ASSEMBLY/$1/%axial,basename=>Assembly_,coremap=>CORE/@assm_map,matsearch=>%ASSEMBLY/$1/%mat/*:%ASSEMBLY/$1/%fuel/*:CORE/%mat/*
#    - isunique ASSEMBLY/%axial
    - setvar _path,%ASSEMBLY/$1/%axial,apply=>&pathfind

  _content:
    Materials:
      _pltype: list
      _do:
        - matmap Material_,%ASSEMBLY/$1/%mat/*
      _content:
    Fuels:
      _pltype: list
      _do:
        - fuelmap Fuel_,%ASSEMBLY/$1/%fuel/*
      _content:
    title:
      _pltype: parameter
      _type: string
      _do:
        - copy %ASSEMBLY/$1/$title
      _content:
    num_pins:
      _pltype: parameter
      _type: int
      _do:
        - copy %ASSEMBLY/$1/$npin
      _content:
    ppitch:
      _pltype: parameter
      _type: double
      _do:
        - copy %ASSEMBLY/$1/$ppitch
      _content:

    lower_nozzle_comp:
      _pltype: parameter
      _type: string
      _do:
        - copy %ASSEMBLY/$1/@lower_nozzle:0
      _content:

    lower_nozzle_height:
      _pltype: parameter
      _type: double
      _do:
        - copy %ASSEMBLY/$1/@lower_nozzle:1
      _content:

    lower_nozzle_mass:
      _pltype: parameter
      _type: double
      _do:
        - copy %ASSEMBLY/$1/@lower_nozzle:2
      _content:

    upper_nozzle_comp:
      _pltype: parameter
      _type: string
      _do:
        - copy %ASSEMBLY/$1/@upper_nozzle:0
      _content:

    upper_nozzle_height:
      _pltype: parameter
      _type: double
      _do:
        - copy %ASSEMBLY/$1/@upper_nozzle:1
      _content:

    upper_nozzle_mass:
      _pltype: parameter
      _type: double
      _do:
        - copy %ASSEMBLY/$1/@upper_nozzle:2
      _content:

    grid_elev:
      _pltype: array
      _type: double
      _do:
        - copyarray %ASSEMBLY/$1/@grid_axial,select=>odd
      _content:

    grid_map:
      _pltype: array
      _type: string
      _do:
        - copyarray %ASSEMBLY/$1/@grid_axial,select=>even
      _content:

    SpacerGrids:
      _pltype: list
      _do:
        - gridmap Grid_,%ASSEMBLY/$1/%grid/*
      _content:

    gapw:
      _pltype: parameter
      _type: double
      _do:
        - copy %ASSEMBLY/$1/@gap:0
      _content:
    gapn:
      _pltype: parameter
      _type: double
      _do:
        - copy %ASSEMBLY/$1/@gap:1
      _content:

    chanmat:
      _pltype: parameter
      _type: string
      _do:
        - copy %ASSEMBLY/$1/@channel_box:0,existspath=>%ASSEMBLY/$1/%mat/*:CORE/%mat/*
      _content:
    chanth:
      _pltype: parameter
      _type: double
      _do:
        - copy %ASSEMBLY/$1/@channel_box:1
      _content:
    chanrad:
      _pltype: parameter
      _type: double
      _do:
        - copy %ASSEMBLY/$1/@channel_box:2
      _content:
    cornerth:
      _pltype: parameter
      _type: double
      _do:
        - copy %ASSEMBLY/$1/@channel_box:3
      _content:
    cornerlen:
      _pltype: parameter
      _type: double
      _do:
        - copy %ASSEMBLY/$1/@channel_box:4
      _content:





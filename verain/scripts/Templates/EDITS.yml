EDITS:
  _pltype: list
  _do:
    - setdb MAIN_DB
  _content:

    axial_edit_bounds:
      _pltype: array
      _type: double
      _do:
        - copy EDITS/@axial_edit_bounds
      _content:

    axial_edit_mesh_delta:
      _pltype: parameter
      _type: double
      _do:
        - copy EDITS/$axial_edit_mesh_delta
      _content:

    points_type:
      _pltype: array
      _type: string
      _do:
        - copyarray EDITS/@points,start=>0,stride=>4
      _content:

    points_dim1:
      _pltype: array
      _type: double
      _do:
        - copyarray EDITS/@points,start=>1,stride=>4
      _content:

    points_dim2:
      _pltype: array
      _type: double
      _do:
        - copyarray EDITS/@points,start=>2,stride=>4
      _content:

    points_dim3:
      _pltype: array
      _type: double
      _do:
        - copyarray EDITS/@points,start=>3,stride=>4
      _content:

    edit_group:
      _pltype: list
      _do:

      _tr:
        _name: _loop
        _content: EDITS/%edit_group

      _content:

        (_loop):
          _pltype: list
          _do:

          _content:
            edit_group_name:
              _pltype: parameter
              _type: string
              _do:
                - value (_loop)
              _content:

            edit_vars:
              _pltype: array
              _type: string
              _do:
                - copyarray EDITS/%edit_group/$(_loop)
              _content:

    scrape_id:
      _pltype: array
      _type: int
      _do:
        - copyarray EDITS/@edit_scrape,start=>0,stride=>8
      _content:

    scrape_ida_col_row:
      _pltype: array
      _type: string
      _do:
        - copyarray EDITS/@edit_scrape,start=>1,stride=>8
      _content:

    scrape_idx:
      _pltype: array
      _type: int
      _do:
        - copyarray EDITS/@edit_scrape,start=>2,stride=>8
      _content:

    scrape_idy:
      _pltype: array
      _type: int
      _do:
        - copyarray EDITS/@edit_scrape,start=>3,stride=>8
      _content:

    scrape_min_th:
      _pltype: array
      _type: double
      _do:
        - copyarray EDITS/@edit_scrape,start=>4,stride=>8
      _content:

    scrape_max_th:
      _pltype: array
      _type: double
      _do:
        - copyarray EDITS/@edit_scrape,start=>5,stride=>8
      _content:

    scrape_min_z:
      _pltype: array
      _type: double
      _do:
        - copyarray EDITS/@edit_scrape,start=>6,stride=>8
      _content:

    scrape_max_z:
      _pltype: array
      _type: double
      _do:
        - copyarray EDITS/@edit_scrape,start=>7,stride=>8
      _content:

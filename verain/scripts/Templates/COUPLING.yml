COUPLING:
  _pltype: list
  _do:
    - setdb MAIN_DB
  _content:
    epsk:
      _pltype: parameter
      _type: double
      _do:
        - copy COUPLING/$epsk
      _content:

    epsp:
      _pltype: parameter
      _type: double
      _do:
        - copy COUPLING/$epsp
      _content:

    eps_boron:
      _pltype: parameter
      _type: double
      _do:
        - copy COUPLING/$eps_boron
      _content:

    eps_temp:
      _pltype: parameter
      _type: double
      _do:
        - copy COUPLING/$eps_temp
      _content:

    ctf_iters_max:
      _pltype: parameter
      _type: int
      _do:
        - copy COUPLING/$ctf_iters_max
      _content:

    ctf_iters_growth:
      _pltype: parameter
      _type: double
      _do:
        - copy COUPLING/$ctf_iters_growth
      _content:

    rlx_power:
      _pltype: parameter
      _type: double
      _do:
        - copy COUPLING/$rlx_power
      _content:

    rlx_tfuel:
      _pltype: parameter
      _type: double
      _do:
        - copy COUPLING/$rlx_tfuel
      _content:

    rlx_den:
      _pltype: parameter
      _type: double
      _do:
        - copy COUPLING/$rlx_den
      _content:

    rlx_crud:
      _pltype: parameter
      _type: double
      _do:
        - copy COUPLING/$rlx_crud
      _content:

    nonlinear_coupling_method:
      _pltype: list
      _content:
        unknowns:
          _pltype: array
          _type: string
          _do:
            - copyarray COUPLING/$nonlinear_coupling_method,select=>even
          _content:
        method:
          _pltype: array
          _type: string
          _do:
            - copyarray COUPLING/$nonlinear_coupling_method,select=>odd
          _content:

    anderson_options:
      _pltype: list
      _content:
        unknowns:
          _pltype: array
          _type: string
          _do:
            - copyarray COUPLING/$anderson_options,start=>0,stride=>4
          _content:
        depth:
          _pltype: array
          _type: int
          _do:
            - copyarray COUPLING/$anderson_options,start=>1,stride=>4
          _content:
        mixing_parameter:
          _pltype: array
          _type: double
          _do:
            - copyarray COUPLING/$anderson_options,start=>2,stride=>4
          _content:
        start:
          _pltype: array
          _type: int
          _do:
            - copyarray COUPLING/$anderson_options,start=>3,stride=>4
          _content:

    parconv_opt:
      _pltype: list
      _content:
        gammamode:
          _pltype: parameter
          _type: string
          _do:
            - copy COUPLING/$partconv_opt:0
          _content:

        est_fdintense:
          _pltype: parameter
          _type: double
          _do:
            - copy COUPLING/$partconv_opt:1
          _content:

        dperturb:
          _pltype: parameter
          _type: double
          _do:
            - copy COUPLING/$partconv_opt:2
          _content:

        fd_mul:
          _pltype: parameter
          _type: double
          _do:
            - copy COUPLING/$partconv_opt:3
          _content:

        Par_nchk:
          _pltype: parameter
          _type: int
          _do:
            - copy COUPLING/$partconv_opt:4
          _content:

        Par_multchk:
          _pltype: parameter
          _type: int
          _do:
            - copy COUPLING/$partconv_opt:5
          _content:

    maxiter:
      _pltype: parameter
      _type: int
      _do:
        - copy COUPLING/$maxiter
      _content:

    read_restart:
      _pltype: parameter
      _type: string
      _do:
        - copy COUPLING/$read_restart
      _content:

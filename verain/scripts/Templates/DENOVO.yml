DENOVO:
  _pltype: list
  _do:
    - setdb MAIN_DB
  _content:
    problem_name:
      _pltype: parameter
      _type: string
      _do:
        - copy DENOVO/$problem_name
      _content:

    xs_library:
      _pltype: parameter
      _type: string
      _do:
        - copy DENOVO/$xs_library
      _content:

    mat_library:
      _pltype: parameter
      _type: string
      _do:
        - copy DENOVO/$mat_library
      _content:

    mesh:
      _pltype: parameter
      _type: int
      _do:
        - copy DENOVO/$mesh
      _content:

    dimension:
      _pltype: parameter
      _type: int
      _do:
        - copy DENOVO/$dimension
      _content:

    do_transport:
      _pltype: parameter
      _type: bool
      _do:
        - copy DENOVO/$do_transport
      _content:

    do_output:
      _pltype: parameter
      _type: bool
      _do:
        - copy DENOVO/$do_output
      _content:

    num_blocks_i:
      _pltype: parameter
      _type: int
      _do:
        - copy DENOVO/$num_blocks_i
      _content:

    num_blocks_j:
      _pltype: parameter
      _type: int
      _do:
        - copy DENOVO/$num_blocks_j
      _content:

    num_z_blocks:
      _pltype: parameter
      _type: int
      _do:
        - copy DENOVO/$num_z_blocks
      _content:

    num_sets:
      _pltype: parameter
      _type: int
      _do:
        - copy DENOVO/$num_sets
      _content:

    num_groups:
      _pltype: parameter
      _type: int
      _do:
        - copy DENOVO/$num_groups
      _content:

    max_delta_z:
      _pltype: parameter
      _type: double
      _do:
        - copy DENOVO/$max_delta_z
      _content:

    partition_upscatter:
      _pltype: parameter
      _type: bool
      _do:
        - copy DENOVO/$partition_upscatter
      _content:

    store_fulcrum_string:
      _pltype: parameter
      _type: string
      _do:
        - copy DENOVO/$store_fulcrum_string
      _content:

    mg_solver:
      _pltype: parameter
      _type: string
      _do:
        - copy DENOVO/$mg_solver
      _content:

    eigen_solver:
      _pltype: parameter
      _type: string
      _do:
        - copy DENOVO/$eigen_solver
      _content:

    iterate_downscatter:
      _pltype: parameter
      _type: bool
      _do:
        - copy DENOVO/$iterate_downscatter
      _content:

    downscatter:
      _pltype: parameter
      _type: string
      _do:
        - copy DENOVO/$downscatter
      _content:

    pn_order:
      _pltype: parameter
      _type: int
      _do:
        - copy DENOVO/$pn_order
      _content:

    aztec_kspace:
      _pltype: parameter
      _type: int
      _do:
        - copy DENOVO/$aztec_kspace
      _content:

    max_itr:
      _pltype: parameter
      _type: int
      _do:
        - copy DENOVO/$max_itr
      _content:

    tolerance:
      _pltype: parameter
      _type: double
      _do:
        - copy DENOVO/$tolerance
      _content:

    quadrature_database:
      _pltype: list
      _content:
        quad_type:
          _pltype: parameter
          _type: string
          _do:
            - copy DENOVO/$quad_type
          _content:

        polar_angles:
          _pltype: parameter
          _type: int
          _do:
            - copy DENOVO/$polar_angles
          _content:

        azimuthal_angles:
          _pltype: parameter
          _type: int
          _do:
            - copy DENOVO/$azimuthal_angles
          _content:

        sn_order:
          _pltype: parameter
          _type: int
          _do:
            - copy DENOVO/$sn_order
          _content:

        azimuthals_octant:
          _pltype: parameter
          _type: int
          _do:
            - copy DENOVO/$azimuthals_octant
          _content:

        polars_octant:
          _pltype: parameter
          _type: int
          _do:
            - copy DENOVO/$polars_octant
          _content:

    eigenvalue_database:
      _pltype: list
      _content:
  
        k_tolerance:
          _pltype: parameter
          _type: double
          _do:
            - copy DENOVO/$k_tolerance
          _content:

        l2_tolerance:
          _pltype: parameter
          _type: double
          _do:
            - copy DENOVO/$l2_tolerance
          _content:
    
        arnoldi_kspace:
          _pltype: parameter
          _type: int
          _do:
            - copy DENOVO/$arnoldi_kspace
          _content:
    
        arnoldi_restarts:
          _pltype: parameter
          _type: int
          _do:
            - copy DENOVO/$arnoldi_restarts
          _content:
    
        diagnostic_level:
          _pltype: parameter
          _type: int
          _do:
            - copy DENOVO/$diagnostic_level
          _content:
    
    upscatter_database:
      _pltype: list
      _content:
      
        tolerance:
          _pltype: parameter
          _type: double
          _do:
            - copy DENOVO/$upscatter_tolerance
          _content:
    
        aztec_diag:
          _pltype: parameter
          _type: int
          _do:
            - copy DENOVO/$aztec_diag
          _content:
    
        aztec_output:
          _pltype: parameter
          _type: int
          _do:
            - copy DENOVO/$aztec_output
          _content:
          
    silo_database:
      _pltype: list
      _content:
      
        silo_output:
          _pltype: parameter
          _type: string
          _do:
            - copy DENOVO/$silo_output
          _content:
    
        mixing_table:
          _pltype: parameter
          _type: bool
          _do:
            - copy DENOVO/$mixing_table
          _content:
    eq_set:
      _pltype: parameter
      _type: string
      _do:
        - copy DENOVO/$eq_set
      _content:
    energy_dep_ev:
      _pltype: parameter
      _type: bool
      _do:
        - copy DENOVO/$energy_dep_ev
      _content:
    new_grp_bounds:
      _pltype: array
      _type: double
      _do:
        - copyarray DENOVO/@new_grp_bounds
      _content:

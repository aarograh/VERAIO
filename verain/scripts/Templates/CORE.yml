    bc_sym:
      _pltype: parameter
      _type: string
      _do:
        - copy CORE/$bc_sym
      _content:

    bc_top:
      _pltype: parameter
      _type: string
      _do:
        - copy CORE/$bc_top
      _content:

    bc_rad:
      _pltype: parameter
      _type: string
      _do:
        - copy CORE/$bc_rad
      _content:

    xlabel:
      _pltype: array
      _type: string
      _do:
        - copy CORE/@xlabel
      _content:

    ylabel:
      _pltype: array
      _type: string
      _do:
        - copy CORE/@ylabel
      _content:

    height:
      _pltype: parameter
      _type: double
      _do:
        - copy CORE/$height
      _content:

    Materials:
      _pltype: list
      _do:
        - matmap Material_,CORE/%zirc/*,CORE/%aic/*,CORE/%he/*,CORE/%b4c/*,CORE/%inc/*,CORE/%ss/*,CORE/%mat/*
      _content:

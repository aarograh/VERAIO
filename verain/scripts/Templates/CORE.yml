CORE:
  _pltype: list
  _do:
    - setdb MAIN_DB
    - exclude CORE/@crd_map,CORE/@blade_map
    - exclude CORE/@det_map,CORE/@bwrdet_map
  _content:

    op_date:
      _pltype: parameter
      _type: string
      _do:
        - copy CORE/$op_date
      _content:

    rated_power:
      _pltype: parameter
      _type: double
      _do:
        - copy CORE/@rated:0
      _content:

    rated_flow:
      _pltype: parameter
      _type: double
      _do:
        - copy CORE/@rated:1,apply=>$_[0]*125.9978
      _content:

    bypass_flow_table:
      _pltype: list
      _content:
        x_labels:
          _pltype: array
          _type: double
          _do:
            - copytable CORE/@bypass_flow_table,columns=>1
          _content:
        y_labels:
          _pltype: array
          _type: double
          _do:
            - copytable CORE/@bypass_flow_table,rows=>1
          _content:
        table_data:
          _pltype: array
          _type: double
          _do:
            - copytable CORE/@bypass_flow_table,data=>1
          _content:

    tinlet_table_power:
      _pltype: array
      _type: double
      _do:
        - copyarray CORE/@tinlet_table,start=>0,stride=>3
      _content:

    tinlet_table_temp:
      _pltype: array
      _type: double
      _do:
        - copyarray CORE/@tinlet_table,start=>1,stride=>3
      _content:

    tinlet_table_units:
      _pltype: array
      _type: string
      _do:
        - copyarray CORE/@tinlet_table,start=>2,stride=>3
      _content:

    rcs_volume:
      _pltype: parameter
      _type: double
      _do:
        - copy CORE/@rcs_volume
      _content:

    core_name:
      _pltype: parameter
      _type: string
      _do:
        - copy CORE/$name
      _content:

    core_size:
      _pltype: parameter
      _type: int
      _do:
        - copy CORE/$size
      _content:

    nblade:
      _pltype: parameter
      _type: int
      _do:
        - copy CORE/$nblade
      _content:

    nbwrdet:
      _pltype: parameter
      _type: int
      _do:
        - copy CORE/$nbwrdet
      _content:

    unit:
      _pltype: parameter
      _type: string
      _do:
        - copy CORE/$unit
      _content:

    cycle_num:
      _pltype: parameter
      _type: string
      _do:
        - copy CORE/$cycle
      _content:

    apitch:
      _pltype: parameter
      _type: double
      _do:
        - copy CORE/$apitch
      _content:

    baffle_thick:
      _pltype: parameter
      _type: double
      _do:
        - copy CORE/@baffle:2
      _content:

    baffle_gap:
      _pltype: parameter
      _type: double
      _do:
        - copy CORE/@baffle:1
      _content:

    baffle_mat:
      _pltype: parameter
      _type: string
      _do:
        - copy CORE/@baffle:0
      _content:

    pad_mat:
      _pltype: parameter
      _type: string
      _do:
        - copy CORE/@pad:0
      _content:

    pad_inner_radius:
      _pltype: parameter
      _type: double
      _do:
        - copy CORE/@pad:1
      _content:

    pad_outer_radius:
      _pltype: parameter
      _type: double
      _do:
        - copy CORE/@pad:2
      _content:

    pad_arc:
      _pltype: parameter
      _type: double
      _do:
        - copy CORE/@pad:3
      _content:

    pad_azi_locs:
      _pltype: array
      _type: double
      _do:
        - copyarray CORE/@pad,start=>4
      _content:

    pad_nonuniform_arc:
      _pltype: array
      _type: double
      _do:
        - copyarray CORE/@pad_nonuniform_arc,start=>0
      _content:

    vessel_mats:
      _pltype: array
      _type: string
      _do:
        - copyarray CORE/@vessel,start=>0,stride=>2
      _content:

    vessel_radii:
      _pltype: array
      _type: double
      _do:
        - copyarray CORE/@vessel,start=>1,stride=>2
      _content:

    hole_x:
      _pltype: array
      _type: double
      _do:
        - copyarray CORE/@hole,start=>0,stride=>3
      _content:

    hole_y:
      _pltype: array
      _type: double
      _do:
        - copyarray CORE/@hole,start=>1,stride=>3
      _content:

    hole_radius:
      _pltype: array
      _type: double
      _do:
        - copyarray CORE/@hole,start=>2,stride=>3
      _content:

    assm_map:
      _pltype: array
      _type: string
      _do:
        - coremapmap CORE/$size,CORE/@core_shape,CORE/@assm_map,CORE/$bc_sym
      _content:

    blade_map:
      _pltype: array
      _type: string
      _do:
        - makemap CORE/$nblade,CORE/@blade_map,CORE/$bc_sym
      _content:

    bwrdet_map:
      _pltype: array
      _type: string
      _do:
        - makemap CORE/$nbwrdet,CORE/@bwrdet_map,CORE/$bc_sym
      _content:

    inlet_orifice_map:
      _pltype: array
      _type: string
      _do:
        - coremapmap CORE/$size,CORE/@core_shape,CORE/@inlet_orifice_map,CORE/$bc_sym
      _content:

    InletOrifices:
      _pltype: list
      _tr:
        _name: _linlet_orifice_loss
        _content: CORE/%inlet_orifice_loss
      _content:
         InletOrifice_(_linlet_orifice_loss):
            _pltype: list
            _content:
               label:
                 _pltype: parameter
                 _type: string
                 _do:
                   - value (_linlet_orifice_loss)
                 _content:
               loss:
                 _pltype: parameter
                 _type: double
                 _do:
                   - copy CORE/%inlet_orifice_loss/@(_linlet_orifice_loss):0

               area:
                 _pltype: parameter
                 _type: double
                 _do:
                   - copy CORE/%inlet_orifice_loss/$(_linlet_orifice_loss)^/$area
                 _content:


    rotate_map:
      _pltype: array
      _type: int
      _do:
        - coremapmap CORE/$size,CORE/@core_shape,CORE/@rotate_map,CORE/$bc_sym,expand=>0,ignore=>0
      _content:

    insert_rotate_map:
      _pltype: array
      _type: int
      _do:
        - coremapmap CORE/$size,CORE/@core_shape,CORE/@insert_rotate_map,CORE/$bc_sym,expand=>0,ignore=>0
      _content:

    insert_map:
      _pltype: array
      _type: string
      _do:
        - coremapmap CORE/$size,CORE/@core_shape,CORE/@insert_map,CORE/$bc_sym
      _content:

    det_map:
      _pltype: array
      _type: string
      _do:
        - coremapmap CORE/$size,CORE/@core_shape,CORE/@det_map,CORE/$bc_sym
      _content:

    crd_map:
      _pltype: array
      _type: string
      _do:
        - coremapmap CORE/$size,CORE/@core_shape,CORE/@crd_map,CORE/$bc_sym
      _content:

    crd_bank:
      _pltype: array
      _type: string
      _do:
        - coremapmap CORE/$size,CORE/@core_shape,CORE/@crd_bank,CORE/$bc_sym
      _content:

    shape:
      _pltype: array
      _type: int
      _do:
        - copy CORE/@core_shape
      _content:

    lower_thick:
      _pltype: parameter
      _type: double
      _do:
        - copy CORE/@lower_plate:1
      _content:

    lower_mat:
      _pltype: parameter
      _type: string
      _do:
        - copy CORE/@lower_plate:0
      _content:

    lower_vfrac:
      _pltype: parameter
      _type: double
      _do:
        - copy CORE/@lower_plate:2
      _content:

    upper_thick:
      _pltype: parameter
      _type: double
      _do:
        - copy CORE/@upper_plate:1
      _content:

    upper_mat:
      _pltype: parameter
      _type: string
      _do:
        - copy CORE/@upper_plate:0
      _content:

    upper_vfrac:
      _pltype: parameter
      _type: double
      _do:
        - copy CORE/@upper_plate:2
      _content:

    bc_bot:
      _pltype: parameter
      _type: string
      _do:
        - copy CORE/$bc_bot
      _content:

    bc_sym:
      _pltype: parameter
      _type: string
      _do:
        - copy CORE/$bc_sym
      _content:

    bc_top:
      _pltype: parameter
      _type: string
      _do:
        - copy CORE/$bc_top
      _content:

    bc_rad:
      _pltype: parameter
      _type: string
      _do:
        - copy CORE/$bc_rad
      _content:

    xlabel:
      _pltype: array
      _type: string
      _do:
        - copy CORE/@xlabel
      _content:

    ylabel:
      _pltype: array
      _type: string
      _do:
        - copy CORE/@ylabel
      _content:

    label_format:
      _pltype: parameter
      _type: string
      _do:
        - copy CORE/@label_format
      _content:

    height:
      _pltype: parameter
      _type: double
      _do:
        - copy CORE/$height
      _content:

    sg_height:
      _pltype: parameter
      _type: double
      _do:
        - copy CORE/@steam_gen_natcirc:0
      _content:

    sg_flow_area:
      _pltype: parameter
      _type: double
      _do:
        - copy CORE/@steam_gen_natcirc:1
      _content:

    sg_dh:
      _pltype: parameter
      _type: double
      _do:
        - copy CORE/@steam_gen_natcirc:2
      _content:

    sg_length:
      _pltype: parameter
      _type: double
      _do:
        - copy CORE/@steam_gen_natcirc:3
      _content:

    sg_kf:
      _pltype: parameter
      _type: double
      _do:
        - copy CORE/@steam_gen_natcirc^/$loss
      _content:

    sg_epsr:
      _pltype: parameter
      _type: double
      _do:
        - copy CORE/@steam_gen_natcirc^/$roughness
      _content:

    chimney_height:
      _pltype: parameter
      _type: double
      _do:
        - copy CORE/@chimney:0
      _content:

    chimney_area:
      _pltype: parameter
      _type: double
      _do:
        - copy CORE/@chimney:1
      _content:

    chimney_dh:
      _pltype: parameter
      _type: double
      _do:
        - copy CORE/@chimney:2
      _content:

    chimney_kf:
      _pltype: parameter
      _type: double
      _do:
        - copy CORE/@chimney^/$loss
      _content:

    chimney_epsr:
      _pltype: parameter
      _type: double
      _do:
        - copy CORE/@chimney^/$roughness
      _content:

    dc_height:
      _pltype: parameter
      _type: double
      _do:
        - copy CORE/@downcomer:0
      _content:

    dc_area:
      _pltype: parameter
      _type: double
      _do:
        - copy CORE/@downcomer:1
      _content:

    dc_dh:
      _pltype: parameter
      _type: double
      _do:
        - copy CORE/@downcomer:2
      _content:

    dc_kf:
      _pltype: parameter
      _type: double
      _do:
        - copy CORE/@downcomer^/$loss
      _content:

    dc_epsr:
      _pltype: parameter
      _type: double
      _do:
        - copy CORE/@downcomer^/$roughness
      _content:

    upper_refl_mats:
      _pltype: array
      _type: string
      _do:
        - copyarray CORE/@upper_ref,start=>0,stride=>3
      _content:

    upper_refl_thicks:
      _pltype: array
      _type: double
      _do:
        - copyarray CORE/@upper_ref,start=>1,stride=>3
      _content:

    upper_refl_vfracs:
      _pltype: array
      _type: double
      _do:
        - copyarray CORE/@upper_ref,start=>2,stride=>3
      _content:

    lower_refl_mats:
      _pltype: array
      _type: string
      _do:
        - copyarray CORE/@lower_ref,start=>0,stride=>3
      _content:

    lower_refl_thicks:
      _pltype: array
      _type: double
      _do:
        - copyarray CORE/@lower_ref,start=>1,stride=>3
      _content:

    lower_refl_vfracs:
      _pltype: array
      _type: double
      _do:
        - copyarray CORE/@lower_ref,start=>2,stride=>3
      _content:

    Materials:
      _pltype: list
      _do:
        - matmap Material_,CORE/%mat/*
      _content:

    reactor_type:
      _pltype: parameter
      _type: string
      _do:
        - copy CORE/$reactor_type
      _content:

    Sources:
      _pltype: list
      _do:
        - sourcemap Source_,CORE/%source/*
      _content:

    sg_type:
      _pltype: parameter
      _type: string
      _do:
        - copy CORE/@steam_generator:0
      _content:

    sg_alloy:
      _pltype: parameter
      _type: int
      _do:
        - copy CORE/@steam_generator:1
      _content:

    sg_area:
      _pltype: parameter
      _type: double
      _do:
        - copy CORE/@steam_generator:2
      _content:

    sg_plug_frac:
      _pltype: parameter
      _type: double
      _do:
        - copy CORE/@steam_generator:3
      _content:

    hot_leg_alloy:
      _pltype: parameter
      _type: int
      _do:
        - copy CORE/@hot_leg_piping:0
      _content:

    hot_leg_area:
      _pltype: parameter
      _type: double
      _do:
        - copy CORE/@hot_leg_piping:1
      _content:

    cold_leg_alloy:
      _pltype: parameter
      _type: int
      _do:
        - copy CORE/@cold_leg_piping:0
      _content:

    cold_leg_area:
      _pltype: parameter
      _type: double
      _do:
        - copy CORE/@cold_leg_piping:1
      _content:

    cleanup_rated_flow:
      _pltype: parameter
      _type: double
      _do:
        - copy CORE/$cleanup_rated_flow
      _content:

    material_perturbation_file:
      _pltype: parameter
      _type: string
      _do:
        - copy CORE/$material_perturbation_file
      _content:

    bioshield_mats:
      _pltype: array
      _type: string
      _do:
        - copy CORE/@bioshield,start=>0,stride=>2
      _content:

    bioshield_radii:
      _pltype: array
      _type: double
      _do:
        - copy CORE/@bioshield,start=>1,stride=>2
      _content:

    det_label_locs:
      _pltype: array
      _type: string
      _do:
        - copy CORE/@det_locations,start=>0,stride=>4,existspath=>CORE/%det
      _content:

    det_rad_locs:
      _pltype: array
      _type: double
      _do:
        - copy CORE/@det_locations,start=>1,stride=>4
      _content:

    det_azi_locs:
      _pltype: array
      _type: double
      _do:
        - copy CORE/@det_locations,start=>2,stride=>4
      _content:

    det_elev_locs:
      _pltype: array
      _type: double
      _do:
        - copy CORE/@det_locations,start=>3,stride=>4
      _content:

    Excore_Detectors:
      _pltype: list

      _tr:
        _name: _ldet
        _content: CORE/%det

      _content:

        Excore_Detector_(_ldet):
          _pltype: list
          _content:

            label:
              _pltype: parameter
              _type: string
              _do:
                - value (_ldet)
              _content:

            mats:
              _pltype: array
              _type: string
              _do:
                - copy CORE/%det/@(_ldet),section=>1
              _content:

            radii:
              _pltype: array
              _type: double
              _do:
                - copy CORE/%det/@(_ldet),section=>0,isection=>1
              _content:

            type:
              _pltype: parameter
              _type: string
              _do:
                - copy CORE/%det/@(_ldet):0
              _content:

            heights:
              _pltype: array
              _type: double
              _do:
                - copy CORE/%det/@(_ldet),section=>2
              _content:

            response:
              _pltype: array
              _type: string
              _do:
                - copy CORE/%det/@(_ldet),section=>3,select=>even
              _content:

            well_type:
              _pltype: array
              _type: string
              _do:
                - copy CORE/%det/@(_ldet),section=>3,select=>odd
              _content:


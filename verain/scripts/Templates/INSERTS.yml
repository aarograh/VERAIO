INSERTS:
  _pltype: list
  _do:
    - setdb MAIN_DB
    - rodmap INSERT/%axial,basename=>Insert_,coremap=>CORE/@insert_map,matsearch=>INSERT/%mat/*:CORE/%mat/*
  _content:
    Materials:
      _pltype: list
      _do:
        - matmap Material_,INSERT/%mat/*
      _content:
    title:
      _pltype: parameter
      _type: string
      _do:
        - copy INSERT/$title
      _content:
    num_pins:
      _pltype: parameter
      _type: int
      _do:
        - copy INSERT/$npin
      _content:

INSERTS:
  _pltype: list
  _do:
    - setdb MAIN_DB
    - rodmap INSERT/%axial,basename=>Insert_,coremap=>CORE/@insert_map,matsearch=>INSERT/%zirc/*:INSERT/%aic/*:INSERT/%he/*:INSERT/%b4c/*:INSERT/%inc/*:INSERT/%ss/*:INSERT/%pyrex/*:INSERT/%mat/*:CORE/%zirc/*:CORE/%aic/*:CORE/%he/*:CORE/%b4c/*:CORE/%inc/*:CORE/%ss/*:CORE/%pyrex/*:CORE/%mat/*
  _content:
    Materials:
      _pltype: list
      _do:
        - matmap Material_,INSERT/%zirc/*,INSERT/%aic/*,INSERT/%he/*,INSERT/%b4c/*,INSERT/%inc/*,INSERT/%ss/*,INSERT/%pyrex/*,INSERT/%mat/*
      _content:
    title:
      _pltype: parameter
      _type: string
      _do:
        - copy INSERT/$title
      _content:
    num_pins:
      _pltype: parameter
      _type: int
      _do:
        - copy INSERT/$npin
      _content:

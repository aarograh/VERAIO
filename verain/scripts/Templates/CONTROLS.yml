CONTROLS:
  _pltype: list
  _do:
    - setdb MAIN_DB
    - rodmap CONTROL/%axial,basename=>Control_,coremap=>CORE/@crd_map,matsearch=>CONTROL/%zirc/*:CONTROL/%aic/*:CONTROL/%he/*:CONTROL/%b4c/*:CONTROL/%inc/*:CONTROL/%ss/*:CONTROL/%pyrex/*:CONTROL/%mat/*:CORE/%zirc/*:CORE/%aic/*:CORE/%he/*:CORE/%b4c/*:CORE/%inc/*:CORE/%ss/*:CORE/%pyrex/*:CORE/%mat/*
  _content:
    Materials:
      _pltype: list
      _do:
        - matmap Material_,CONTROL/%zirc/*,CONTROL/%aic/*,CONTROL/%he/*,CONTROL/%b4c/*,CONTROL/%inc/*,CONTROL/%ss/*,CONTROL/%pyrex/*,CONTROL/%mat/*
      _content:
    title:
      _pltype: parameter
      _type: string
      _do:
        - copy CONTROL/$title
      _content:
    num_pins:
      _pltype: parameter
      _type: int
      _do:
        - copy CONTROL/$npin
      _content:
    stroke:
      _pltype: parameter
      _type: double
      _do:
        - copy CONTROL/@stroke:0
      _content:
    maxstep:
      _pltype: parameter
      _type: int
      _do:
        - copy CONTROL/@stroke:1
      _content:

CONTROLS:
  _pltype: list
  _do:
    - setdb MAIN_DB
    - rodmap CONTROL/%axial,basename=>Control_,coremap=>CORE/@crd_map,matsearch=>CONTROL/%mat/*:CORE/%mat/*
  _content:
    Materials:
      _pltype: list
      _do:
        - matmap Material_,CONTROL/%mat/*
      _content:
    title:
      _pltype: parameter
      _type: string
      _do:
        - copy CONTROL/$title
      _content:
    num_pins:
      _pltype: parameter
      _type: int
      _do:
        - copy CONTROL/$npin
      _content:
    stroke:
      _pltype: parameter
      _type: double
      _do:
        - copy CONTROL/@stroke:0
      _content:
    maxstep:
      _pltype: parameter
      _type: int
      _do:
        - copy CONTROL/@stroke:1
      _content:

    ntube:
      _pltype: parameter
      _type: integer
      _do:
        - copy CONTROL/@blade:0
      _content:
    tubecell:
      _pltype: parameter
      _type: string
      _do:
        - copy CONTROL/@blade:1
      _content:
    bladespan:
      _pltype: parameter
      _type: double
      _do:
        - copy CONTROL/@blade:2
      _content:
    bladeth:
      _pltype: parameter
      _type: double
      _do:
        - copy CONTROL/@blade:3
      _content:
    bladerad:
      _pltype: parameter
      _type: double
      _do:
        - copy CONTROL/@blade:4
      _content:
    bladesheath:
      _pltype: parameter
      _type: double
      _do:
        - copy CONTROL/@blade:5
      _content:
    bladewing:
      _pltype: parameter
      _type: double
      _do:
        - copy CONTROL/@blade:6
      _content:
    blademat:
      _pltype: parameter
      _type: string
      _do:
        - copy CONTROL/@blade:7
      _content:


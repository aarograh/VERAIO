CONTROLS:
  _pltype: list
  _do:
    - setdb MAIN_DB
    - namesunique %CONTROL/*/$/%axial
    - isinmaps %CONTROL/*/$/%axial,CORE/@crd_map
    - isinmaps %CONTROL/*/$/%axial,CORE/@blade_map

  _tr:
    _name: _loop
    _content: %CONTROL/*/$/%axial

  _content:

    Control_(_loop):
      _pltype: list
      _do:
        - setdb MAIN_DB
        - setvar _path,%CONTROL/*/$/%axial/$(_loop),apply=>&findfirst
        - getvar _path,apply=>&pathlevel,arg=>3
        - axialtype _axtyp,%CONTROL/$(_path)/%rodmap,%CONTROL/$(_path)/%bladetype,%CONTROL/$(_path)/%axial/$(_loop)
        - cellsmaps %CONTROL/$(_path)/%rodmap,%CONTROL/$(_path)/%cell,%CONTROL/$(_path)/$npin,%CONTROL/$(_path)/%axial/$(_loop),matsearch=>%CONTROL/$(_path)/%mat/*:CORE/%mat/*
        - blademaps %CONTROL/$(_path)/%bladetype,%CONTROL/$(_path)/%bladegeom,%CONTROL/$(_path)/%cell,%CONTROL/$(_path)/%axial/$(_loop),matsearch=>%CONTROL/$(_path)/%mat/*:CORE/%mat/*
        - clearvar _axtyp

      _content:

        label:
          _pltype: parameter
          _type: string
          _do:
            - value (_loop)
          _content:

        axial_labels:
          _pltype: array
          _type: string
          _do:
            - copyarray %CONTROL/$(_path)/%axial/$(_loop),select=>odd
          _content:

        axial_elevations:
          _pltype: array
          _type: double
          _do:
            - copyarray %CONTROL/$(_path)/%axial/$(_loop),select=>even
          _content:


        Materials:
          _pltype: list
          _do:
            - matmap Material_,%CONTROL/$(_path)/%mat/*
          _content:
        title:
          _pltype: parameter
          _type: string
          _do:
            - copy %CONTROL/$(_path)/$title
          _content:
        num_pins:
          _pltype: parameter
          _type: int
          _do:
            - copy %CONTROL/$(_path)/$npin
          _content:
        stroke:
          _pltype: parameter
          _type: double
          _do:
            - copy %CONTROL/$(_path)/@stroke:0
          _content:
        maxstep:
          _pltype: parameter
          _type: double
          _do:
            - copy %CONTROL/$(_path)/@stroke:1
          _content:


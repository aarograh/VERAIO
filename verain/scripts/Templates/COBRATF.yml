COBRATF:
  _pltype: list
  _do:
    - setdb MAIN_DB
  _content:
    nfuel:
      _pltype: parameter
      _type: int
      _do:
        - copy COBRATF/$nfuel
      _content:

    irfc:
      _pltype: parameter
      _type: int
      _do:
        - copy COBRATF/$irfc
      _content:

    epso:
      _pltype: parameter
      _type: double
      _do:
        - copy COBRATF/$epso
      _content:

    oitmax:
      _pltype: parameter
      _type: int
      _do:
        - copy COBRATF/$oitmax
      _content:

    iitmax:
      _pltype: parameter
      _type: int
      _do:
        - copy COBRATF/$iitmax
      _content:

    gridlabel:
      _pltype: array
      _type: string
      _do:
        - copyhash COBRATF/%gridloss,select=>keys
      _content:

    gridlloss:
      _pltype: array
      _type: double
      _do:
        - copyhash COBRATF/%gridloss,select=>values
      _content:

    dtmax:
      _pltype: parameter
      _type: double
      _do:
        - copy COBRATF/$dtmax
      _content:

    dtmin:
      _pltype: parameter
      _type: double
      _do:
        - copy COBRATF/$dtmin
      _content:

    tend:
      _pltype: parameter
      _type: double
      _do:
        - copy COBRATF/$tend
      _content:

    rtwfp:
      _pltype: parameter
      _type: double
      _do:
        - copy COBRATF/$rtwfp
      _content:

    courant:
      _pltype: parameter
      _type: double
      _do:
        - copy COBRATF/$courant
      _content:

    maxits:
      _pltype: parameter
      _type: int
      _do:
        - copy COBRATF/$maxits
      _content:

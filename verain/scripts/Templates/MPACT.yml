MPACT:
  _pltype: list
  _do:
    - setdb MAIN_DB
  _content:

    ray_spacing:
      _pltype: parameter
      _type: double
      _do:
        - copy MPACT/$ray_spacing
      _content:

    quad_set:
      _pltype: list
      _content:
        quad_type:
          _pltype: parameter
          _type: string
          _do:
            - copy MPACT/$quad_type
          _content:

        polars_octant:
          _pltype: parameter
          _type: int
          _do:
            - copy MPACT/$polars_octant
          _content:

        azimuthals_octant:
          _pltype: parameter
          _type: int
          _do:
            - copy MPACT/$azimuthals_octant
          _content:

    iteration_control:
      _pltype: list
      _content:
  
        k_tolerance:
          _pltype: parameter
          _type: double
          _do:
            - copy MPACT/$k_tolerance
          _content:

        flux_tolerance:
          _pltype: parameter
          _type: double
          _do:
            - copy MPACT/$flux_tolerance
          _content:
        
        cmfd:
          _pltype: parameter
          _type: bool
          _do:
            - copy MPACT/$cmfd
          _content:

        num_outers:
          _pltype: parameter
          _type: int
          _do:
            - copy MPACT/$num_outers
          _content:
    
        num_inners:
          _pltype: parameter
          _type: int
          _do:
            - copy MPACT/$num_inners
          _content:

        up_scatter:
          _pltype: parameter
          _type: int
          _do:
            - copy MPACT/$up_scatter
          _content:
    
    xs_library:
      _pltype: list
      _content:
      
        xs_type:
          _pltype: parameter
          _type: string
          _do:
            - copy MPACT/$xs_type
          _content:
    
        xs_filename:
          _pltype: parameter
          _type: string
          _do:
            - copy MPACT/$xs_filename
          _content:


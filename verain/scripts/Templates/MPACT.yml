MPACT:
  _pltype: list
  _do:
    - setdb MAIN_DB
  _content:

    quad_set:
      _pltype: list
      _content:
        quad_type:
          _pltype: parameter
          _type: string
          _do:
            - copy MPACT/$quad_type
          _content:

        polars_octant:
          _pltype: parameter
          _type: int
          _do:
            - copy MPACT/$pol_ang
          _content:

        azimuthals_octant:
          _pltype: parameter
          _type: int
          _do:
            - copy MPACT/$azi_ang
          _content:

    iteration_control:
      _pltype: list
      _content:
  
        k_tolerance:
          _pltype: parameter
          _type: double
          _do:
            - copy MPACT/$kconv
          _content:

        flux_tolerance:
          _pltype: parameter
          _type: double
          _do:
            - copy MPACT/$fluxconv
          _content:
        
        cmfd:
          _pltype: parameter
          _type: bool
          _do:
            - copy MPACT/$cmfd
          _content:

        num_outers:
          _pltype: parameter
          _type: int
          _do:
            - copy MPACT/$nouter
          _content:
    
        num_inners:
          _pltype: parameter
          _type: int
          _do:
            - copy MPACT/$ninner
          _content:

        up_scatter:
          _pltype: parameter
          _type: int
          _do:
            - copy MPACT/$nupscat
          _content:
    
    xs_library:
      _pltype: list
      _content:
      
        xs_type:
          _pltype: parameter
          _type: string
          _do:
            - copy MPACT/$xs_type
          _content:
    
        xs_path:
          _pltype: parameter
          _type: string
          _do:
            - copy MPACT/$xs_path
          _content:

        xs_file:
          _pltype: parameter
          _type: string
          _do:
            - copy MPACT/$xs_name
          _content:


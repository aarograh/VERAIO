MPACT:
  _pltype: list
  _do:
    - setdb MAIN_DB
  _content:

    ray_spacing:
      _pltype: parameter
      _type: double
      _do:
        - copy MPACT/$ray_spacing
      _content:

    valid_on:
      _pltype: parameter
      _type: bool
      _do:
        - copy MPACT/$valid_on
      _content:

    valid_delim:
      _pltype: parameter
      _type: string
      _do:
        - copy MPACT/$valid_delim
      _content:

    restart_mode:
      _pltype: parameter
      _type: string
      _do:
        - copy MPACT/$restart_mode
      _content:

    restart_file:
      _pltype: parameter
      _type: string
      _do:
        - copy MPACT/$restart_file
      _content:

    vis_edits:
      _pltype: parameter
      _type: string
      _do:
        - copy MPACT/$vis_edits
      _content:

    rod_treatment:
      _pltype: parameter
      _type: bool
      _do:
        - copy MPACT/$rod_treatment
      _content:

    jagged:
      _pltype: parameter
      _type: bool
      _do:
        - copy MPACT/$jagged
      _content:

    db_entry:
      _pltype: list
      _do:
        - mpact_db db_entry_,MPACT/%db_entry/*
      _content:

    quad_set:
      _pltype: list
      _content:
        quad_type:
          _pltype: parameter
          _type: string
          _do:
            - copy MPACT/$quad_type
          _content:

        polars_octant:
          _pltype: parameter
          _type: int
          _do:
            - copy MPACT/$polars_octant
          _content:

        azimuthals_octant:
          _pltype: parameter
          _type: int
          _do:
            - copy MPACT/$azimuthals_octant
          _content:

    mesh:
      _pltype: list
      _content:

        pinmesh:
          _pltype: list
          _do:
            - mpact_mesh pinmesh_,MPACT/%mesh/*
          _content:

        automesh_bounds_min:
          _pltype: parameter
          _type: double
          _do:
            - copy MPACT/@automesh_bounds:0
          _content:

        automesh_bounds_max:
          _pltype: parameter
          _type: double
          _do:
            - copy MPACT/@automesh_bounds:1
          _content:

        meshing_method:
          _pltype: parameter
          _type: string
          _do:
            - copy MPACT/$meshing_method
          _content:

        axial_mesh:
          _pltype: array
          _type: double
          _do:
            - copy MPACT/$axial_mesh
          _content:

    parallel_env:
      _pltype: list
      _content:

        num_space:
          _pltype: parameter
          _type: int
          _do:
            - copy MPACT/$num_space
          _content:

        num_angle:
          _pltype: parameter
          _type: int
          _do:
            - copy MPACT/$num_angle
          _content:

        num_energy:
          _pltype: parameter
          _type: int
          _do:
            - copy MPACT/$num_energy
          _content:

        num_threads:
          _pltype: parameter
          _type: int
          _do:
            - copy MPACT/$num_threads
          _content:

        method:
          _pltype: parameter
          _type: string
          _do:
            - copy MPACT/$par_method
          _content:

        filename:
          _pltype: parameter
          _type: string
          _do:
            - copy MPACT/$par_file
          _content:

    iteration_control:
      _pltype: list
      _content:

        k_tolerance:
          _pltype: parameter
          _type: double
          _do:
            - copy MPACT/$k_tolerance
          _content:

        flux_tolerance:
          _pltype: parameter
          _type: double
          _do:
            - copy MPACT/$flux_tolerance
          _content:

        num_outers:
          _pltype: parameter
          _type: int
          _do:
            - copy MPACT/$num_outers
          _content:

        num_inners:
          _pltype: parameter
          _type: int
          _do:
            - copy MPACT/$num_inners
          _content:

        up_scatter:
          _pltype: parameter
          _type: int
          _do:
            - copy MPACT/$up_scatter
          _content:

        scattering:
          _pltype: parameter
          _type: string
          _do:
            - copy MPACT/$scattering
          _content:

        depl_time_method:
          _pltype: parameter
          _type: string
          _do:
            - copy MPACT/$depl_time_method
          _content:

        boundary_update:
          _pltype: parameter
          _type: string
          _do:
            - copy MPACT/$boundary_update
          _content:

        depl_time_method:
          _pltype: parameter
          _type: string
          _do:
            - copy MPACT/$depl_time_method
          _content:

    depletion:
      _pltype: list
      _content:

        dep_edit:
          _pltype: parameter
          _type: string
          _do:
            - copy MPACT/$dep_edit
          _content:

        dep_substep:
          _pltype: parameter
          _type: int
          _do:
            - copy MPACT/$dep_substep
          _content:

    TH:
      _pltype: list
      _content:

        coupling_method:
          _pltype: parameter
          _type: string
          _do:
            - copy MPACT/$coupling_method
          _content:

        average_ftemp:
          _pltype: parameter
          _type: bool
          _do:
            - copy MPACT/$average_ftemp
          _content:

        shield_max_outers:
          _pltype: parameter
          _type: int
          _do:
            - copy MPACT/$shielder_th:0
          _content:

        shield_min_dT:
          _pltype: parameter
          _type: double
          _do:
            - copy MPACT/$shielder_th:1
          _content:

        shield_min_drho:
          _pltype: parameter
          _type: double
          _do:
            - copy MPACT/$shielder_th:2
          _content:

        outers_per_TH:
          _pltype: parameter
          _type: int
          _do:
            - copy MPACT/$outers_per_TH
          _content:

        ctf_basename:
          _pltype: parameter
          _type: string
          _do:
            - copy MPACT/$ctf_basename
          _content:

    cmfd:
      _pltype: list
      _content:

        cmfd:
          _pltype: parameter
          _type: string
          _do:
            - copy MPACT/$cmfd
          _content:

        solver:
          _pltype: parameter
          _type: string
          _do:
            - copy MPACT/$cmfd_solver
          _content:

        k_shift:
          _pltype: parameter
          _type: double
          _do:
            - copy MPACT/$k_shift
          _content:

        num_outers:
          _pltype: parameter
          _type: int
          _do:
            - copy MPACT/$cmfd_num_outers
          _content:

        up_scatter:
          _pltype: parameter
          _type: int
          _do:
            - copy MPACT/$cmfd_up_scatter
          _content:

        angle_decomp:
          _pltype: parameter
          _type: string
          _do:
            - copy MPACT/$cmfd_angle_decomp
          content:

    2d1d:
      _pltype: list
      _content:

        splitTL:
          _pltype: parameter
          _type: bool
          _do:
            - copy MPACT/$split_TL
          _content:

        TLtreatment:
          _pltype: parameter
          _type: string
          _do:
            - copy MPACT/$TL_treatment
          _content:

        nodal_method:
          _pltype: parameter
          _type: string
          _do:
            - copy MPACT/$nodal_method
          _content:

        under_relax:
          _pltype: parameter
          _type: double
          _do:
            - copy MPACT/$under_relax
          _content:

    xs_library:
      _pltype: list
      _content:

        xs_type:
          _pltype: parameter
          _type: string
          _do:
            - copy MPACT/$xs_type
          _content:

        xs_filename:
          _pltype: parameter
          _type: string
          _do:
            - copy MPACT/$xs_filename
          _content:

        xsshielder:
          _pltype: parameter
          _type: string
          _do:
            - copy MPACT/$xs_shielder
          _content:

        dep_filename:
          _pltype: parameter
          _type: string
          _do:
            - copy MPACT/$dep_filename
          _content:

        mats_file:
          _pltype: parameter
          _type: string
          _do:
            - copy MPACT/$mats_file
          _content:

        subgroup_set:
          _pltype: parameter
          _type: int
          _do:
            - copy MPACT/$subgroup_set
          _content:

        mod_mat:
          _pltype: parameter
          _type: string
          _do:
            - copy MPACT/$mod_mat
          _content:


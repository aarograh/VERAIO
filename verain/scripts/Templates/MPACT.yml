MPACT:
  _pltype: list
  _do:
    - setdb MAIN_DB
  _content:

    ray_spacing:
      _pltype: parameter
      _type: double
      _do:
        - copy MPACT/$ray_spacing
      _content:

    quad_set:
      _pltype: list
      _content:
        quad_type:
          _pltype: parameter
          _type: string
          _do:
            - copy MPACT/$quad_type
          _content:

        polars_octant:
          _pltype: parameter
          _type: int
          _do:
            - copy MPACT/$polars_octant
          _content:

        azimuthals_octant:
          _pltype: parameter
          _type: int
          _do:
            - copy MPACT/$azimuthals_octant
          _content:

    vis_edits:
      _pltype: parameter
      _type: string
      _do:
        - copy MPACT/$vis_edits
      _content:

    jagged:
      _pltype: parameter
      _type: bool
      _do:
        - copy MPACT/$jagged
      _content:

    mesh:
      _pltype: list
      _content:
  
        pinmesh:
          _pltype: list
          _do:
            - mpact_mesh pinmesh_,MPACT/%mesh/*
          _content:

        axial_mesh:
          _pltype: array
          _type: double
          _do:
            - copy MPACT/$axial_mesh
          _content:

    parallel_env:
      _pltype: list
      _content:
  
        num_space:
          _pltype: parameter
          _type: int
          _do:
            - copy MPACT/$num_space
          _content:

        num_angle:
          _pltype: parameter
          _type: int
          _do:
            - copy MPACT/$num_angle
          _content:

        num_energy:
          _pltype: parameter
          _type: int
          _do:
            - copy MPACT/$num_energy
          _content:

        num_threads:
          _pltype: parameter
          _type: int
          _do:
            - copy MPACT/$num_threads
          _content:
      
        method:
          _pltype: parameter
          _type: string
          _do:
            - copy MPACT/$par_method
          _content:

        filename:
          _pltype: parameter
          _type: string
          _do:
            - copy MPACT/$par_file
          _content:

    iteration_control:
      _pltype: list
      _content:
  
        k_tolerance:
          _pltype: parameter
          _type: double
          _do:
            - copy MPACT/$k_tolerance
          _content:

        flux_tolerance:
          _pltype: parameter
          _type: double
          _do:
            - copy MPACT/$flux_tolerance
          _content:

        num_outers:
          _pltype: parameter
          _type: int
          _do:
            - copy MPACT/$num_outers
          _content:
    
        num_inners:
          _pltype: parameter
          _type: int
          _do:
            - copy MPACT/$num_inners
          _content:

        up_scatter:
          _pltype: parameter
          _type: int
          _do:
            - copy MPACT/$up_scatter
          _content:

        scattering:
          _pltype: parameter
          _type: string
          _do:
            - copy MPACT/$scattering
          _content:

    cmfd:
      _pltype: list
      _content:
  
        cmfd:
          _pltype: parameter
          _type: string
          _do:
            - copy MPACT/$cmfd
          _content:

        solver:
          _pltype: parameter
          _type: string
          _do:
            - copy MPACT/$cmfd_solver
          _content:

        k_shift:
          _pltype: parameter
          _type: double
          _do:
            - copy MPACT/$k_shift
          _content:

        num_outers:
          _pltype: parameter
          _type: int
          _do:
            - copy MPACT/$cmfd_num_outers
          _content:

        up_scatter:
          _pltype: parameter
          _type: int
          _do:
            - copy MPACT/$cmfd_up_scatter
          _content:

    2d1d:
      _pltype: list
      _content:
  
        splitTL:
          _pltype: parameter
          _type: bool
          _do:
            - copy MPACT/$split_TL
          _content:

        TLtreatment:
          _pltype: parameter
          _type: string
          _do:
            - copy MPACT/$TL_treatment
          _content:

        nodal_method:
          _pltype: parameter
          _type: string
          _do:
            - copy MPACT/$nodal_method
          _content:

        under_relax:
          _pltype: parameter
          _type: double
          _do:
            - copy MPACT/$under_relax
          _content:

    xs_library:
      _pltype: list
      _content:
      
        xs_type:
          _pltype: parameter
          _type: string
          _do:
            - copy MPACT/$xs_type
          _content:
    
        xs_filename:
          _pltype: parameter
          _type: string
          _do:
            - copy MPACT/$xs_filename
          _content:

        subgroup_set:
          _pltype: parameter
          _type: int
          _do:
            - copy MPACT/$subgroup_set
          _content:


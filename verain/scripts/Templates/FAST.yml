FAST:
  _pltype: list
  _do:
    - setdb MAIN_DB
  _content:

    initial_plenum_pressure:
      _pltype: parameter
      _type: double
      _do:
        - copy FAST/$initial_plenum_pressure
      _content:

    initial_plenum_pressure_ifba:
      _pltype: parameter
      _type: double
      _do:
        - copy FAST/$initial_plenum_pressure_ifba
      _content:

    flux_to_power_ratio:
      _pltype: parameter
      _type: double
      _do:
        - copy FAST/$flux_to_power_ratio
      _content:

    mesh_nr:
      _pltype: parameter
      _type: int
      _do:
        - copy FAST/$mesh_nr
      _content:

    mesh_na:
      _pltype: parameter
      _type: int
      _do:
        - copy FAST/$mesh_na
      _content:

    mesh_max_deltaz:
      _pltype: parameter
      _type: double
      _do:
        - copy FAST/$mesh_max_deltaz
      _content:

    mesh_nc:
      _pltype: parameter
      _type: int
      _do:
        - copy FAST/$mesh_nc
      _content:

    max_deltat:
      _pltype: parameter
      _type: double
      _do:
        - copy FAST/$max_deltat
      _content:

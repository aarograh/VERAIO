DETECTORS:
  _pltype: list
  _do:
    - setdb MAIN_DB
    - rodmap DETECTOR/%axial,basename=>Detector_,coremap=>CORE/@det_map,matsearch=>DETECTOR/%zirc/*:DETECTOR/%aic/*:DETECTOR/%he/*:DETECTOR/%b4c/*:DETECTOR/%inc/*:DETECTOR/%ss/*:DETECTOR/%pyrex/*:DETECTOR/%mat/*:CORE/%zirc/*:CORE/%aic/*:CORE/%he/*:CORE/%b4c/*:CORE/%inc/*:CORE/%ss/*:CORE/%pyrex/*:CORE/%mat/*
  _content:
    Materials:
      _pltype: list
      _do:
        - matmap Material_,DETECTOR/%zirc/*,DETECTOR/%aic/*,DETECTOR/%he/*,DETECTOR/%b4c/*,DETECTOR/%inc/*,DETECTOR/%ss/*,DETECTOR/%pyrex/*,DETECTOR/%mat/*
      _content:
    title:
      _pltype: parameter
      _type: string
      _do:
        - copy DETECTOR/$title
      _content:
    num_pins:
      _pltype: parameter
      _type: int
      _do:
        - copy DETECTOR/$npin
      _content:

DETECTORS:
  _pltype: list
  _do:
    - setdb MAIN_DB
    - rodmap DETECTOR/%axial,basename=>Detector_,coremap=>CORE/@det_map
  _content:
    Materials:
      _pltype: list
      _do:
        - matmap Material_,DETECTOR/%vacuum/*,DETECTOR/%mod/*,DETECTOR/%uo2/*,DETECTOR/%zirc/*,DETECTOR/%pyrex/*,DETECTOR/%aic/*,DETECTOR/%he/*,DETECTOR/%b4c/*,DETECTOR/%inc/*,DETECTOR/%ss/*,DETECTOR/%boron/*
      _content:
    title:
      _pltype: parameter
      _type: string
      _do:
        - copy DETECTOR/$title
      _content:
    num_pins:
      _pltype: parameter
      _type: int
      _do:
        - copy DETECTOR/$npin
      _content:

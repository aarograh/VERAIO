DETECTORS:
  _pltype: list
  _do:
    - setdb MAIN_DB
    - rodmap DETECTOR/%axial,basename=>Detector_,coremap=>CORE/@det_map,matsearch=>DETECTOR/%mat/*:CORE/%mat/*
  _content:
    Materials:
      _pltype: list
      _do:
        - matmap Material_,DETECTOR/%mat/*
      _content:
    title:
      _pltype: parameter
      _type: string
      _do:
        - copy DETECTOR/$title
      _content:
    num_pins:
      _pltype: parameter
      _type: int
      _do:
        - copy DETECTOR/$npin
      _content:

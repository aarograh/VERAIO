DETECTORS:
  _pltype: list
  _do:
    - setdb MAIN_DB
    - rodmap CORE/@det_map,DETECTOR/%axial,basename=>Detector_
  _content:
    Materials:
      _pltype: list
      _do:
        - matmap Material_,INSERT/%vacuum/*,INSERT/%mod/*,INSERT/%uo2/*,INSERT/%zirc/*,INSERT/%pyrex/*,INSERT/%aic/*,INSERT/%he/*,INSERT/%b4c/*,INSERT/%inc/*,INSERT/%ss/*
      _content:
    title:
      _pltype: parameter
      _type: string
      _do:
        - copy DETECTOR/$title
      _content:
    num_pins:
      _pltype: parameter
      _type: int
      _do:
        - copy DETECTOR/$npin
      _content:

!Options for MGCMFD-PC Solver in MPACT.
! - MGCMFD-PC can provide a substantial reduction in CMFD run time
! - MGCMFD-PC is more suited for problems with Feedback
!
!
!Include this file in the MPACT block to use
!
![MPACT]

! msed option
   cmfd              adcmfd
   cmfd_solver       mgnode
   cmfd_shift_method constant
   k_shift           8.0
   cmfd_num_outers   8
   cmfd_num_outers_th 5
   cmfd_rtol          2.0e-3

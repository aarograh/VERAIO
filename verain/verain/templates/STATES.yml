STATES:
  _pltype: list
  _do:
    - setdb MAIN_DB
#    - setvar _path,%STATE/*/$/@rodbank,apply=>&pathfind
#    - getvar _path,apply=>'my @value=split(/\//,shift @_); splice(@value,2,1)';
#    - getvar _path,apply=>&pathlevel,arg=>3

  _tr:
    _name: _loop
    _content: %STATE

  _content:

    State_(_loop):
      _pltype: list
      _do:
        - setdb MAIN_DB

      _content:

        id:
          _pltype: parameter
          _type: string
          _do:
            - copy %STATE/$(_loop)/$id
          _content:


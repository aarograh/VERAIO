![MPACT]
   vis_edits         none
   rod_treatment     true
   grid_treatment    equal_mass

!moc
   ray_spacing       0.01  ! was 0.05
   azimuthals_octant 32    ! was 16
   polars_octant     3     ! was 2
   quad_type         CHEBYSHEV-YAMAMOTO
   shield_azimuthals_octant 8

!iteration_control
   k_tolerance       1e-6
   flux_tolerance    1e-6
   num_inners        2
   num_outers        500
   up_scatter        1
   scattering        TCP0

!cmfd
   cmfd              cmfd
   cmfd_solver       mgnode  !1gsweep
   k_shift           1.5
   cmfd_num_outers   20

!parallel
   num_space         1
   num_angle         1
   num_energy        1
   num_threads       1

!xs_library
 ! xs_filename       mpact47g_70s_v3.1_11032014.fmt
 ! xs_filename       mpact47g_70s_v4.0_11032014.fmt
   xs_filename       mpact47g_70s_v4.1m3_03192015.fmt
 ! xs_filename       mpact47g_71s_v4.1m3_03192015.fmt
   xs_type           ORNL
   subgroup_set      4
   dep_kernel        origen
   dep_filename      origen_data_paths_casl1.txt
   dep_edit          false

 !mesh
   mesh fuel         3 1 1 / 8 8 8 8 8 8
   mesh gtube        3 1   / 8 8 8 8 8
   automesh_bounds   2 20                   ! min, max
   meshing_method    nonfuel
